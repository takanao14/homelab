---
vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - dhcp-lease-observer
        - kea-dhcp4-server
        - meshcentral
        - ssh
        - tailscaled
      since_now: true
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        observer_host = get_hostname!()
        observer_unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
        .host = observer_host
        .unit = observer_unit
        if observer_unit == "dhcp-lease-observer.service" {
          parsed, parse_error = parse_json(string(.message) ?? "")
          if parse_error == null && is_object(parsed) {
            . = merge(., object!(parsed))
            .host = observer_host
            .unit = observer_unit
          }
        }
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"

# rpi4 serves AMT addressing (ADR-0002) and MeshCentral (ADR-0025), so it stays
# out of its own recovery path: it resolves through public DNS rather than
# dist1/dist2. Do not point it at the in-house resolvers. Two operators, because
# a single one failing takes the recovery path with it; bgw1 was dropped after
# ADR-0051 recorded its DNS timing out and mishandling DNSSEC-bogus answers.
netplan_ethernets:
  eth0:
    optional: true
    dhcp4: false
    dhcp6: false
    addresses:
      - "{{ ansible_host }}/24"
    routes:
      - to: default
        via: 192.168.10.1
    nameservers:
      addresses:
        - 9.9.9.9
        - 8.8.8.8
netplan_obsolete_files:
  - 50-cloud-init.yaml
netplan_disable_cloud_init_network: true
