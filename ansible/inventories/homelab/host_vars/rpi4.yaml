---
vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - dhcp-lease-observer
        - kea-dhcp4-server
        - meshcentral
        - ssh
        - tailscaled
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        observer_host = get_hostname!()
        observer_unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
        .host = observer_host
        .unit = observer_unit
        if observer_unit == "dhcp-lease-observer.service" {
          parsed, parse_error = parse_json(string(.message) ?? "")
          if parse_error == null && is_object(parsed) {
            . = merge(., object!(parsed))
            .host = observer_host
            .unit = observer_unit
          }
        }
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"
