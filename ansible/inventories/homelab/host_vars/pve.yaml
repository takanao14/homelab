---
startup_prd_guests:
  - gpuvm1

startup_sandbox_guests:
  # TrueNAS first: sandbox mounts its NFS export. The start task is idempotent,
  # so this is a no-op if Proxmox already brought the guest up.
  - truenas
  - sandbox-k0s-cp1
  - sandbox-k0s-worker1
  - sandbox-k0s-worker2
  - sandbox-k0s-worker3

# truenas is not defined in tf and not in the Ansible inventory, so no earlier
# shutdown phase touches it. Stopped over ACPI at the end of the hypervisor
# phase, once every managed guest is already down.
shutdown_unmanaged_guests:
  - truenas
