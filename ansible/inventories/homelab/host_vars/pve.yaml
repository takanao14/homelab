---
# Guests on this hypervisor that do not come back by themselves after a power
# cut. The sandbox cluster is the only one in the fleet: tf/k8s/sandbox/env.hcl
# sets on_boot = false because the cluster is not expected to run continuously.
# Everything else in tf/ sets on_boot = true and starts with its node.
startup_manual_guests:
  - sandbox-k0s-cp1
  - sandbox-k0s-worker1
  - sandbox-k0s-worker2
  - sandbox-k0s-worker3
