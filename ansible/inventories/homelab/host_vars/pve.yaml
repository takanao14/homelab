---
startup_prd_guests:
  - gpuvm1

startup_sandbox_guests:
  # Start TrueNAS first for the sandbox NFS mount; already-running is a no-op.
  - truenas
  - sandbox-k0s-cp1
  - sandbox-k0s-worker1
  - sandbox-k0s-worker2
  - sandbox-k0s-worker3

# TrueNAS is unmanaged; stop it via ACPI after managed guests.
shutdown_unmanaged_guests:
  - truenas
