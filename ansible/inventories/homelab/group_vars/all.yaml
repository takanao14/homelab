---
ansible_python_interpreter: /usr/bin/python3

# Central telemetry ingestion endpoints. The IPs are Cilium LB-IPAM addresses
# pinned in k8s/monitoring/values (loki.yaml / alloy.yaml) — keep in sync.
# Fixed IPs on purpose: log/metric shipping must not depend on DNS.
loki_endpoint: "http://192.168.30.250:3100"
alloy_otlp_server: "192.168.30.251"

# Central Vector syslog relay; rsyslog hosts forward here.
rsyslog_forward_host: "{{ hostvars['log1']['ansible_host'] }}"

# How long the package upgrade reboot waits for a host to come back. Suits VMs
# and LXC guests; slow physical hosts raise it in host_vars. A host that boots
# more slowly than this fails the run even though the reboot itself succeeded.
package_upgrade_reboot_timeout: 300
