---
# Cluster guests started during recovery; tf on_boot only covers host boot.
startup_prd_guests: []
startup_sandbox_guests: []

# Unmanaged guests stopped via ACPI after managed guests.
shutdown_unmanaged_guests: []

# Unmanaged guest ACPI shutdown timeout.
shutdown_unmanaged_timeout: 300

# Proxmox kernel tuning (`sysctl` role).
sysctl_settings:
  # Avoid swapping VM pages before genuine memory pressure.
  vm.swappiness: 10

# Use bundled chrony without altering systemd-timesyncd.
chrony_install: false
chrony_manage_timesyncd: false

# Per-node SimpleZone routes; direct inter-zone traffic avoids router hairpinning.
proxmox_simplezone_routes_interface: vmbr0
proxmox_simplezone_routes_file: /etc/network/interfaces.d/ansible-simplezone-routes
proxmox_simplezone_routes_map:
  pve:
    segment: 192.168.20.0/24
    via: "{{ hostvars['pve']['ansible_host'] }}"
  node1:
    segment: 192.168.30.0/24
    via: "{{ hostvars['node1']['ansible_host'] }}"
  node2:
    segment: 192.168.40.0/24
    via: "{{ hostvars['node2']['ansible_host'] }}"
  node3:
    segment: 192.168.50.0/24
    via: "{{ hostvars['node3']['ansible_host'] }}"
  node4:
    segment: 192.168.60.0/24
    via: "{{ hostvars['node4']['ansible_host'] }}"
  node5:
    segment: 192.168.70.0/24
    via: "{{ hostvars['node5']['ansible_host'] }}"

# Forward host logs to Vector; destination is defined in all.yaml.
rsyslog_forward_port: 514
rsyslog_forward_protocol: tcp
rsyslog_journal_input: true
rsyslog_ignore_previous_journal: true
rsyslog_queue_size: 10000
rsyslog_queue_high_watermark: 9000
rsyslog_queue_low_watermark: 7000
rsyslog_queue_max_disk_space: "256m"

# Non-journal logs; exact paths exclude rotated/state files. Keep sensitive fields out of labels.
rsyslog_file_inputs:
  - path: /var/log/pve/tasks/index
    tag: pve-task
  - path: /var/log/pveproxy/access.log
    tag: pveproxy-access
  - path: /var/log/pve-firewall.log
    tag: pve-firewall-file
  - path: /var/log/pveam.log
    tag: pveam

# Each independent Proxmox host manages its cluster-scoped metric definition.
proxmox_metric_server_manage_hosts:
  - pve
  - node1
  - node2
  - node3
  - node4
  - node5

proxmox_metric_server_definitions:
  - id: alloy-otlp
    type: opentelemetry
    server: "{{ alloy_otlp_server }}"
    port: 4318
    otel-protocol: http
    otel-path: /v1/metrics
    otel-compression: gzip
    state: present
