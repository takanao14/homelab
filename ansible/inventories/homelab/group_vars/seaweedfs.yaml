---
# Non-secret settings. The versioned backup bucket remains a post-install step
# (roles/seaweedfs/README.md).

# Public-download buckets: anonymous Read without List, served through Caddy.
#   firmware     - router / PC firmware images
#   cloud-images - custom image distribution
seaweedfs_public_buckets:
  - firmware
  - cloud-images

# packer/push.sh identity. SeaweedFS 4.37 requires bucket-global actions;
# multipart upload stays disabled to minimize permissions.
seaweedfs_s3_extra_identities:
  - name: imagebuilder
    access_key: "{{ seaweedfs_imagebuilder_access_key }}"
    secret_key: "{{ seaweedfs_imagebuilder_secret_key }}"
    actions: ["Read", "Write", "List"]

vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - seaweedfs
        - seaweedfs-admin
        - seaweedfs-backup
        - ssh
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        .host = get_hostname!()
        .unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"
