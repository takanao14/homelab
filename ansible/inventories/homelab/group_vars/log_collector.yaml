---
# loki_endpoint is defined in all.yaml without DNS dependency.

vector_config:
  sources:
    syslog_udp:
      type: socket
      address: "0.0.0.0:514"
      mode: udp
      decoding:
        codec: bytes

    syslog_tcp:
      type: socket
      address: "0.0.0.0:514"
      mode: tcp
      framing:
        method: newline_delimited
      decoding:
        codec: bytes

    # Collect log1 locally; LXC AppArmor blocks journald-to-rsyslog forwarding.
    journald:
      type: journald
      include_units:
        - vector
        - ssh

  transforms:
    parse_syslog:
      type: remap
      inputs:
        - syslog_udp
        - syslog_tcp
      source: |
        msg = string!(.message)
        .parse_error = false

        if match(msg, r'^<\d+>1 ') {
          # RFC 5424 (Catalyst 1200)
          parsed, err = parse_syslog(msg)
          if err == null {
            . = merge(., parsed)
          } else {
            .parse_error = true
          }
        } else if match(msg, r'^<\d+>\[') {
          # WiFi AP (non-standard)
          parsed, err = parse_regex(msg, r'^<(?P<pri>\d+)>\[(?P<mac>[^\]]+)\]\s+(?P<host>\S+)\s*:\s*(?P<message>.+)$')
          if err == null {
            pri = to_int!(parsed.pri)
            .severity = to_string(mod(pri, 8))
            .facility = to_string(floor(to_float(pri) / 8.0))
            .host = parsed.host
            .message = parsed.message
            .appname = parsed.mac
          } else {
            .parse_error = true
          }
        } else {
          # RFC 3164 variant (IX2106)
          parsed, err = parse_syslog(msg)
          if err == null {
            . = merge(., parsed)
          } else {
            .parse_error = true
          }
        }

        # Normalize required labels; prefer RFC 5424 hostname over source IP.
        if exists(.hostname) && !is_null(.hostname) {
          .host = .hostname
        } else if !exists(.host) || is_null(.host) {
          .host = .source_ip
        }
        if !exists(.appname) || is_null(.appname) { .appname = "unknown" }
        if !exists(.severity) || is_null(.severity) { .severity = "unknown" }

    parse_led_service:
      type: remap
      inputs:
        - parse_syslog
      source: |
        if .appname == "led-server" {
          app, err = parse_json(string(.message) ?? "")
          if err == null && is_object(app) && is_string(app.level) && is_string(app.fields.message) {
            .app = app
            .level = downcase(string!(app.level))
            .event = string(app.fields.event) ?? string!(app.fields.message)
            .app_parse_error = false
          } else {
            # Keep non-JSON native-library and startup errors searchable.
            .app_parse_error = true
          }
        }

    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        .host = get_hostname!()
        .unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"

  sinks:
    loki:
      type: loki
      inputs:
        - parse_led_service
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      buffer:
        type: disk
        max_size: 268435488
        when_full: block
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        appname: !unsafe "{{ appname }}"
        severity: !unsafe "{{ severity }}"

    loki_journald:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"

  tests:
    - name: LED JSON preserves syslog severity and exposes application level
      inputs:
        - insert_at: parse_led_service
          type: log
          log_fields:
            appname: led-server
            host: rpi3
            severity: info
            message: '{"level":"ERROR","fields":{"message":"display error","error":"invalid image"}}'
      outputs:
        - extract_from: parse_led_service
          conditions:
            - type: vrl
              source: >-
                .level == "error" && .severity == "info" && .event == "display error" &&
                .app.fields.error == "invalid image" && .app_parse_error == false
    - name: LED plaintext is retained
      inputs:
        - insert_at: parse_led_service
          type: log
          log_fields:
            appname: led-server
            message: 'Error: startup failed'
      outputs:
        - extract_from: parse_led_service
          conditions:
            - type: vrl
              source: '.message == "Error: startup failed" && .app_parse_error == true'
    - name: Other services remain unchanged
      inputs:
        - insert_at: parse_led_service
          type: log
          log_fields:
            appname: sshd
            message: 'session opened'
      outputs:
        - extract_from: parse_led_service
          conditions:
            - type: vrl
              source: '.appname == "sshd" && .message == "session opened" && !exists(.app) && !exists(.level)'
