---
k0s_service: k0scontroller

# Require all namespaces to be classified before shutdown.
k8s_shutdown_allow_unclassified: false

# Argo CD must bootstrap these components before it can self-heal the cluster.
k8s_gitops_controller_namespace: argocd
k8s_gitops_controller_resource: statefulset/argocd-application-controller
k8s_gitops_bootstrap_resources:
  - deployment/argocd-redis
  - deployment/argocd-repo-server
  - "{{ k8s_gitops_controller_resource }}"
