---
# Control-node kubeconfig keeps cordon/drain independent of target nodes.
k8s_kubeconfig: "~/.kube/prd.yaml"

# OpenEBS LocalPV is node-local; drain provides graceful stop, not rescheduling.
k8s_storage_providers:
  - openebs

# Ordered application shutdown; monitoring observes it and Argo CD stops last.
k8s_shutdown_namespaces:
  - comfyui
  - ollama
  - vllm
  - lemonade-server
  - open-webui
  - gpu-switch
  - homepage
  - headlamp
  - pdns-ui
  - external-dns
  - reloader
  - monitoring
  - argocd

# Infrastructure stops with the node; explicit classification guards omissions.
k8s_infrastructure_namespaces:
  - kube-system
  - openebs
  - cert-manager
  - external-secrets
  - envoy-gateway-system
