---
# One worker per core, following the LXC allocation going to cores = 2
# (tf/lxc/node2/resolver, tf/lxc/node3/resolver). The role default of 1 is the
# conservative choice for a role that cannot know its container's size; here the
# size is known. Workers share the LMDB cache, so this does not affect the cache
# sizing decided in ADR-0030.
knot_resolver_workers: 2

knot_resolver_server_addr: "{{ ansible_host }}"
knot_resolver_allowed_clients:
  - "{{ hostvars['dist1']['ansible_host'] }}/32"
  - "{{ hostvars['dist2']['ansible_host'] }}/32"

vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - knot-resolver
        - ssh
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        .host = get_hostname!()
        .unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"
        job: dns-resolver
