---
knot_resolver_server_addr: "{{ ansible_host }}"
knot_resolver_allowed_clients:
  - "{{ hostvars['dist1']['ansible_host'] }}/32"
  - "{{ hostvars['dist2']['ansible_host'] }}/32"

node_exporter_extra_args:
  - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector

vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - knot-resolver
        - ssh
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        .host = get_hostname!()
        .unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"
        job: dns-resolver
