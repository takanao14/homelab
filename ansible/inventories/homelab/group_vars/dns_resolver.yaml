---
# One worker per allocated LXC core (tf/lxc/node{2,3}/resolver).
knot_resolver_workers: 2

knot_resolver_server_addr: "{{ ansible_host }}"
knot_resolver_allowed_clients:
  - "{{ hostvars['dist1']['ansible_host'] }}/32"
  - "{{ hostvars['dist2']['ansible_host'] }}/32"

knot_resolver_forwarders:
  - address:
      - 8.8.8.8
      - 8.8.4.4
    transport: tls
    hostname: dns.google

vector_journald_units:
  - knot-resolver
  - ssh

# dns-overview dashboard queries the resolver logs by job.
vector_loki_extra_labels:
  job: dns-resolver
