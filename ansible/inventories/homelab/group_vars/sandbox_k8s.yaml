---
# Control-node kubeconfig; see prd_k8s.yaml.
k8s_kubeconfig: "~/.kube/sandbox.yaml"

# Keep aligned with K0S_STORAGE_PROVIDERS in k0s/env/sandbox.sh.
k8s_storage_providers:
  - openebs
  - nfs
k8s_nfs_server: 192.168.20.10
k8s_nfs_share: /mnt/tank1/kubernetes/sandbox

# Ordered application shutdown; monitoring observes it and Argo CD stops last.
k8s_shutdown_namespaces:
  - homepage
  - headlamp
  - pdns-ui
  - external-dns
  - reloader
  - monitoring
  - argocd

# Infrastructure stops with the node; explicit classification guards omissions.
k8s_infrastructure_namespaces:
  - kube-system
  - openebs
  - external-secrets
  - envoy-gateway-system
