---
caddy_ip: "{{ ansible_host }}"
caddy_upstreams:
  - hostname: pdns1.home.butaco.net
    backend: "{{ hostvars['ns1']['ansible_host'] }}:8081"
  - hostname: pdns2.home.butaco.net
    backend: "{{ hostvars['ns2']['ansible_host'] }}:8081"
  - hostname: pdns3.home.butaco.net
    backend: "{{ hostvars['ns3']['ansible_host'] }}:8081"
  - hostname: dnsdist1.home.butaco.net
    backend: "{{ hostvars['dist1']['ansible_host'] }}:8083"
  - hostname: dnsdist2.home.butaco.net
    backend: "{{ hostvars['dist2']['ansible_host'] }}:8083"
  - hostname: forgejo.home.butaco.net
    backend: "{{ hostvars['forgejo1']['ansible_host'] }}:3000"
  - hostname: truenas-ui.home.butaco.net
    # TrueNAS is not an Ansible-managed host, so no inventory entry to derive
    # this from; it stays a literal.
    backend: 192.168.20.10:443
    scheme: https
    tls_insecure: true   # TrueNAS uses a local (self-signed) cert; verify only the internal Caddy->TrueNAS leg is skipped
  - hostname: netbox-ui.home.butaco.net
    backend: "{{ hostvars['netbox1']['ansible_host'] }}:80"
  - hostname: openbao.home.butaco.net
    backend: "{{ hostvars['openbao1']['ansible_host'] }}:8200"
  - hostname: s3.home.butaco.net
    backend: "{{ hostvars['seaweedfs1']['ansible_host'] }}:8333"
  - hostname: seaweedfs-ui.home.butaco.net
    backend: "{{ hostvars['seaweedfs1']['ansible_host'] }}:23646"
  - hostname: meshcentral.home.butaco.net
    backend: "{{ hostvars['rpi4']['ansible_host'] }}:8443"

vector_config:
  sources:
    journald:
      type: journald
      include_units:
        - caddy
        - ssh
  transforms:
    parse_journald:
      type: remap
      inputs:
        - journald
      source: |
        .host = get_hostname!()
        .unit = string(._SYSTEMD_UNIT) ?? string(.SYSLOG_IDENTIFIER) ?? "unknown"
  sinks:
    loki:
      type: loki
      inputs:
        - parse_journald
      endpoint: "{{ loki_endpoint }}"
      encoding:
        codec: json
      healthcheck:
        enabled: false
      dangerously_allow_unconfined_template_resolution: true
      labels:
        host: !unsafe "{{ host }}"
        unit: !unsafe "{{ unit }}"
