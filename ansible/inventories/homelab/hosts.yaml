all:
  hosts:
    caddy1:
      ansible_host: 192.168.10.244
    ns1:
      ansible_host: 192.168.10.233
    ns2:
      ansible_host: 192.168.10.234
    ns3:
      ansible_host: 192.168.10.235
    dist1:
      ansible_host: 192.168.10.231
    dist2:
      ansible_host: 192.168.10.232
    resolver1:
      ansible_host: 192.168.10.236
    resolver2:
      ansible_host: 192.168.10.237
    log1:
      ansible_host: 192.168.10.243
    forgejo1:
      ansible_host: 192.168.10.245
    runner1:
      ansible_host: 192.168.10.246
    netbox1:
      ansible_host: 192.168.10.247
    gpuvm1:
      ansible_host: 192.168.20.22
    pve:
      ansible_host: 192.168.10.10
    node1:
      ansible_host: 192.168.10.11
    node2:
      ansible_host: 192.168.10.12
    node3:
      ansible_host: 192.168.10.13
    node4:
      ansible_host: 192.168.10.14
    node5:
      ansible_host: 192.168.10.15
    rpi3:
      ansible_host: 192.168.10.240
    rpi4:
      ansible_host: 192.168.10.241
    sandbox-k0s-cp1:
      ansible_host: 192.168.20.31
    sandbox-k0s-worker1:
      ansible_host: 192.168.20.32
    sandbox-k0s-worker2:
      ansible_host: 192.168.20.33
    sandbox-k0s-worker3:
      ansible_host: 192.168.20.34
    k0s-cp1:
      ansible_host: 192.168.60.11
    k0s-worker1:
      ansible_host: 192.168.30.12
    k0s-worker2:
      ansible_host: 192.168.70.13
    openbao1:
      ansible_host: 192.168.40.30
    seaweedfs1:
      ansible_host: 192.168.50.31
    toolbox1:
      ansible_host: 192.168.20.21
    authentik1:
      ansible_host: 192.168.10.248
    sssdtest1:
      ansible_host: 192.168.10.176
    vpngw:
      ansible_host: 192.168.10.3
  children:
    # Power sequencing only; configuration is managed outside this repo.
    power_only:
      hosts:
        vpngw: null

    dns:
      children:
        dns_auth:
          children:
            dns_primary:
              hosts:
                ns1: null
            dns_secondary:
              hosts:
                ns2: null
                ns3: null
        dnsdist:
          hosts:
            dist1: null
            dist2: null
        dns_resolver:
          hosts:
            resolver1: null
            resolver2: null

    openbao:
      hosts:
        openbao1: null

    authentik:
      hosts:
        authentik1: null

    # Disposable SSSD/LDAP PoC VM; excluded from monitoring.
    sssd:
      hosts:
        sssdtest1: null

    # Object storage for Terraform state backups and Packer images.
    seaweedfs:
      hosts:
        seaweedfs1: null

    log_collector:
      hosts:
        log1: null

    forgejo:
      hosts:
        forgejo1: null

    forgejo_runner:
      hosts:
        runner1: null

    netbox:
      hosts:
        netbox1: null

    gpuvm:
      hosts:
        gpuvm1: null

    caddy:
      hosts:
        caddy1: null

    # Browser editor for toolbox1 (ADR-0031).
    code_server:
      hosts:
        toolbox1: null

    dhcp:
      hosts:
        rpi4: null

    meshcentral:
      hosts:
        rpi4: null

    # Split k0s by role so workers drain before controllers; names match Kubernetes nodes.
    prd_k8s:
      children:
        prd_k8s_controller:
          hosts:
            k0s-cp1: null
        prd_k8s_worker:
          hosts:
            k0s-worker1: null
            k0s-worker2: null
            # GPU worker topology; GPU roles come from gpuvm (ADR-0019).
            gpuvm1: null
    sandbox_k8s:
      children:
        sandbox_k8s_controller:
          hosts:
            sandbox-k0s-cp1: null
        sandbox_k8s_worker:
          hosts:
            sandbox-k0s-worker1: null
            sandbox-k0s-worker2: null
            sandbox-k0s-worker3: null

    # Cross-cluster node roles; cluster-specific values stay in environment groups.
    k8s_controller:
      children:
        prd_k8s_controller: {}
        sandbox_k8s_controller: {}
    k8s_worker:
      children:
        prd_k8s_worker: {}
        sandbox_k8s_worker: {}

    lxc:
      hosts:
        caddy1: null
        log1: null
        forgejo1: null
        netbox1: null
        ns1: null
        ns2: null
        ns3: null
        dist1: null
        dist2: null
        resolver1: null
        resolver2: null
        seaweedfs1: null

    # LXC guests read directly by Vector from journald.
    vector_lxc:
      children:
        caddy: {}
        dns_auth: {}
        dnsdist: {}
        dns_resolver: {}
        forgejo: {}
        netbox: {}
        seaweedfs: {}
        log_collector: {}

    # All Vector agents; targeted by common-vector.yaml.
    vector:
      children:
        vector_lxc: {}
        dhcp: {}

    # Timezone-managed hosts; explicit scope avoids k0s nodes and toolboxes.
    timezone:
      children:
        caddy: {}
        dnsdist: {}
        dns_resolver: {}
        dns_auth: {}
        dhcp: {}
        forgejo: {}
        forgejo_runner: {}
        netbox: {}
        seaweedfs: {}
        openbao: {}
        authentik: {}
        sssd: {}
        gpuvm: {}
        log_collector: {}
      hosts:
        rpi3: null

    # Rsyslog forwarders targeted by common-rsyslog.yaml.
    rsyslog:
      children:
        proxmox: {}
      hosts:
        rpi3: null

    # Planned shutdown order: least-dependent first, logging and DNS last.
    # k0s nodes stop earlier in their own play.
    guest_shutdown_order:
      hosts:
        runner1: null
        sssdtest1: null
        toolbox1: null
        authentik1: null
        forgejo1: null
        netbox1: null
        seaweedfs1: null
        openbao1: null
        vpngw: null
        caddy1: null
        log1: null
        resolver1: null
        resolver2: null
        dist1: null
        dist2: null
        ns1: null
        ns2: null
        ns3: null

    # Hypervisor shutdown order; dependency-heavy node2 and pve stop last.
    proxmox_shutdown_order:
      hosts:
        node1: null
        node5: null
        node4: null
        node3: null
        pve: null
        node2: null

    proxmox:
      hosts:
        pve: null
        node1: null
        node2: null
        node3: null
        node4: null
        node5: null

    # Cluster hypervisors used for environment-only startup recovery.
    prd_k8s_hypervisor:
      hosts:
        node1: null
        node4: null
        node5: null
        pve: null
    sandbox_k8s_hypervisor:
      hosts:
        pve: null

    node_exporter:
      children:
        node_exporter_rpi:
          hosts:
            rpi3: null
            rpi4: null
        # Stateful LXC metrics unavailable through Proxmox OTLP; omit duplicate host sensors.
        node_exporter_lxc:
          hosts:
            seaweedfs1: null
            forgejo1: null
            netbox1: null
            resolver1: null
            resolver2: null
            ns1: null
            ns2: null
            ns3: null
            dist1: null
            dist2: null
            log1: null
            caddy1: null
        # Guests with virtio hardware only; ZFS lives on the hypervisor.
        node_exporter_vm:
          hosts:
            openbao1: null
            authentik1: null
            runner1: null
            toolbox1: null
            # No kubelet on k0s controllers; scrape the host and kine DB disk directly.
            k0s-cp1: null
      # Hypervisors; the only hosts with real sensors, NVMe and zpools.
      hosts:
        pve: null
        node1: null
        node2: null
        node3: null
        node4: null
        node5: null

    blackbox_exporter:
      hosts:
        rpi4: null

    # VMs receiving bulk users; hosts must also exist under all.hosts.
    shared_vms:
      hosts: {}
        # devvm01: null
