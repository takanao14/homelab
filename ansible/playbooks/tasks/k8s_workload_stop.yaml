---
# Scale applications to zero for graceful shutdown; no eviction target remains.
# Tasks run on the control node; play hosts only identify clusters.

# Detect drift dynamically but scale only reviewed namespace classifications.
- name: List namespaces that carry scalable workloads
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - get
      - deployment,statefulset
      - --all-namespaces
      - -o
      - jsonpath={range .items[*]}{.metadata.namespace}{"\n"}{end}
  register: k8s_shutdown_all_namespaces
  delegate_to: localhost
  become: false
  changed_when: false

- name: Determine which namespaces are unclassified
  ansible.builtin.set_fact:
    k8s_shutdown_unclassified: >-
      {{ k8s_shutdown_all_namespaces.stdout_lines | unique
         | difference(k8s_shutdown_namespaces)
         | difference(k8s_infrastructure_namespaces) }}

- name: Fail if a namespace is neither application nor infrastructure
  ansible.builtin.assert:
    that: k8s_shutdown_unclassified | length == 0
    fail_msg: >-
      These namespaces carry workloads but appear in neither
      k8s_shutdown_namespaces nor k8s_infrastructure_namespaces:
      {{ k8s_shutdown_unclassified | join(', ') }}. An application namespace
      belongs in the ordered shutdown list; infrastructure belongs in the
      exclusion list. To proceed without classifying them — they will stop with
      their node instead of gracefully — re-run with
      -e k8s_shutdown_allow_unclassified=true
    success_msg: Every namespace carrying workloads is classified
  when: not (k8s_shutdown_allow_unclassified | bool)

- name: Record current replica counts
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ item }}"
      - get
      - deployment,statefulset
      - -o
      - jsonpath={range .items[*]}{.kind}{" "}{.metadata.namespace}{" "}{.metadata.name}{" "}{.spec.replicas}{"\n"}{end}
  loop: "{{ k8s_shutdown_namespaces }}"
  register: k8s_shutdown_snapshot
  delegate_to: localhost
  become: false
  changed_when: false

- name: Flatten the snapshot into one workload per line
  ansible.builtin.set_fact:
    k8s_shutdown_targets: >-
      {{ k8s_shutdown_snapshot.results | map(attribute='stdout_lines')
         | flatten | reject('equalto', '') | list }}

# Persist replicas before scaling; Argo CD cannot restore omitted counts.
- name: Ensure the shutdown state directory exists
  ansible.builtin.file:
    path: "{{ k8s_shutdown_state_dir | expanduser }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save the replica snapshot for ops-startup.yaml
  ansible.builtin.copy:
    content: "{{ k8s_shutdown_targets | join('\n') }}\n"
    dest: "{{ k8s_shutdown_state_dir | expanduser }}/replicas-{{ inventory_hostname }}.txt"
    mode: "0600"
  delegate_to: localhost
  become: false

# Stop GitOps only after snapshotting its nonzero replica count.
- name: Stop the GitOps controller so it cannot revert the scale-down
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - scale
      - "{{ k8s_gitops_controller_resource }}"
      - --replicas=0
  delegate_to: localhost
  become: false
  changed_when: true
  when: k8s_gitops_controller_resource is defined

- name: Scale workloads to zero
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ item.split()[1] }}"
      - scale
      - "{{ item.split()[0] | lower }}/{{ item.split()[2] }}"
      - --replicas=0
  loop: "{{ k8s_shutdown_targets }}"
  delegate_to: localhost
  become: false
  changed_when: true

# Wait on scaled workloads, not namespaces that retain DaemonSet pods.
- name: Wait for scaled workloads to report no running replicas
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ item.split()[1] }}"
      - get
      - "{{ item.split()[0] | lower }}/{{ item.split()[2] }}"
      - -o
      - jsonpath={.status.replicas}
  loop: "{{ k8s_shutdown_targets }}"
  register: k8s_shutdown_drained
  until: k8s_shutdown_drained.stdout | default('0', true) in ['', '0']
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false
  changed_when: false
