---
# Prove that kubelet can mount the configured export before application
# workloads are restored. Running the probe as a temporary Pod avoids relying
# on an SSH sudo timestamp after every node has just rebooted. Rolling node
# maintenance sets k8s_nfs_probe_node so the Pod binds directly to the restored,
# still-cordoned worker; full-cluster startup may schedule it on any worker.

- name: Probe the NFS export through kubelet
  block:
    - name: Create the NFS readiness probe Pod
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
          - apply
          - -f
          - "-"
        stdin: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: nfs-readiness-probe
            namespace: kube-system
          spec:
            restartPolicy: Never
          {% if k8s_nfs_probe_node is defined %}
            nodeName: {{ k8s_nfs_probe_node }}
          {% endif %}
            containers:
              - name: probe
                image: busybox:stable
                command:
                  - sh
                  - -c
                  - test -d /mnt/nfs && stat /mnt/nfs >/dev/null
                volumeMounts:
                  - name: nfs
                    mountPath: /mnt/nfs
                    readOnly: true
            volumes:
              - name: nfs
                nfs:
                  server: {{ k8s_nfs_server }}
                  path: {{ k8s_nfs_share }}
                  readOnly: true
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Wait for the NFS readiness probe to succeed
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
          - --namespace=kube-system
          - wait
          - --for=jsonpath={.status.phase}=Succeeded
          - pod/nfs-readiness-probe
          - --timeout=120s
      delegate_to: localhost
      become: false
      changed_when: false

  always:
    - name: Delete the NFS readiness probe Pod
      ansible.builtin.command:
        argv:
          - kubectl
          - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
          - --namespace=kube-system
          - delete
          - pod/nfs-readiness-probe
          - --ignore-not-found
          - --wait=false
      delegate_to: localhost
      become: false
      changed_when: true
