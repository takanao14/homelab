---
# Bootstrap Argo CD, then let self-heal restore Git-declared replicas (ADR-0036).

- name: Resume the Argo CD bootstrap components
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - scale
      - "{{ item }}"
      - --replicas=1
  loop: "{{ k8s_gitops_bootstrap_resources }}"
  delegate_to: localhost
  become: false
  changed_when: true
  when: k8s_gitops_bootstrap_resources is defined

- name: Wait for the Argo CD bootstrap components to be ready
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - rollout
      - status
      - "{{ item }}"
      - --timeout=300s
  loop: "{{ k8s_gitops_bootstrap_resources }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when: k8s_gitops_bootstrap_resources is defined

- name: Request a hard refresh of every Argo CD Application
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - annotate
      - applications.argoproj.io
      - --all
      - argocd.argoproj.io/refresh=hard
      - --overwrite
  delegate_to: localhost
  become: false
  changed_when: true
  when: k8s_gitops_bootstrap_resources is defined

- name: Wait for Argo CD to process every refresh request
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - get
      - applications.argoproj.io
      - -o
      - 'jsonpath={range .items[*]}{.metadata.annotations.argocd\.argoproj\.io/refresh}{end}'
  register: k8s_startup_refreshes
  until: k8s_startup_refreshes.stdout == ''
  retries: 60
  delay: 10
  delegate_to: localhost
  become: false
  changed_when: false
  when: k8s_gitops_bootstrap_resources is defined

- name: Wait for every Argo CD Application to be Synced and Healthy
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - "--namespace={{ k8s_gitops_controller_namespace }}"
      - get
      - applications.argoproj.io
      - -o
      - jsonpath={range .items[*]}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}
  register: k8s_startup_apps
  until:
    - k8s_startup_apps.stdout_lines | length > 0
    - k8s_startup_apps.stdout_lines | reject('equalto', 'Synced Healthy') | list | length == 0
  retries: 60
  delay: 10
  delegate_to: localhost
  become: false
  changed_when: false
  when: k8s_gitops_bootstrap_resources is defined
