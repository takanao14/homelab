---
# Baseline pre-existing failed units so only upgrade regressions fail.
- name: Record systemd services already failed before the upgrade
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-units
      - --state=failed
      - --type=service
      - --no-legend
      - --plain
  register: package_upgrade_failed_services_before
  changed_when: false

# Debian / Ubuntu.
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Check if reboot is required (Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: deb_reboot_required
  become: true
  when: ansible_facts['os_family'] == "Debian"

# Rocky / RHEL; dnf requires separate upgrade and autoremove tasks.
- name: Upgrade all packages  # noqa package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Remove unused dependencies
  ansible.builtin.dnf:
    autoremove: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# dnf-utils provides needs-restarting.
- name: Ensure dnf-utils is present
  ansible.builtin.dnf:
    name: dnf-utils
    state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# needs-restarting rc=1 means reboot required; treat it as data.
- name: Check if reboot is required (RedHat)
  ansible.builtin.command: needs-restarting -r
  register: rhel_reboot_required
  changed_when: false
  failed_when: false
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# Common reboot.
- name: Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: "{{ package_upgrade_reboot_timeout }}"
  become: true
  when: >
    (ansible_facts['os_family'] == "Debian" and deb_reboot_required.stat.exists)
    or (ansible_facts['os_family'] == "RedHat" and rhel_reboot_required.rc == 1)

# Catch services broken by maintainer-script restarts before the next serial host.
- name: Check for failed systemd services after package upgrades
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-units
      - --state=failed
      - --type=service
      - --no-legend
      - --plain
  register: package_upgrade_failed_services
  changed_when: false

# Compare unit names, not descriptions from list-units.
- name: Determine which services newly failed during the upgrade
  ansible.builtin.set_fact:
    package_upgrade_new_failures: >-
      {{ package_upgrade_failed_services.stdout_lines
         | map('regex_replace', '^(\S+).*$', '\1') | list
         | difference(package_upgrade_failed_services_before.stdout_lines
                      | map('regex_replace', '^(\S+).*$', '\1') | list) }}

- name: Fail if a service was healthy before the upgrade but is failed now
  ansible.builtin.assert:
    that: package_upgrade_new_failures | length == 0
    fail_msg: >-
      Services healthy before the upgrade are now failed:
      {{ package_upgrade_new_failures | join(', ') }}
    success_msg: >-
      No service regressed during the upgrade{%- if
      package_upgrade_failed_services.stdout_lines %} (pre-existing
      failures left untouched: {{ package_upgrade_failed_services.stdout_lines
      | map('regex_replace', '^(\S+).*$', '\1') | join(', ') }}){%- endif %}
