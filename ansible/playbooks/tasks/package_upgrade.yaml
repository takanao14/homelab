---
# --- Baseline ---
# Units that are already failed before anything is touched. Some hosts carry
# permanently failed units that the upgrade neither caused nor can fix — an LXC
# guest, for example, cannot start openipmi.service because IPMI needs kernel
# modules and /dev/ipmi* that containers do not have. Only a service that was
# healthy before and is failed afterwards indicates the upgrade broke something.
- name: Record systemd services already failed before the upgrade
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-units
      - --state=failed
      - --type=service
      - --no-legend
      - --plain
  register: package_upgrade_failed_services_before
  changed_when: false

# --- Debian / Ubuntu (apt) ---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
  become: true
  when: ansible_facts['os_family'] == "Debian"

- name: Check if reboot is required (Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: deb_reboot_required
  become: true
  when: ansible_facts['os_family'] == "Debian"

# --- Rocky / RHEL (dnf) ---
# dnf rejects autoremove together with state=latest, so upgrade and
# autoremove are run as separate tasks.
- name: Upgrade all packages  # noqa package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Remove unused dependencies
  ansible.builtin.dnf:
    autoremove: true
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# needs-restarting ships with dnf-utils; required for the reboot check below.
- name: Ensure dnf-utils is present
  ansible.builtin.dnf:
    name: dnf-utils
    state: present
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# Exit code 1 means a reboot is required, 0 means not. failed_when disabled
# so the non-zero code is treated as data rather than a task failure.
- name: Check if reboot is required (RedHat)
  ansible.builtin.command: needs-restarting -r
  register: rhel_reboot_required
  changed_when: false
  failed_when: false
  become: true
  when: ansible_facts['os_family'] == "RedHat"

# --- Common reboot ---
- name: Reboot if required
  ansible.builtin.reboot:
    reboot_timeout: "{{ package_upgrade_reboot_timeout }}"
  become: true
  when: >
    (ansible_facts['os_family'] == "Debian" and deb_reboot_required.stat.exists)
    or (ansible_facts['os_family'] == "RedHat" and rhel_reboot_required.rc == 1)

# Package maintainer scripts may restart services even when no reboot is
# required. Fail before the next serial host is upgraded if an updated service
# did not come back cleanly.
- name: Check for failed systemd services after package upgrades
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - list-units
      - --state=failed
      - --type=service
      - --no-legend
      - --plain
  register: package_upgrade_failed_services
  changed_when: false

# list-units prints "<unit> <load> <active> <sub> <description>", so the unit
# name is the first field; comparing names rather than whole lines keeps the
# diff stable when a description changes.
- name: Determine which services newly failed during the upgrade
  ansible.builtin.set_fact:
    package_upgrade_new_failures: >-
      {{ package_upgrade_failed_services.stdout_lines
         | map('regex_replace', '^(\S+).*$', '\1') | list
         | difference(package_upgrade_failed_services_before.stdout_lines
                      | map('regex_replace', '^(\S+).*$', '\1') | list) }}

- name: Fail if a service was healthy before the upgrade but is failed now
  ansible.builtin.assert:
    that: package_upgrade_new_failures | length == 0
    fail_msg: >-
      Services healthy before the upgrade are now failed:
      {{ package_upgrade_new_failures | join(', ') }}
    success_msg: >-
      No service regressed during the upgrade{%- if
      package_upgrade_failed_services.stdout_lines %} (pre-existing
      failures left untouched: {{ package_upgrade_failed_services.stdout_lines
      | map('regex_replace', '^(\S+).*$', '\1') | join(', ') }}){%- endif %}
