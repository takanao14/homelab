---
# Restore a drained worker and verify storage before serial maintenance continues.

- name: Wait for node to report Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - get
      - "node/{{ inventory_hostname }}"
      - -o
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: k8s_node_ready
  until: k8s_node_ready.stdout == "True"
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false
  changed_when: false

# Verify LocalPV before uncordon to avoid binding an empty rootfs directory.
- name: Verify the LocalPV data mount is present
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ k8s_storage_mountpoint }}"
  become: false
  changed_when: false
  when: "'openebs' in k8s_storage_providers"

- name: Verify the NFS export is mountable from the restored node
  ansible.builtin.import_tasks: k8s_nfs_ready.yaml
  vars:
    k8s_nfs_probe_node: "{{ inventory_hostname }}"
  when: "'nfs' in k8s_storage_providers"

- name: Uncordon node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - uncordon
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: true
