---
# Bring a drained k0s worker back into service after a disruptive operation, and
# block until its LocalPV mount and NFS client path are verified. With serial: 1
# this prevents the next worker from being disrupted before the current worker
# can safely accept its node-affine and shared-storage workloads again.

- name: Wait for node to report Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - get
      - "node/{{ inventory_hostname }}"
      - -o
      - jsonpath={.status.conditions[?(@.type=="Ready")].status}
  register: k8s_node_ready
  until: k8s_node_ready.stdout == "True"
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false
  changed_when: false

# OpenEBS LocalPV serves PVs out of a separate mount. Confirm it is back before
# the node accepts pods, so a workload cannot bind an empty directory on the
# root filesystem and start with no data.
- name: Verify the LocalPV data mount is present
  ansible.builtin.command:
    argv:
      - mountpoint
      - -q
      - "{{ k8s_storage_mountpoint }}"
  become: false
  changed_when: false
  when: "'openebs' in k8s_storage_providers"

- name: Verify the NFS export is mountable from the restored node
  ansible.builtin.import_tasks: k8s_nfs_ready.yaml
  vars:
    k8s_nfs_probe_node: "{{ inventory_hostname }}"
  when: "'nfs' in k8s_storage_providers"

- name: Uncordon node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - uncordon
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: true
