---
# Start reviewed guests by inventory name, resolving VMIDs dynamically.

- name: Start the guest if it is not already running
  become: true
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      manager={{ startup_guest_manager | default('qm') | quote }}
      vmid=$("$manager" list | awk -v name={{ item | quote }} \
        -v column={{ startup_guest_name_column | default(2) }} \
        '$(column ? column : NF) == name {print $1}') || exit 1
      if [ -z "$vmid" ]; then
        echo "no such guest: {{ item }}" >&2
        exit 1
      fi
      status=$("$manager" status "$vmid") || exit 1
      if [ "$status" = "status: running" ]; then
        echo already-running
        exit 0
      fi
      "$manager" start "$vmid" >/dev/null && echo started
  loop: "{{ startup_guests }}"
  register: startup_guest_started
  changed_when: startup_guest_started.stdout == "started"
