---
# Power off asynchronously, treating disconnect as expected, then confirm it.

- name: Request power off
  ansible.builtin.command:
    argv:
      - shutdown
      - -h
      - now
  become: true
  async: 1
  poll: 0
  failed_when: false
  changed_when: true

# Verify from the control node; a reachable target blocks the next tier.
- name: Wait for the host to stop answering on SSH
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    state: stopped
    timeout: "{{ host_poweroff_timeout }}"
  delegate_to: localhost
  become: false
