---
# Drain before disruption for graceful pod termination. kubectl runs on the control node.
# Inventory names match Kubernetes node names.

- name: Cordon node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - cordon
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: true

# Match k0sctl drain policy; force handles LocalPV pods and timeout covers PDBs.
- name: Drain node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - drain
      - "{{ inventory_hostname }}"
      - --ignore-daemonsets
      - --delete-emptydir-data
      - --force
      - --grace-period=120
      - --timeout=20m
  delegate_to: localhost
  become: false
  changed_when: true
