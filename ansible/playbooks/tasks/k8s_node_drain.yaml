---
# Drain before disruption for graceful pod termination.

- name: Check current cordon state
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - get
      - node
      - "{{ inventory_hostname }}"
      - -o
      - jsonpath={.spec.unschedulable}
  register: k8s_node_cordon_state
  delegate_to: localhost
  become: false
  changed_when: false

- name: Cordon node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - cordon
      - "{{ inventory_hostname }}"
  delegate_to: localhost
  become: false
  changed_when: k8s_node_cordon_state.stdout != 'true'

- name: Drain node
  ansible.builtin.command:
    argv:
      - kubectl
      - "--kubeconfig={{ k8s_kubeconfig | expanduser }}"
      - drain
      - "{{ inventory_hostname }}"
      - --ignore-daemonsets
      - --delete-emptydir-data
      - --force
      - --grace-period=120
      - --timeout=20m
  delegate_to: localhost
  become: false
  changed_when: true
