---
- name: Setup Caddy reverse proxy
  hosts: caddy
  roles:
    - role: timezone
      tags: timezone
    - role: caddy
      tags: caddy
    - role: lxc_logging
      tags: logging

- name: Sync caddy DNS records to homelab-private
  hosts: localhost
  connection: local
  gather_facts: false
  tags: sync_dns
  vars_files:
    - "{{ playbook_dir }}/../inventories/homelab/group_vars/caddy.yaml"
  vars:
    homelab_private_path: "{{ lookup('env', 'HOMELAB_PRIVATE_PATH') | default(lookup('env', 'HOME') + '/homelab-private', true) }}"
    dnsconfig_path: "{{ homelab_private_path }}/dns-record/home-zone.js"
    caddy_dns_target: "{{ hostvars[groups['caddy'][0]]['ansible_host'] }}"
  tasks:
    - name: Check if homelab-private repository exists
      ansible.builtin.stat:
        path: "{{ homelab_private_path }}"
      register: homelab_private_stat

    - name: Skip if homelab-private not found
      ansible.builtin.debug:
        msg: "homelab-private not found at {{ homelab_private_path }}, skipping DNS sync"
      when: not homelab_private_stat.stat.exists

    - name: Assert the generated records point at the caddy host
      ansible.builtin.assert:
        that:
          - caddy_dns_target is defined
          - caddy_dns_target | string is match('^\d{1,3}(\.\d{1,3}){3}$')
          - caddy_dns_target | string is not match('^127\.')
        fail_msg: >-
          caddy_dns_target is "{{ caddy_dns_target | default('undefined') }}",
          not the caddy host address. Every A record in the generated block would
          be rewritten to it, and pushing home-zone.js applies dnscontrol to
          PowerDNS with no approval step.
        quiet: true
      when: homelab_private_stat.stat.exists

    - name: Update caddy section in dnsconfig.js
      ansible.builtin.blockinfile:
        path: "{{ dnsconfig_path }}"
        marker: "    // {mark} caddy"
        block: |
          {% for site in (caddy_upstreams | default([])) + (caddy_redirects | default([])) %}
              A("{{ site.hostname.split('.')[0] }}", "{{ caddy_dns_target }}"),
          {% endfor %}
      when: homelab_private_stat.stat.exists

    - name: Check dnsconfig.js working tree status  # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - git
          - status
          - --porcelain
          - --
          - dns-record/home-zone.js
        chdir: "{{ homelab_private_path }}"
      register: caddy_dnsconfig_git_status
      check_mode: false
      changed_when: false
      when: homelab_private_stat.stat.exists

    - name: Stage dnsconfig.js changes  # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - git
          - add
          - --
          - dns-record/home-zone.js
        chdir: "{{ homelab_private_path }}"
      when:
        - homelab_private_stat.stat.exists
        - caddy_dnsconfig_git_status.stdout | default('') | length > 0
      changed_when: true

    - name: Commit dnsconfig.js changes  # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - git
          - commit
          - -m
          - "sync: update caddy DNS records from ansible"
          - --
          - dns-record/home-zone.js
        chdir: "{{ homelab_private_path }}"
      when:
        - homelab_private_stat.stat.exists
        - caddy_dnsconfig_git_status.stdout | default('') | length > 0
      changed_when: true

    - name: Push dnsconfig.js changes  # noqa command-instead-of-module
      ansible.builtin.command:
        argv:
          - git
          - push
        chdir: "{{ homelab_private_path }}"
      when:
        - homelab_private_stat.stat.exists
        - caddy_dnsconfig_git_status.stdout | default('') | length > 0
      changed_when: true
