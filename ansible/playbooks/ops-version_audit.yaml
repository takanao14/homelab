- name: Audit OpenBao package version
  hosts: openbao
  gather_facts: false
  vars_files:
    - ../roles/openbao/defaults/main.yaml
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Report OpenBao package version
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s %-20s desired=%-12s installed=%-12s %s' | format(
            'openbao',
            inventory_hostname,
            openbao_version,
            openbao_audit_installed,
            'OK' if openbao_audit_matches else 'DIFF'
          ) }}
      vars:
        openbao_audit_installed: >-
          {{ (ansible_facts.packages.get('openbao', [{'version': 'unknown'}]) | first).version }}
        openbao_audit_matches: >-
          {{ openbao_audit_installed == openbao_version
             or openbao_audit_installed.startswith(openbao_version ~ '-')
             or openbao_audit_installed.startswith(openbao_version ~ '+')
             or openbao_audit_installed.startswith(openbao_version ~ '~') }}

- name: Audit ROCm package versions
  hosts: gpuvm
  gather_facts: false
  vars_files:
    - ../roles/rocm/defaults/main.yaml
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto

    # ROCm 7.14+ replaced the generic `rocm` metapackage with the per-GPU
    # rocm_package_name (e.g. amdrocm10.0-gfx1200); `rocm` no longer exists.
    - name: Report ROCm package version
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s %-20s desired=%-12s installed=%-12s %s' | format(
            rocm_package_name,
            inventory_hostname,
            rocm_version,
            rocm_audit_installed,
            'OK' if rocm_audit_matches else 'DIFF'
          ) }}
      vars:
        rocm_audit_installed: >-
          {{ (ansible_facts.packages.get(rocm_package_name, [{'version': 'unknown'}]) | first).version }}
        rocm_audit_matches: >-
          {{ rocm_audit_installed == rocm_version
             or rocm_audit_installed.startswith(rocm_version ~ '.')
             or rocm_audit_installed.startswith(rocm_version ~ '-')
             or rocm_audit_installed.startswith(rocm_version ~ '+')
             or rocm_audit_installed.startswith(rocm_version ~ '~') }}

    # amdgpu-dkms carries the kernel-module version (e.g. 1:7.1.3.31500000-...),
    # which cannot be compared with the rocm_amdgpu_version repo number. Its
    # firmware package is installed in lockstep and versions as 1:31.50.0.0-...,
    # so audit that instead. Strip the epoch before comparing.
    - name: Report AMD GPU driver package version
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s %-20s desired=%-12s installed=%-12s %s' | format(
            'amdgpu-dkms-firmware',
            inventory_hostname,
            rocm_amdgpu_version,
            amdgpu_audit_installed,
            'OK' if amdgpu_audit_matches else 'DIFF'
          ) }}
      vars:
        amdgpu_audit_installed: >-
          {{ (ansible_facts.packages.get('amdgpu-dkms-firmware', [{'version': 'unknown'}]) | first).version
             | regex_replace('^[0-9]+:', '') }}
        amdgpu_audit_matches: >-
          {{ amdgpu_audit_installed == rocm_amdgpu_version
             or amdgpu_audit_installed.startswith(rocm_amdgpu_version ~ '.')
             or amdgpu_audit_installed.startswith(rocm_amdgpu_version ~ '-')
             or amdgpu_audit_installed.startswith(rocm_amdgpu_version ~ '+')
             or amdgpu_audit_installed.startswith(rocm_amdgpu_version ~ '~') }}

    - name: Report AMD device metrics exporter package version
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s %-20s desired=%-12s installed=%-12s %s' | format(
            'amdgpu-exporter',
            inventory_hostname,
            rocm_device_metrics_exporter_version,
            exporter_audit_installed,
            'OK' if exporter_audit_matches else 'DIFF'
          ) }}
      vars:
        exporter_audit_installed: >-
          {{ (ansible_facts.packages.get('amdgpu-exporter', [{'version': 'unknown'}]) | first).version }}
        exporter_audit_matches: >-
          {{ exporter_audit_installed == rocm_device_metrics_exporter_version
             or exporter_audit_installed.startswith(rocm_device_metrics_exporter_version ~ '.')
             or exporter_audit_installed.startswith(rocm_device_metrics_exporter_version ~ '-')
             or exporter_audit_installed.startswith(rocm_device_metrics_exporter_version ~ '+')
             or exporter_audit_installed.startswith(rocm_device_metrics_exporter_version ~ '~') }}

- name: Audit Knot Resolver package version
  hosts: dns_resolver
  gather_facts: false
  vars_files:
    - ../roles/knot_resolver/defaults/main.yaml
  tasks:
    - name: Read Knot Resolver package policy
      ansible.builtin.command:
        argv:
          - apt-cache
          - policy
          - "{{ knot_resolver_package }}"
      register: knot_resolver_audit_policy
      changed_when: false
      failed_when: false

    - name: Report Knot Resolver package version
      ansible.builtin.debug:
        msg: >-
          {{ '%-18s %-20s candidate=%-24s installed=%-24s %s' | format(
            'knot-resolver',
            inventory_hostname,
            knot_resolver_audit_candidate,
            knot_resolver_audit_installed,
            'OK' if (
              knot_resolver_audit_installed != 'unknown'
              and knot_resolver_audit_installed == knot_resolver_audit_candidate
            ) else 'DIFF'
          ) }}
      vars:
        knot_resolver_audit_installed: >-
          {{ knot_resolver_audit_policy.stdout
             | regex_findall('Installed: ([!-~]+)')
             | default([], true)
             | union(['unknown'])
             | first }}
        knot_resolver_audit_candidate: >-
          {{ knot_resolver_audit_policy.stdout
             | regex_findall('Candidate: ([!-~]+)')
             | default([], true)
             | union(['unknown'])
             | first }}

