---
- name: Seed secrets into OpenBao KV
  hosts: openbao
  tasks:
    - name: Seed secrets
      ansible.builtin.include_role:
        name: openbao
        tasks_from: seed_secrets

    # Separate because it only writes on change — see seed_argocd_admin.yaml.
    - name: Seed the ArgoCD admin password
      ansible.builtin.include_role:
        name: openbao
        tasks_from: seed_argocd_admin
