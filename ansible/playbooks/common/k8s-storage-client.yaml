---
# OS packages for enabled storage providers.
- name: Install Kubernetes storage client packages
  hosts: prd_k8s:sandbox_k8s
  any_errors_fatal: true
  tasks:
    - name: Install NFS client utilities
      become: true
      ansible.builtin.apt:
        name: nfs-common
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: "'nfs' in k8s_storage_providers"
      tags: nfs
