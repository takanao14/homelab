---
# Upgrade redundant DNS hosts one at a time. Tagged phases are independent:
#   --tags dns     the redundant DNS pool, one host at a time
#   --tags k8s     k0s workers (drained) then controllers
#   --tags others  everything else, in parallel
- name: Upgrade OS packages on DNS hosts serially
  hosts: dns
  serial: 1
  any_errors_fatal: true
  tags: dns
  tasks:
    - name: Run package upgrade tasks
      ansible.builtin.import_tasks: tasks/package_upgrade.yaml

# Drain and restore k0s workers serially, including node-local storage readiness.
- name: Upgrade OS packages on k0s workers one at a time
  hosts: prd_k8s_worker:sandbox_k8s_worker
  serial: 1
  any_errors_fatal: true
  tags: k8s
  tasks:
    - name: Drain the node
      ansible.builtin.import_tasks: tasks/k8s_node_drain.yaml

    - name: Run package upgrade tasks
      ansible.builtin.import_tasks: tasks/package_upgrade.yaml

    - name: Restore the node to service
      ansible.builtin.import_tasks: tasks/k8s_node_restore.yaml

# Reboot workload-free controllers after workers to preserve the drain API.
- name: Upgrade OS packages on k0s controllers
  hosts: prd_k8s_controller:sandbox_k8s_controller
  serial: 1
  any_errors_fatal: true
  tags: k8s
  tasks:
    - name: Run package upgrade tasks
      ansible.builtin.import_tasks: tasks/package_upgrade.yaml

# Upgrade independent single-service hosts in parallel.
- name: Upgrade OS packages on remaining hosts
  hosts: all:!proxmox:!dns:!power_only:!prd_k8s:!sandbox_k8s
  any_errors_fatal: false
  tags: others
  tasks:
    - name: Run package upgrade tasks
      ansible.builtin.import_tasks: tasks/package_upgrade.yaml
