---
- name: Restart authentik containers
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - authentik-postgresql.service
    - authentik-server.service
    - authentik-worker.service

- name: Restart authentik ldap outpost
  become: true
  ansible.builtin.systemd:
    name: authentik-ldap.service
    state: restarted

- name: Restart authentik proxy outpost
  become: true
  ansible.builtin.systemd:
    name: authentik-proxy.service
    state: restarted
