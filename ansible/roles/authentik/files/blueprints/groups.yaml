version: 1
metadata:
  name: homelab groups
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Lab privilege groups, not Authentik UI superusers; see the identity plan.
  - model: authentik_core.group
    identifiers:
      name: lab-platform-admins
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-linux-users
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-linux-admins
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-k8s-prd-viewers
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-k8s-prd-operators
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-k8s-prd-admins
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-k8s-sandbox-users
    attrs:
      is_superuser: false

  - model: authentik_core.group
    identifiers:
      name: lab-gpu-users
    attrs:
      is_superuser: false
