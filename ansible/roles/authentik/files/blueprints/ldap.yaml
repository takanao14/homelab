version: 1
metadata:
  name: homelab LDAP provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # See docs/plans/identity-authentication-architecture.md, "Linux 認証".
  # Reuses the default flows, but not the built-in self-signed certificate:
  # that one's SAN is a random *.self-signed.goauthentik.io name, which no
  # SSSD client dialling ldap.home.butaco.net can verify. The `homelab-ldap`
  # certificate is generated by the authentik role (API action — blueprints
  # can reference certificates but not create them) with the LDAP service
  # name as its CN/SAN. SSSD trusts that certificate directly
  # (ldap_tls_cacert) rather than relying on a real CA chain.
  - model: authentik_providers_ldap.ldapprovider
    id: ldap-provider
    identifiers:
      name: homelab-ldap
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      base_dn: dc=ldap,dc=home,dc=butaco,dc=net
      certificate: !Find [authentik_crypto.certificatekeypair, [name, homelab-ldap]]
      tls_server_name: ldap.home.butaco.net
      # See 決定事項14: 10000番台以降を基点とし、既存LDAP/ローカルアカウントと衝突しない範囲を確保する。
      uid_start_number: 10000
      gid_start_number: 10000
      bind_mode: direct
      search_mode: cached
      mfa_support: false

  # SSSD needs a shared bind account for its own directory lookups (getent/id
  # for arbitrary users), separate from each end-user's own auth bind. It
  # only has "Search full LDAP directory" RBAC (granted below, outside this
  # blueprint — object-level permission assignment has no blueprint model,
  # only a dedicated API action) and is not itself a Linux login identity.
  # Defined before the Application/PolicyBinding entries below since !KeyOf
  # can only reference entries that appear earlier in the file.
  - model: authentik_rbac.role
    id: ldap-search-role
    identifiers:
      name: ldap-search

  - model: authentik_core.group
    identifiers:
      name: lab-ldap-service
    attrs:
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, ldap-search]]

  - model: authentik_core.user
    identifiers:
      username: ldapbind
    attrs:
      name: LDAP Search Service Account
      type: service_account
      is_active: true
      path: service-accounts
      groups:
        - !Find [authentik_core.group, [name, lab-ldap-service]]
      password: !Env LDAP_BIND_PASSWORD

  - model: authentik_core.application
    id: ldap-application
    identifiers:
      slug: ldap
    attrs:
      name: LDAP
      provider: !KeyOf ldap-provider
      policy_engine_mode: any

  # Only lab-linux-users may bind/search — matches the PoC pass criterion
  # "linux-users以外のLDAP userはLinuxへログインできない". lab-linux-admins
  # grants sudo via Ansible-managed sudoers, not LDAP bind access; admins are
  # expected to also hold lab-linux-users membership to be able to log in.
  # policy_engine_mode: any on the application means either binding below is
  # sufficient — lab-ldap-service is the SSSD lookup service account, not a
  # human login group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ldap-application
      group: !Find [authentik_core.group, [name, lab-linux-users]]
    attrs:
      order: 0
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf ldap-application
      group: !Find [authentik_core.group, [name, lab-ldap-service]]
    attrs:
      order: 1
      enabled: true

  - model: authentik_outposts.outpost
    identifiers:
      name: homelab-ldap-outpost
    attrs:
      type: ldap
      providers:
        - !KeyOf ldap-provider
      # No service_connection: this outpost is deployed manually (Podman
      # Quadlet on authentik1), not managed by authentik via a Docker/K8s
      # integration — see decision 18.
      config: {}
