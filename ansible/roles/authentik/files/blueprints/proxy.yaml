version: 1
metadata:
  name: homelab proxy provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Per-app forward auth keeps Envoy proxying and preserves group bindings.
  - model: authentik_providers_proxy.proxyprovider
    id: headlamp-prd-provider
    identifiers:
      name: headlamp-prd
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      # Browser entry point and post-login return URL; must match the HTTPRoute.
      external_host: https://headlamp.prd.butaco.net
      basic_auth_enabled: false
      access_token_validity: hours=8

  # Sandbox remains HTTP-only; its session cookie lacks Secure (ADR-0010).
  - model: authentik_providers_proxy.proxyprovider
    id: headlamp-sandbox-provider
    identifiers:
      name: headlamp-sandbox
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: http://headlamp.sandbox.butaco.net
      basic_auth_enabled: false
      access_token_validity: hours=8

  # Replaces OpenBao basicAuth in prd; sandbox has no GPU worker (stage 14a).
  - model: authentik_providers_proxy.proxyprovider
    id: gpu-switch-prd-provider
    identifiers:
      name: gpu-switch-prd
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://gpu-switch.prd.butaco.net
      basic_auth_enabled: false
      access_token_validity: hours=8

  - model: authentik_core.application
    id: headlamp-prd-application
    identifiers:
      slug: headlamp-prd
    attrs:
      name: Headlamp (prd)
      provider: !KeyOf headlamp-prd-provider
      # Admit on any matching binding; the group bindings below are the gate.
      policy_engine_mode: any
      meta_description: prd Kubernetes dashboard. Everyone admitted here shares
        the same cluster-admin ServiceAccount inside Headlamp.

  - model: authentik_core.application
    id: headlamp-sandbox-application
    identifiers:
      slug: headlamp-sandbox
    attrs:
      name: Headlamp (sandbox)
      provider: !KeyOf headlamp-sandbox-provider
      policy_engine_mode: any
      meta_description: sandbox Kubernetes dashboard. Everyone admitted here
        shares the same cluster-admin ServiceAccount inside Headlamp.

  - model: authentik_core.application
    id: gpu-switch-prd-application
    identifiers:
      slug: gpu-switch-prd
    attrs:
      name: GPU Switch (prd)
      provider: !KeyOf gpu-switch-prd-provider
      policy_engine_mode: any
      meta_description: Assigns the single prd AMD GPU by scaling labelled
        Deployments. Scoped RBAC, not cluster-admin (ADR-0027).

  # Headlamp uses cluster-admin, so admit only groups trusted at that level.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headlamp-prd-application
      group: !Find [authentik_core.group, [name, lab-platform-admins]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headlamp-prd-application
      group: !Find [authentik_core.group, [name, lab-k8s-prd-admins]]
      order: 1
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headlamp-sandbox-application
      group: !Find [authentik_core.group, [name, lab-platform-admins]]
      order: 0
    attrs:
      enabled: true

  # Sandbox users are elevated until OIDC restores per-user RBAC (decision 22).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf headlamp-sandbox-application
      group: !Find [authentik_core.group, [name, lab-k8s-sandbox-users]]
      order: 1
    attrs:
      enabled: true

  # ADR-0027-scoped RBAC permits the broader lab-gpu-users group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gpu-switch-prd-application
      group: !Find [authentik_core.group, [name, lab-platform-admins]]
      order: 0
    attrs:
      enabled: true

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gpu-switch-prd-application
      group: !Find [authentik_core.group, [name, lab-gpu-users]]
      order: 1
    attrs:
      enabled: true

  - model: authentik_outposts.outpost
    id: proxy-outpost
    identifiers:
      name: homelab-proxy-outpost
    attrs:
      type: proxy
      # One external outpost serves every application and environment.
      providers:
        - !KeyOf headlamp-prd-provider
        - !KeyOf headlamp-sandbox-provider
        - !KeyOf gpu-switch-prd-provider
      # Proxy outposts require non-empty config with authentik_host.
      config:
        # Browser-facing URL; backchannel calls use the container environment.
        authentik_host: https://auth.home.butaco.net
        authentik_host_insecure: false
        log_level: info
