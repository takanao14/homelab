version: 1
metadata:
  name: homelab test users
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Disposable SSSD/LDAP PoC user; remove after validation. Content bump reapplies env password.
  - model: authentik_core.user
    identifiers:
      username: sssdtest
    attrs:
      name: SSSD Test User
      email: sssdtest@home.butaco.net
      is_active: true
      path: users
      groups:
        - !Find [authentik_core.group, [name, lab-linux-users]]
      attributes:
        sshPublicKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ0tkBI+/IMh3FxcPiKisnn4s2eNujC0AB9kobFQW0Rd sssdtest@home.butaco.net"
      # Authentik hashes the environment-sourced value; plaintext is not stored here.
      password: !Env TEST_USER_PASSWORD
