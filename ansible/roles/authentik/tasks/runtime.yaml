---
- name: Check whether the Authentik server container exists
  become: true
  ansible.builtin.command:
    argv:
      - podman
      - container
      - exists
      - authentik-server
  register: authentik_server_exists
  changed_when: false
  failed_when: authentik_server_exists.rc not in [0, 1]
  check_mode: false

- name: Read the deployed Authentik server image
  become: true
  ansible.builtin.command:
    argv:
      - podman
      - inspect
      - --format
      - "{{ '{{.ImageName}}' }}"
      - authentik-server
  register: authentik_deployed_server_image
  changed_when: false
  check_mode: false
  when: authentik_server_exists.rc == 0

- name: Require the explicit workflow for Authentik version changes
  ansible.builtin.assert:
    that:
      - >-
        authentik_deployed_server_version == authentik_version
        or authentik_upgrade_mode | default(false) | bool
    fail_msg: >-
      Authentik {{ authentik_deployed_server_version }} is deployed, but
      {{ authentik_version }} is requested. Use
      playbooks/ops/authentik/upgrade.yaml so the database is backed up and all
      Outposts are upgraded together.
  vars:
    authentik_deployed_server_version: >-
      {{ authentik_deployed_server_image.stdout | regex_replace('^.*:', '') }}
  when: authentik_server_exists.rc == 0

- name: Create Ansible-owned Authentik directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ authentik_templates_dir }}"
    - "{{ authentik_blueprints_dir }}"
    - "{{ authentik_env_file | dirname }}"

# Container entrypoints own these paths (authentik 1000; PostgreSQL 70/0700).
# Managing owner or mode would break PostgreSQL on subsequent runs.
- name: Ensure container-owned Authentik directories exist  # noqa: risky-file-permissions
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ authentik_data_dir }}"
    - "{{ authentik_certs_dir }}"
    - "{{ authentik_pg_data_dir }}"

- name: Deploy Authentik secrets env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik containers

- name: Deploy Authentik Quadlet units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - authentik.network
    - authentik-postgresql.container
    - authentik-server.container
    - authentik-worker.container
  notify:
    - Reload systemd
    - Restart authentik containers

- name: Ensure Authentik services are enabled and started
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - authentik-postgresql.service
    - authentik-server.service
    - authentik-worker.service

- name: Ensure Authentik containers are running the latest config before blueprints are deployed
  ansible.builtin.meta: flush_handlers

- name: Wait for the Authentik API to be ready
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: 200
  register: authentik_ready
  until: authentik_ready.status == 200
  retries: 30
  delay: 5
