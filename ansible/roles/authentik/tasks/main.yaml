---
- name: Create Authentik directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ authentik_data_dir }}"
    - "{{ authentik_templates_dir }}"
    - "{{ authentik_certs_dir }}"
    - "{{ authentik_pg_data_dir }}"
    - "{{ authentik_blueprints_dir }}"
    - "{{ authentik_env_file | dirname }}"

- name: Deploy Authentik secrets env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik containers

- name: Deploy Authentik Quadlet units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - authentik.network
    - authentik-postgresql.container
    - authentik-server.container
    - authentik-worker.container
  notify:
    - Reload systemd
    - Restart authentik containers

- name: Ensure Authentik services are enabled and started
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - authentik-postgresql.service
    - authentik-server.service
    - authentik-worker.service

# Apply final container environment before the watcher sees new blueprints.
- name: Ensure Authentik containers are running the latest config before blueprints are deployed
  ansible.builtin.meta: flush_handlers

- name: Wait for the Authentik API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: 200
  register: authentik_ready
  until: authentik_ready.status == 200
  retries: 30
  delay: 5

# Create the certificate before ldap.yaml references it; check first to avoid reminting.
    # The API silently ignores unsupported name filters; filter client-side.
- name: Check whether the LDAPS certificate already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_cert
  no_log: true

- name: Generate the LDAPS certificate whose CN/SAN matches the LDAP service name
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/generate/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      common_name: "{{ authentik_ldap_cert_cn }}"
      subject_alt_name: "{{ authentik_ldap_cert_cn }}"
      validity_days: "{{ authentik_ldap_cert_validity_days }}"
    status_code: [200, 201]
  register: authentik_ldap_cert_generated
  when: >-
    authentik_ldap_cert.json.results
    | selectattr('name', 'equalto', authentik_ldap_cert_name)
    | list | length == 0
  no_log: true

# Rename generated cert to the stable blueprint lookup name.
- name: Give the generated certificate the name the blueprint looks up
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/{{ authentik_ldap_cert_generated.json.pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ authentik_ldap_cert_name }}"
    status_code: 200
  when: authentik_ldap_cert_generated is not skipped
  no_log: true

- name: Deploy Authentik blueprints
  become: true
  ansible.builtin.copy:
    src: blueprints/
    dest: "{{ authentik_blueprints_dir }}/"
    owner: root
    group: root
    mode: '0644'

# Fetch the blueprint-generated Outpost token live; retry asynchronous creation.
- name: Wait for the blueprint-created objects to appear
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: 200
  register: authentik_ready_after_blueprints
  until: authentik_ready_after_blueprints.status == 200
  retries: 30
  delay: 5

- name: Look up the LDAP outpost created by the ldap.yaml blueprint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/outposts/instances/?name__iexact={{ authentik_ldap_outpost_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_outpost
  until: authentik_ldap_outpost.json.results | length > 0
  retries: 12
  delay: 5
  no_log: true

# Object permissions lack a blueprint model, so assign them through the API.
    # Role-name filters are unsupported and silently ignored; filter client-side.
- name: Look up the LDAP search Role created by the ldap.yaml blueprint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/rbac/roles/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_search_role
  until: authentik_ldap_search_role.json.results | selectattr('name', 'equalto', 'ldap-search') | list | length > 0
  retries: 12
  delay: 5
  no_log: true

- name: Grant the LDAP search Role "Search full LDAP directory" on the LDAP provider
  vars:
    authentik_ldap_search_role_pk: >-
      {{ (authentik_ldap_search_role.json.results
        | selectattr('name', 'equalto', 'ldap-search') | first).pk }}
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/rbac/permissions/assigned_by_roles/{{ authentik_ldap_search_role_pk }}/assign/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      model: authentik_providers_ldap.ldapprovider
      object_pk: "{{ (authentik_ldap_outpost.json.results | first).providers | first }}"
      permissions:
        - authentik_providers_ldap.search_full_directory
    status_code: [200, 201]
  no_log: true

- name: Reveal the LDAP outpost token
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/core/tokens/{{ (authentik_ldap_outpost.json.results | first).token_identifier }}/view_key/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_outpost_token
  no_log: true

- name: Deploy Authentik LDAP outpost env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik-ldap.env.j2
    dest: "{{ authentik_ldap_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik ldap outpost

- name: Deploy Authentik LDAP outpost Quadlet unit
  become: true
  ansible.builtin.template:
    src: authentik-ldap.container.j2
    dest: "{{ podman_quadlet_dir }}/authentik-ldap.container"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart authentik ldap outpost

- name: Ensure Authentik LDAP outpost service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: authentik-ldap.service
    state: started
    enabled: true
    daemon_reload: true
