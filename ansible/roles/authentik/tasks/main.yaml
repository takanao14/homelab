---
- name: Check the Authentik feature selection
  ansible.builtin.include_tasks: feature_selection.yaml

- name: Deploy the Authentik runtime
  ansible.builtin.include_tasks: runtime.yaml

- name: Deploy common identity objects
  ansible.builtin.include_tasks: identity.yaml

- name: Deploy LDAP
  ansible.builtin.include_tasks: ldap.yaml
  when: "'ldap' in authentik_enabled_features"

- name: Deploy Headlamp
  ansible.builtin.include_tasks: headlamp.yaml
  when: "'headlamp' in authentik_enabled_features"

- name: Deploy GPU Switch
  ansible.builtin.include_tasks: gpu_switch.yaml
  when: "'gpu_switch' in authentik_enabled_features"

- name: Deploy the shared proxy Outpost
  ansible.builtin.include_tasks: proxy_outpost.yaml
  when: authentik_enabled_features | intersect(['headlamp', 'gpu_switch']) | length > 0

- name: Apply pending Authentik Outpost restarts
  ansible.builtin.meta: flush_handlers

- name: Record the initial Authentik feature selection
  become: true
  ansible.builtin.copy:
    content: "{{ authentik_enabled_features | sort | join('\n') }}\n"
    dest: "{{ authentik_feature_selection_file }}"
    owner: root
    group: root
    mode: '0644'
  when: not ansible_check_mode
