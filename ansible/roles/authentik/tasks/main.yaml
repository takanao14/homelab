---
- name: Create Ansible-owned Authentik directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ authentik_templates_dir }}"
    - "{{ authentik_blueprints_dir }}"
    - "{{ authentik_env_file | dirname }}"

# Container entrypoints own these paths (authentik 1000; PostgreSQL 70/0700).
# Managing owner or mode would break PostgreSQL on subsequent runs.
- name: Ensure container-owned Authentik directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ authentik_data_dir }}"
    - "{{ authentik_certs_dir }}"
    - "{{ authentik_pg_data_dir }}"

- name: Deploy Authentik secrets env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik.env.j2
    dest: "{{ authentik_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik containers

- name: Deploy Authentik Quadlet units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - authentik.network
    - authentik-postgresql.container
    - authentik-server.container
    - authentik-worker.container
  notify:
    - Reload systemd
    - Restart authentik containers

- name: Ensure Authentik services are enabled and started
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - authentik-postgresql.service
    - authentik-server.service
    - authentik-worker.service

# Apply the final container env before the watcher sees new blueprints.
- name: Ensure Authentik containers are running the latest config before blueprints are deployed
  ansible.builtin.meta: flush_handlers

- name: Wait for the Authentik API to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: 200
  register: authentik_ready
  until: authentik_ready.status == 200
  retries: 30
  delay: 5

# Mint before ldap.yaml references it; the API ignores name filters, so filter
# client-side to avoid reminting.
- name: Check whether the LDAPS certificate already exists
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_cert
  no_log: true

- name: Generate the LDAPS certificate whose CN/SAN matches the LDAP service name
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/generate/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      common_name: "{{ authentik_ldap_cert_cn }}"
      subject_alt_name: "{{ authentik_ldap_cert_cn }}"
      validity_days: "{{ authentik_ldap_cert_validity_days }}"
    status_code: [200, 201]
  register: authentik_ldap_cert_generated
  when: >-
    authentik_ldap_cert.json.results
    | selectattr('name', 'equalto', authentik_ldap_cert_name)
    | list | length == 0
  no_log: true

# Rename to the stable name the blueprint looks up.
- name: Give the generated certificate the name the blueprint looks up
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/crypto/certificatekeypairs/{{ authentik_ldap_cert_generated.json.pk }}/"
    method: PATCH
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      name: "{{ authentik_ldap_cert_name }}"
    status_code: 200
  when: authentik_ldap_cert_generated is not skipped
  no_log: true

- name: Deploy Authentik blueprints
  become: true
  ansible.builtin.copy:
    src: blueprints/
    dest: "{{ authentik_blueprints_dir }}/"
    owner: root
    group: root
    mode: '0644'

# Templated rather than copied: usernames, group membership and initial
# passwords come from the SOPS-encrypted authentik_users list.
- name: Deploy the Authentik users blueprint
  become: true
  ansible.builtin.template:
    src: blueprints/users.yaml.j2
    dest: "{{ authentik_blueprints_dir }}/users.yaml"
    owner: root
    group: root
    mode: '0644'

# Authentik's own discovery only reapplies a blueprint when the file hash
# changes, so deleting an account and rerunning the playbook would be a no-op —
# the account would stay gone. Applying explicitly makes account state a
# function of authentik_users rather than of whether the file happened to
# change. page_size is required: the default 20 paginates this instance out of
# the first page and the lookup silently finds nothing.
- name: Look up the users blueprint instance
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/managed/blueprints/?page_size=200"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_users_blueprint
  until: >-
    authentik_users_blueprint.json.results
    | selectattr('path', 'equalto', 'local/users.yaml') | list | length > 0
  retries: 12
  delay: 5
  no_log: true

# Convergent, so not reported as a change; the check at the end of this role is
# the signal that matters.
- name: Apply the users blueprint
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:{{ authentik_http_port }}/api/v3/managed/blueprints/{{
      (authentik_users_blueprint.json.results
      | selectattr('path', 'equalto', 'local/users.yaml') | first).pk }}/apply/
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  changed_when: false
  no_log: true

# Blueprint objects are created asynchronously; retry the lookups below.
- name: Wait for the blueprint-created objects to appear
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/-/health/ready/"
    status_code: 200
  register: authentik_ready_after_blueprints
  until: authentik_ready_after_blueprints.status == 200
  retries: 30
  delay: 5

- name: Look up the LDAP outpost created by the ldap.yaml blueprint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/outposts/instances/?name__iexact={{ authentik_ldap_outpost_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_outpost
  until: authentik_ldap_outpost.json.results | length > 0
  retries: 12
  delay: 5
  no_log: true

# Object permissions have no blueprint model, so assign via the API; role-name
# filters are silently ignored, so filter client-side.
- name: Look up the LDAP search Role created by the ldap.yaml blueprint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/rbac/roles/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_search_role
  until: authentik_ldap_search_role.json.results | selectattr('name', 'equalto', 'ldap-search') | list | length > 0
  retries: 12
  delay: 5
  no_log: true

- name: Grant the LDAP search Role "Search full LDAP directory" on the LDAP provider
  vars:
    authentik_ldap_search_role_pk: >-
      {{ (authentik_ldap_search_role.json.results
        | selectattr('name', 'equalto', 'ldap-search') | first).pk }}
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/rbac/permissions/assigned_by_roles/{{ authentik_ldap_search_role_pk }}/assign/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    body_format: json
    body:
      model: authentik_providers_ldap.ldapprovider
      object_pk: "{{ (authentik_ldap_outpost.json.results | first).providers | first }}"
      permissions:
        - authentik_providers_ldap.search_full_directory
    status_code: [200, 201]
  no_log: true

- name: Reveal the LDAP outpost token
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/core/tokens/{{ (authentik_ldap_outpost.json.results | first).token_identifier }}/view_key/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_ldap_outpost_token
  no_log: true

- name: Deploy Authentik LDAP outpost env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik-ldap.env.j2
    dest: "{{ authentik_ldap_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik ldap outpost

- name: Deploy Authentik LDAP outpost Quadlet unit
  become: true
  ansible.builtin.template:
    src: authentik-ldap.container.j2
    dest: "{{ podman_quadlet_dir }}/authentik-ldap.container"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart authentik ldap outpost

- name: Ensure Authentik LDAP outpost service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: authentik-ldap.service
    state: started
    enabled: true
    daemon_reload: true

- name: Look up the proxy outpost created by the proxy.yaml blueprint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/outposts/instances/?name__iexact={{ authentik_proxy_outpost_name }}"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_proxy_outpost
  until: authentik_proxy_outpost.json.results | length > 0
  retries: 12
  delay: 5
  no_log: true

- name: Reveal the proxy outpost token
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ authentik_http_port }}/api/v3/core/tokens/{{ (authentik_proxy_outpost.json.results | first).token_identifier }}/view_key/"
    headers:
      Authorization: "Bearer {{ authentik_bootstrap_token }}"
    status_code: 200
  register: authentik_proxy_outpost_token
  no_log: true

- name: Deploy Authentik proxy outpost env file
  become: true
  no_log: true
  ansible.builtin.template:
    src: authentik-proxy.env.j2
    dest: "{{ authentik_proxy_env_file }}"
    owner: root
    group: root
    mode: '0600'
  notify: Restart authentik proxy outpost

- name: Deploy Authentik proxy outpost Quadlet unit
  become: true
  ansible.builtin.template:
    src: authentik-proxy.container.j2
    dest: "{{ podman_quadlet_dir }}/authentik-proxy.container"
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart authentik proxy outpost

- name: Ensure Authentik proxy outpost service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: authentik-proxy.service
    state: started
    enabled: true
    daemon_reload: true

# The users blueprint sets passwords with `state: created`, so a bad first apply
# is permanent and silent: !Env yields None for a variable the worker cannot see,
# which stores an unusable password, and every later run skips the entry. Catch
# it here rather than at someone's first login. Blueprints apply asynchronously,
# hence the retries.
- name: Check that every managed user has a usable password
  become: true
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - "{{ authentik_worker_container }}"
      - ak
      - shell
      - -c
      - |
        from authentik.core.models import User
        broken = []
        for name in {{ authentik_users | map(attribute='username') | list | to_json }}:
            user = User.objects.filter(username=name).first()
            if user is None or not user.has_usable_password():
                broken.append(name)
        print("USERCHECK_FAIL:" + ",".join(broken) if broken else "USERCHECK_OK")
  register: authentik_user_check
  changed_when: false
  failed_when: false
  until: authentik_user_check.stdout is search('USERCHECK_(OK|FAIL)')
  retries: 12
  delay: 5

- name: Fail when a managed user is missing or has no usable password
  ansible.builtin.assert:
    that: authentik_user_check.stdout is search('USERCHECK_OK')
    # Ansible finalizes fail_msg whether or not the assertion holds, so this has
    # to stay safe when the regex finds nothing: regex_search returns None on a
    # passing run, and `first` would raise on it.
    fail_msg: >-
      Missing, or created without a usable password:
      {{ authentik_user_check.stdout | regex_search('USERCHECK_FAIL:(\S*)', '\1') | default(['unknown'], true) | join(',') }}.
      The blueprint sets passwords with `state: created`, which skips accounts
      that already exist, so rerunning does not repair one that was created
      wrong. Delete each listed account in Authentik and run this playbook
      again — the explicit blueprint apply above then re-runs the creation path.
    success_msg: All accounts in authentik_users have a usable password.
