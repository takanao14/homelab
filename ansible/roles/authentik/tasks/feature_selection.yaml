---
- name: Validate selected Authentik features
  ansible.builtin.assert:
    that:
      - authentik_enabled_features is sequence
      - authentik_enabled_features is not string
      - authentik_enabled_features | length > 0
      - authentik_enabled_features | difference(authentik_supported_features) | length == 0
      - authentik_enabled_features | unique | length == authentik_enabled_features | length
    fail_msg: "authentik_enabled_features must contain unique names from {{ authentik_supported_features }}."

- name: Read the recorded Authentik feature selection
  become: true
  ansible.builtin.stat:
    path: "{{ authentik_feature_selection_file }}"
  register: authentik_feature_selection_stat

- name: Load the recorded Authentik feature selection
  become: true
  ansible.builtin.slurp:
    src: "{{ authentik_feature_selection_file }}"
  register: authentik_feature_selection_saved
  when: authentik_feature_selection_stat.stat.exists

- name: Prevent implicit feature removal or addition
  ansible.builtin.assert:
    that: >-
      (authentik_feature_selection_saved.content | b64decode).splitlines() | sort
      == authentik_enabled_features | sort
    fail_msg: >-
      The selected Authentik features differ from the recorded initial selection.
      This workflow updates installed features; it does not add or remove them.
  when: authentik_feature_selection_stat.stat.exists
