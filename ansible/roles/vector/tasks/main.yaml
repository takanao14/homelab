---
- name: Install deb822 repository prerequisites
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

# Probe apt library so check mode can continue before a reported install.
- name: Check whether the python-debian library is available
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import debian
  register: vector_python_debian
  changed_when: false
  failed_when: false
  check_mode: false

# Declarative replacement for the unpinned installer script, using its repository/key.
- name: Add Vector apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: vector
    uris: "{{ vector_repo_url }}"
    suites: stable
    components: vector-0
    signed_by: "{{ vector_repo_key_url }}"
    architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
  register: vector_repo
  when: not ansible_check_mode or vector_python_debian.rc == 0

- name: Report deferred Vector repository check
  ansible.builtin.debug:
    msg: >-
      Skipping the Vector deb822 repository check because python3-debian is
      pending installation in check mode. A normal run installs the prerequisite
      before managing the repository.
  when:
    - ansible_check_mode
    - vector_python_debian.rc != 0

- name: Update apt cache after repository change  # noqa no-handler
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: vector_repo.changed | default(false)

- name: Install Vector
  become: true
  ansible.builtin.apt:
    name: "{{ vector_package }}"
    state: present
  when: not ansible_check_mode

- name: Check whether Vector is already installed
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -x
      - "{{ vector_binary_path }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: vector_installed

- name: Report deferred Vector package-dependent checks
  ansible.builtin.debug:
    msg: >-
      Vector is not installed yet. Package installation, configuration
      validation, and service lifecycle checks are deferred until the first
      normal playbook run because the pending repository is not available to
      APT in check mode.
  when:
    - ansible_check_mode
    - vector_installed.rc != 0

- name: Configure Vector
  become: true
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    owner: root
    group: root
    mode: '0644'
    validate: "{{ vector_binary_path }} validate --no-environment %s"
  notify: Restart vector
  when: not ansible_check_mode or vector_installed.rc == 0

# Validate unchanged config after binary upgrades; template validation covers check mode.
- name: Validate installed Vector configuration
  become: true
  ansible.builtin.command:
    argv:
      - "{{ vector_binary_path }}"
      - validate
      - --no-environment
      - /etc/vector/vector.yaml
  changed_when: false
  when: not ansible_check_mode or vector_installed.rc == 0

- name: Ensure Vector is started and enabled
  become: true
  ansible.builtin.service:
    name: "{{ vector_service }}"
    state: started
    enabled: true
  when: not ansible_check_mode or vector_installed.rc == 0
