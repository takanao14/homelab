---
# Frontend/web bind address; override per host if needed.
dnsdist_server_addr: "{{ ansible_facts['default_ipv4'].address | default(ansible_host) }}"

dnsdist_repo_base_url: "http://repo.powerdns.com/ubuntu"
dnsdist_repo_release: "{{ ansible_facts['distribution_release'] | default('noble') }}"
# Release train; advance deliberately when support status changes.
dnsdist_repo_channel: "dnsdist-21"
dnsdist_repo_key_url: "https://repo.powerdns.com/FD380FBB-pub.asc"
# APT trust-anchor checksum, verified 2026-07-31; also avoids repeat downloads.
# Re-armouring requires a checksum update; key rotation changes the URL.
dnsdist_repo_key_sha256: "efeb5b1451c76de1dac8eefaddba5af5549e8fd93484728744ea7b4923decae8"
# Shared across release trains; the pin matches origin, not suite.
dnsdist_repo_key_path: "/etc/apt/keyrings/powerdns-pub.asc"
dnsdist_repo_pin_path: "/etc/apt/preferences.d/powerdns"

# Package account used to read config; resolve its primary group at runtime.
dnsdist_service_user: "_dnsdist"

# YAML ACL sequences; web ACL must include the Prometheus source.
dnsdist_mgmt_acl:
  - "127.0.0.1/32"
  - "192.168.0.0/16"
  - "10.0.0.0/8"
dnsdist_console_acl:
  - "127.0.0.1/32"

dnsdist_internal_domains:
  - "home.butaco.net."
  - "prd.butaco.net."
  - "sandbox.butaco.net."
  # Aggregated LAN reverse zone; keep scope aligned with pdns authority.
  - "168.192.in-addr.arpa."
dnsdist_internal_check_name: "ns1.home.butaco.net."

# Secrets - loaded via community.sops.sops from group_vars/dnsdist.sops.yaml
dnsdist_web_password: "{{ DNSDIST_WEB_PASSWORD }}"
dnsdist_web_api_key: "{{ DNSDIST_WEB_API_KEY }}"
dnsdist_console_key: "{{ DNSDIST_CONSOLE_KEY }}"

# Internal backends derived from secondary_auth_servers.
dnsdist_internal_backends: >-
  {{ secondary_auth_servers
     | map('combine', {
         'protocol': 'Do53',
         'pools': ['internal'],
         'health_checks': {'qname': dnsdist_internal_check_name, 'qtype': 'A'},
       })
     | list }}

# Prefer the node-local resolver; use peers as firstAvailable standbys.
dnsdist_default_health_checks:
  qname: "{{ dnsdist_default_check_name }}"
  qtype: "{{ dnsdist_default_check_type }}"

dnsdist_preferred_backend: >-
  {{ dns_resolver_servers
     | selectattr('name', 'equalto', dnsdist_preferred_resolver)
     | first
     | combine({
         'protocol': 'Do53',
         'pools': [''],
         'order': 1,
         'health_checks': dnsdist_default_health_checks,
       }) }}

dnsdist_standby_backends: >-
  {{ dns_resolver_servers
     | rejectattr('name', 'equalto', dnsdist_preferred_resolver)
     | map('combine', {
         'protocol': 'Do53',
         'pools': [''],
         'order': 2,
         'health_checks': dnsdist_default_health_checks,
       })
     | list }}

dnsdist_default_backends: "{{ [dnsdist_preferred_backend] + dnsdist_standby_backends }}"

# Data rendered directly by dnsdist.yml.j2. Enum types use PascalCase without suffixes.
# Query rule order is required: DnstapLog, SetNoRecurse, then terminal Pool.
dnsdist_config:
  # Omit top-level ACL to retain upstream private-network defaults.
  binds:
    - listen_address: "{{ dnsdist_server_addr }}:53"
      protocol: Do53

  backends: "{{ dnsdist_internal_backends + dnsdist_default_backends }}"

  load_balancing_policies:
    default_policy: firstAvailable

  ring_buffers:
    size: 10000

  console:
    listen_address: "127.0.0.1:5199"
    key: "{{ dnsdist_console_key }}"
    acl: "{{ dnsdist_console_acl }}"

  webserver:
    # Webserver uses plural listen_addresses, unlike console.
    listen_addresses:
      - "{{ dnsdist_server_addr }}:8083"
    password: "{{ dnsdist_web_password }}"
    api_key: "{{ dnsdist_web_api_key }}"
    acl: "{{ dnsdist_mgmt_acl }}"
    # LAN ACL protects unauthenticated metrics/dashboard; API remains credentialed.
    stats_require_authentication: false
    dashboard_requires_authentication: false

  remote_logging:
    dnstap_loggers:
      - name: dnsdist
        transport: unix
        address: /run/dnstap-dnsdist.sock

  query_rules:
    - name: dnstap-queries
      selector:
        type: All
      action:
        type: DnstapLog
        identity: dnsdist
        logger_name: dnsdist
    - name: internal-no-recurse
      selector:
        type: QNameSuffix
        suffixes: "{{ dnsdist_internal_domains }}"
      action:
        type: SetNoRecurse
    - name: internal-pool
      selector:
        type: QNameSuffix
        suffixes: "{{ dnsdist_internal_domains }}"
      action:
        type: Pool
        pool_name: internal
        stop_processing: true

  # Response action enum is DnstapLog, not the Lua DnstapLogResponseAction.
  response_rules:
    - name: dnstap-responses
      selector:
        type: All
      action:
        type: DnstapLog
        identity: dnsdist
        logger_name: dnsdist
