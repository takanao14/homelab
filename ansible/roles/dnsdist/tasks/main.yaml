---
- name: Validate dnsdist supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "dnsdist role currently supports Ubuntu only."

- name: Validate required environment variables
  ansible.builtin.assert:
    that:
      - primary_auth_server | length > 0
      - secondary_auth_servers | length > 0
      - dnsdist_web_password | length > 0
      - dnsdist_web_api_key | length > 0
      - dnsdist_console_key | length > 0
      - dnsdist_mgmt_acl | length > 0
      - dnsdist_console_acl | length > 0
      - dnsdist_internal_domains | length > 0
      - dnsdist_internal_check_name | length > 0
      - dns_resolver_servers | length == 2
      - dnsdist_preferred_resolver | length > 0
      - dns_resolver_servers | selectattr('name', 'equalto', dnsdist_preferred_resolver) | list | length == 1
      - dnsdist_default_check_name | length > 0
    fail_msg: "Required environment variables (PRIMARY_AUTH_SERVER, etc.) are missing. Check your .envrc.prd.dev."

- name: Ensure apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install deb822 repository prerequisites
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true

- name: Check whether the python-debian library is available
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import debian
  register: dnsdist_python_debian
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install PowerDNS repository key
  become: true
  ansible.builtin.get_url:
    url: "{{ dnsdist_repo_key_url }}"
    dest: "{{ dnsdist_repo_key_path }}"
    mode: "0644"
    checksum: "sha256:{{ dnsdist_repo_key_sha256 }}"

- name: Configure dnsdist apt pinning
  become: true
  ansible.builtin.copy:
    dest: "{{ dnsdist_repo_pin_path }}"
    mode: "0644"
    content: |
      Package: dnsdist*
      Pin: origin repo.powerdns.com
      Pin-Priority: 600

- name: Configure PowerDNS dnsdist repository
  become: true
  ansible.builtin.deb822_repository:
    name: dnsdist
    uris: "{{ dnsdist_repo_base_url }}"
    suites: "{{ dnsdist_repo_release }}-{{ dnsdist_repo_channel }}"
    components: main
    signed_by: "{{ dnsdist_repo_key_path }}"
  register: dnsdist_repo
  when: not ansible_check_mode or dnsdist_python_debian.rc == 0

- name: Report deferred dnsdist repository check
  ansible.builtin.debug:
    msg: >-
      Skipping the dnsdist deb822 repository check because python3-debian is
      pending installation in check mode. A normal run installs the prerequisite
      before managing the repository.
  when:
    - ansible_check_mode
    - dnsdist_python_debian.rc != 0

- name: Update apt cache after repository change  # noqa no-handler
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: dnsdist_repo.changed | default(false)

- name: Install dnsdist package
  become: true
  ansible.builtin.apt:
    name: dnsdist
    state: present

# The config carries the console key and the webserver password, so it is not
# world readable. dnsdist reads it as its own service account rather than as
# root, so it has to stay readable by that account's primary group.
#
# Both lookups are read-only and resolve the group by GID instead of assuming a
# name. If the package ever renames or drops the account, these fail here —
# before the config is rewritten — leaving the running service untouched.
- name: Resolve the dnsdist service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ dnsdist_service_user }}"

- name: Resolve the primary group of the dnsdist service account
  ansible.builtin.getent:
    database: group
    key: "{{ ansible_facts.getent_passwd[dnsdist_service_user][2] }}"

- name: Deploy dnsdist configuration
  become: true
  ansible.builtin.template:
    src: dnsdist.yml.j2
    dest: /etc/dnsdist/dnsdist.yml
    owner: root
    group: "{{ ansible_facts.getent_group | list | first }}"
    mode: "0640"
    # dnsdist picks the config format from the file extension, and Ansible hands
    # validate an extension-less temp file — which would be parsed as Lua and
    # fail. Copy to a .yml name first. mktemp rather than a fixed path so this
    # cannot be pre-created by another local user.
    validate: >-
      /bin/sh -c 'f=$(mktemp /tmp/dnsdist-validate.XXXXXX.yml) || exit 1;
      cp %s "$f"; /usr/bin/dnsdist --check-config -C "$f"; rc=$?; rm -f "$f"; exit $rc'
  notify: Restart dnsdist

# dnsdist 2.1 prefers dnsdist.yml but still loads a same-named .lua alongside it,
# and falls back to dnsdist.conf only when no YAML exists. Leaving the old Lua
# file behind would therefore not change what runs, but it would leave a
# plausible-looking config on disk that is no longer the running one. Remove it
# after the YAML is in place, never before.
- name: Remove the superseded Lua configuration
  become: true
  ansible.builtin.file:
    path: /etc/dnsdist/dnsdist.conf
    state: absent
  notify: Restart dnsdist

- name: Ensure dnsdist service is enabled and started
  become: true
  ansible.builtin.systemd:
    name: dnsdist
    enabled: true
    state: started
    daemon_reload: true
