---
- name: Determine if maintenance user should be created
  ansible.builtin.set_fact:
    _maintenance_user_should_run: "{{ ansible_facts['virtualization_type'] == 'lxc' or maintenance_user_force | bool }}"

- name: Setup maintenance user
  when: _maintenance_user_should_run
  block:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - maintenance_user | length > 0
        fail_msg: "maintenance_user is missing. Check your group_vars or environment."

    - name: Ensure sudo is installed
      become: true
      ansible.builtin.apt:
        name: sudo
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 120
      retries: 12
      delay: 10
      when: ansible_facts['os_family'] == "Debian"

    - name: Create the maintenance user
      become: true
      ansible.builtin.user:
        name: "{{ maintenance_user }}"
        password: "{{ maintenance_password_hash if (maintenance_password_hash | length > 0) else omit }}"
        shell: /bin/bash
        groups: sudo
        append: true
        create_home: true
        state: present
      register: maintenance_user_account

    - name: Configure passwordless sudo for the user
      become: true
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ maintenance_user }}"
        content: |
          {{ maintenance_user }} ALL=(ALL) NOPASSWD: ALL
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    # In check mode a not-yet-created user has no home to write keys into.
    - name: Authorise SSH keys for the maintenance user
      ansible.builtin.include_role:
        name: ssh_authorized_keys
      vars:
        ssh_authorized_keys_user: "{{ maintenance_user }}"
        ssh_authorized_keys_list: "{{ maintenance_user_authorized_keys }}"
      when: not (ansible_check_mode and maintenance_user_account is changed)
