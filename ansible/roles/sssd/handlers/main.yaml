---
- name: Restart sssd
  become: true
  ansible.builtin.service:
    name: sssd
    state: restarted
  when: not (ansible_check_mode and sssd_package_install is changed)

# Existing entries retain their original TTL, so clear them after config changes.
- name: Invalidate the sssd cache
  become: true
  ansible.builtin.command:
    cmd: sss_cache -E
  changed_when: true
  when: not (ansible_check_mode and sssd_package_install is changed)

- name: Restart sshd
  become: true
  ansible.builtin.service:
    name: "{{ sssd_ssh_service }}"
    state: restarted
