---
- name: Restart sssd
  become: true
  ansible.builtin.service:
    name: sssd
    state: restarted

# Existing entries retain their original TTL, so clear them after config changes.
- name: Invalidate the sssd cache
  become: true
  ansible.builtin.command:
    cmd: sss_cache -E
  changed_when: true

- name: Restart sshd
  become: true
  ansible.builtin.service:
    name: ssh
    state: restarted
