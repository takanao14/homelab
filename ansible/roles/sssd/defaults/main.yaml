---
sssd_packages:
  - sssd
  - sssd-ldap
  - sssd-tools
  - libnss-sss
  - libpam-sss
  - ldap-utils

sssd_domain: home.butaco.net

# Authentik LDAPS service name; also the verified certificate CN/SAN.
sssd_ldap_uri: ldaps://ldap.home.butaco.net:636
sssd_ldap_search_base: dc=ldap,dc=home,dc=butaco,dc=net

# Public self-signed LDAPS certificate; monitor expiry and trust it directly.
sssd_ldap_ca_cert_src: authentik-ldap-ca.pem
sssd_ldap_ca_cert_path: /etc/ssl/certs/authentik-ldap-ca.pem

# Shared lookup bind account from ldap.yaml; password comes from SOPS.
sssd_ldap_bind_dn: cn=ldapbind,ou=users,dc=ldap,dc=home,dc=butaco,dc=net

# Use cn for login; uid is opaque. Membership uses memberOf and real groups.
sssd_ldap_user_name_attr: cn
sssd_ldap_group_name_attr: cn
sssd_ldap_user_object_class: user
sssd_ldap_group_object_class: group

# Restrict Linux login to this Authentik group.
sssd_allowed_login_group: lab-linux-users

# Manage sudo locally by Authentik group; require the LDAP password.
sssd_sudo_group: lab-linux-admins
sssd_sudoers_file: /etc/sudoers.d/60-lab-linux-admins

# Limit disabled-user cache lifetime; not a break-glass mechanism.
sssd_offline_credentials_expiration: 2

# Bound how long a revoked group membership survives locally. SSSD's default is
# 5400s (90 min), which sets the ceiling on privilege revocation: sudo resolves
# the user's groups through initgroups, and that lookup is served from this
# cache. Measured LDAP-side propagation is up to ~2.5 min, so a shorter value
# here does not shrink the total much — 600s keeps both legs the same order of
# magnitude. Immediate revocation is `sss_cache -u <user>` on the host.
# Changing this does not re-stamp entries already in the on-disk cache; run
# `sss_cache -E` once after lowering it. See README.
sssd_entry_cache_timeout: 600
sssd_home_dir_template: /home/%u
sssd_default_shell: /bin/bash

# Local NOPASSWD recovery account, managed continuously for key rotation.
sssd_breakglass_user: breakglass
sssd_breakglass_sudoers_file: /etc/sudoers.d/10-breakglass
# Public recovery keys; an empty list preserves existing keys.
sssd_breakglass_authorized_keys: []
