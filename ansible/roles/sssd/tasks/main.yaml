---
# Break-glass first: everything after this point makes the host depend on
# Authentik being reachable, so the local escape hatch is established (and
# re-asserted on every run) before that dependency is introduced.
- name: Create the break-glass local account
  become: true
  ansible.builtin.user:
    name: "{{ sssd_breakglass_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Grant the break-glass account passwordless sudo
  become: true
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (sssd role). Do not edit manually.
      # Local escape hatch for when Authentik/LDAP is unavailable. NOPASSWD
      # because a working password path cannot be assumed during an outage;
      # access is controlled by the SSH key alone.
      {{ sssd_breakglass_user }} ALL=(ALL) NOPASSWD: ALL
    dest: "{{ sssd_breakglass_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Authorise SSH keys for the break-glass account
  become: true
  ansible.posix.authorized_key:
    user: "{{ sssd_breakglass_user }}"
    key: "{{ sssd_breakglass_authorized_keys | join('\n') }}"
    # Prunes keys no longer listed, so revoking one is a config change —
    # skipped entirely when the list is empty so an unset variable can never
    # wipe the account's access.
    exclusive: true
    state: present
  when: sssd_breakglass_authorized_keys | length > 0

- name: Install SSSD packages
  become: true
  ansible.builtin.apt:
    name: "{{ sssd_packages }}"
    state: present
    update_cache: true

- name: Deploy the Authentik LDAP certificate SSSD must trust
  become: true
  ansible.builtin.copy:
    src: "{{ sssd_ldap_ca_cert_src }}"
    dest: "{{ sssd_ldap_ca_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart sssd

- name: Deploy sssd.conf
  become: true
  no_log: true
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    # sssd refuses to start if this is group/world readable — it holds the
    # LDAP bind password.
    mode: '0600'
  notify: Restart sssd

# pam_mkhomedir creates the home directory on first login. Ubuntu ships this
# as a pam-auth-update profile, so enabling it there keeps it consistent with
# the distro's PAM stack management instead of hand-editing common-session.
# pam-auth-update is itself idempotent; grep the resulting PAM stack for the
# module to report changed only when it actually gets added.
- name: Check whether pam_mkhomedir is already enabled
  ansible.builtin.command:
    cmd: grep -q pam_mkhomedir /etc/pam.d/common-session
  register: sssd_mkhomedir_check
  changed_when: false
  failed_when: false

- name: Enable automatic home directory creation on first login
  become: true
  ansible.builtin.command:
    cmd: pam-auth-update --enable mkhomedir
  when: sssd_mkhomedir_check.rc != 0
  changed_when: true

# Authentik's LDAP provider cannot serve sudo rules, so sudo lives here and
# is keyed off the Authentik group name (resolved through SSSD/NSS, hence
# the %group syntax). visudo validation means a broken template fails the
# play rather than locking sudo out on the host.
- name: Grant sudo to the Authentik admin group
  become: true
  ansible.builtin.template:
    src: sudoers-admins.j2
    dest: "{{ sssd_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Configure sshd to fetch SSH public keys from Authentik via SSSD
  become: true
  ansible.builtin.template:
    src: sshd-sss.conf.j2
    dest: /etc/ssh/sshd_config.d/60-sss.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart sshd

# Validates the whole assembled config (the drop-in above is only meaningful
# in the context of the main sshd_config that Includes it). Runs before the
# handler restarts sshd, so a bad drop-in fails the play instead of taking
# SSH down on the host.
- name: Verify the assembled sshd configuration is valid
  become: true
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Ensure sssd is started and enabled
  become: true
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true
