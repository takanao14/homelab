---
- name: Require a supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in sssd_supported_versions
      - >-
        ansible_facts['distribution_version'] is
        match(sssd_supported_versions.get(ansible_facts['distribution'], 'a^'))
    fail_msg: >-
      The sssd role supports Ubuntu 24.04 and Rocky Linux 9 only; found
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.

# Establish local recovery before introducing the Authentik dependency.
- name: Create the break-glass local account
  become: true
  ansible.builtin.user:
    name: "{{ sssd_breakglass_user }}"
    shell: /bin/bash
    create_home: true
    state: present
  register: sssd_breakglass_account

- name: Grant the break-glass account passwordless sudo
  become: true
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (sssd role). Do not edit manually.
      # SSH-key recovery when Authentik/LDAP and password paths are unavailable.
      {{ sssd_breakglass_user }} ALL=(ALL) NOPASSWD: ALL
    dest: "{{ sssd_breakglass_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Authorise SSH keys for the break-glass account
  become: true
  ansible.posix.authorized_key:
    user: "{{ sssd_breakglass_user }}"
    key: "{{ sssd_breakglass_authorized_keys | join('\n') }}"
    # Prune revoked keys, but skip empty input to prevent lockout.
    exclusive: true
    state: present
  when:
    - sssd_breakglass_authorized_keys | length > 0
    - not (ansible_check_mode and sssd_breakglass_account is changed)

- name: Update the apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Install SSSD packages
  become: true
  ansible.builtin.package:
    name: "{{ sssd_packages }}"
    state: present
  register: sssd_package_install

- name: Deploy the Authentik LDAP certificate SSSD must trust
  become: true
  ansible.builtin.copy:
    src: "{{ sssd_ldap_ca_cert_src }}"
    dest: "{{ sssd_ldap_ca_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart sssd

- name: Deploy sssd.conf
  become: true
  no_log: true
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    # Contains LDAP bind password; SSSD requires private permissions.
    mode: '0600'
  notify:
    - Restart sssd
    # Apply a changed cache timeout to existing entries.
    - Invalidate the sssd cache

# Enable pam_mkhomedir through Ubuntu's PAM manager; report only real changes.
- name: Check whether pam_mkhomedir is already enabled on Ubuntu
  ansible.builtin.command:
    cmd: grep -q pam_mkhomedir /etc/pam.d/common-session
  register: sssd_mkhomedir_check
  changed_when: false
  failed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: Enable automatic home directory creation on Ubuntu
  become: true
  ansible.builtin.command:
    cmd: pam-auth-update --enable mkhomedir
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - sssd_mkhomedir_check.rc != 0
  changed_when: true

- name: Read the active authselect profile on Rocky Linux
  become: true
  ansible.builtin.command:
    cmd: authselect current --raw
  register: sssd_authselect_profile
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'Rocky'

- name: Verify pristine PAM and NSS packages before initial authselect migration # noqa command-instead-of-module
  become: true
  ansible.builtin.command:
    cmd: rpm --verify pam glibc
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - sssd_authselect_profile.rc != 0

- name: Initialize the SSS authselect profile on Rocky Linux
  become: true
  ansible.builtin.command:
    cmd: authselect select sssd with-mkhomedir --force
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - sssd_authselect_profile.rc != 0
  changed_when: true

- name: Select the SSS authselect profile on Rocky Linux
  become: true
  ansible.builtin.command:
    cmd: authselect select sssd with-mkhomedir
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - sssd_authselect_profile.rc == 0
    - sssd_authselect_profile.stdout.split() | first != 'sssd'
  changed_when: true

- name: Read the active authselect features on Rocky Linux
  become: true
  ansible.builtin.command:
    cmd: authselect current
  register: sssd_authselect_current
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - sssd_authselect_profile.rc == 0
    - sssd_authselect_profile.stdout.split() | first == 'sssd'

- name: Enable automatic home directory creation on Rocky Linux
  become: true
  ansible.builtin.command:
    cmd: authselect enable-feature with-mkhomedir
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - sssd_authselect_profile.rc == 0
    - sssd_authselect_profile.stdout.split() | first == 'sssd'
    - "'with-mkhomedir' not in sssd_authselect_current.stdout"
  changed_when: true

- name: Ensure oddjobd is started and enabled on Rocky Linux
  become: true
  ansible.builtin.service:
    name: oddjobd
    state: started
    enabled: true
  when:
    - ansible_facts['distribution'] == 'Rocky'
    - not (ansible_check_mode and sssd_package_install is changed)

# Manage sudo by SSSD group locally; validate with visudo before install.
- name: Grant sudo to the Authentik admin group
  become: true
  ansible.builtin.template:
    src: sudoers-admins.j2
    dest: "{{ sssd_sudoers_file }}"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Configure sshd to fetch SSH public keys from Authentik via SSSD
  become: true
  ansible.builtin.template:
    src: sshd-sss.conf.j2
    dest: /etc/ssh/sshd_config.d/60-sss.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart sshd

# Validate assembled sshd config before restart.
- name: Verify the assembled sshd configuration is valid
  become: true
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -t
  changed_when: false

- name: Ensure sssd is started and enabled
  become: true
  ansible.builtin.service:
    name: sssd
    state: started
    enabled: true
  when: not (ansible_check_mode and sssd_package_install is changed)
