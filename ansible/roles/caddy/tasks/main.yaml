---
- name: Create caddy group
  become: true
  ansible.builtin.group:
    name: "{{ caddy_group }}"
    system: true
    state: present

- name: Create caddy user
  become: true
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Create caddy config directory
  become: true
  ansible.builtin.file:
    path: /etc/caddy
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0750"

- name: Read installed Caddy checksum
  become: true
  ansible.builtin.stat:
    path: "{{ caddy_binary }}"
    checksum_algorithm: sha256
  register: caddy_installed_binary

- name: Read installed Caddy build info
  become: true
  ansible.builtin.command:
    argv: ["{{ caddy_binary }}", build-info]
  register: caddy_installed_build_info
  changed_when: false
  failed_when: false
  check_mode: false
  when: caddy_installed_binary.stat.exists

# Check both the pinned hash and embedded build metadata so stale caddy_sha256
# values cannot silently skip a pin upgrade.
- name: Determine whether Caddy needs rebuild or reinstall
  ansible.builtin.set_fact:
    caddy_install_required: >-
      {{
        (caddy_installed_binary.stat.checksum | default('') != caddy_sha256)
        or (caddy_installed_build_info.rc | default(1) != 0)
        or (not caddy_installed_go_matches)
        or (not caddy_installed_caddy_matches)
        or (not caddy_installed_cloudflare_matches)
      }}
  vars:
    caddy_installed_build_lines: "{{ caddy_installed_build_info.stdout_lines | default([]) }}"
    caddy_installed_go_matches: >-
      {{ caddy_installed_build_lines
         | map('split')
         | select('equalto', ['go', 'go' ~ caddy_go_version])
         | list | length > 0 }}
    caddy_installed_caddy_matches: >-
      {{ caddy_installed_build_lines
         | select('match', '^dep\s+github\.com/caddyserver/caddy/v2\s+v' ~ (caddy_version | regex_escape) ~ '(?:\s|$)')
         | list | length > 0 }}
    caddy_installed_cloudflare_matches: >-
      {{ caddy_installed_build_lines
         | select('match', '^dep\s+github\.com/caddy-dns/cloudflare\s+v' ~ (caddy_cloudflare_version | regex_escape) ~ '(?:\s|$)')
         | list | length > 0 }}

- name: Build and install pinned Caddy binary
  ansible.builtin.import_tasks: install.yaml
  when: caddy_install_required | bool

- name: Set CAP_NET_BIND_SERVICE on Caddy binary
  become: true
  community.general.capabilities:
    path: "{{ caddy_binary }}"
    capability: cap_net_bind_service+ep
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy Caddyfile
  become: true
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_config }}"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0640"
    validate: "{{ caddy_binary }} validate --config %s --adapter caddyfile"
  environment:
    CF_API_TOKEN: "{{ cloudflare_api_token | default('') }}"
  no_log: true
  notify: Restart caddy

- name: Deploy caddy environment file
  become: true
  ansible.builtin.template:
    src: caddy.env.j2
    dest: "{{ caddy_env_file }}"
    owner: "{{ caddy_user }}"
    group: "{{ caddy_group }}"
    mode: "0640"
  when: caddy_acme_enabled | bool
  no_log: true
  notify: Restart caddy

# Remove stale Cloudflare credentials from HTTP-only hosts.
- name: Remove caddy environment file when ACME is disabled
  become: true
  ansible.builtin.file:
    path: "{{ caddy_env_file }}"
    state: absent
  when: not caddy_acme_enabled | bool
  notify: Restart caddy

- name: Deploy caddy systemd unit
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/caddy.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Caddy
      After=network.target

      [Service]
      User={{ caddy_user }}
      Group={{ caddy_group }}
      ExecStart={{ caddy_binary }} run --config {{ caddy_config }}
      ExecReload={{ caddy_binary }} reload --config {{ caddy_config }}
      EnvironmentFile=-{{ caddy_env_file }}
      TimeoutStopSec=5s
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: Restart caddy

- name: Ensure caddy is started and enabled
  become: true
  ansible.builtin.systemd:
    name: caddy
    state: started
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
