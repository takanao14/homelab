---
caddy_binary: /usr/local/bin/caddy
caddy_config: /etc/caddy/Caddyfile
caddy_env_file: /etc/caddy/caddy.env
caddy_user: caddy
caddy_group: caddy

# Built on the controller with xcaddy; changing any pin changes caddy_sha256.
# renovate: datasource=github-releases depName=caddyserver/caddy
caddy_version: "2.11.8"
# renovate: datasource=github-tags depName=caddy-dns/cloudflare
caddy_cloudflare_version: "0.2.4"
# renovate: datasource=github-releases depName=caddyserver/xcaddy
caddy_xcaddy_version: "0.4.7"
# renovate: datasource=golang-version depName=go
caddy_go_version: "1.27.3"
caddy_sha256: "62e2c4d1134b12f6bc28b8573d1d20d80d63ea42057de2b3ce63d2d3dcb69949"
caddy_build_dir: "{{ lookup('env', 'HOME') }}/.cache/homelab/caddy"
caddy_build_artifact: >-
  {{ caddy_build_dir }}/caddy-{{ caddy_version }}-cloudflare-{{ caddy_cloudflare_version
  }}-go{{ caddy_go_version }}-linux-amd64

# Enable ACME DNS-01; false serves HTTP only and needs no Cloudflare token.
caddy_acme_enabled: true

# ACME account email (used for Let's Encrypt expiry notifications)
caddy_acme_email: ""

# ACME CA endpoint
# Let's Encrypt staging: https://acme-staging-v02.api.letsencrypt.org/directory
# Let's Encrypt production: https://acme-v02.api.letsencrypt.org/directory
caddy_acme_ca: "https://acme-v02.api.letsencrypt.org/directory"

# Reverse-proxy upstreams; override in group_vars/caddy.yaml.
caddy_upstreams: []

# Redirect-only sites; override in group_vars/caddy.yaml.
caddy_redirects: []

# Request headers deleted from Caddy logs (canonical Go header casing).
caddy_log_redacted_headers:
  - X-Runner-Token
