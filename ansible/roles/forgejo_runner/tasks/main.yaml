---
- name: Create forgejo-runner group
  become: true
  ansible.builtin.group:
    name: "{{ forgejo_runner_group }}"
    system: true
    state: present

- name: Create forgejo-runner user
  become: true
  ansible.builtin.user:
    name: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    home: "{{ forgejo_runner_home }}"
    shell: /bin/bash
    system: true
    state: present

- name: Create required directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    mode: '0750'
  loop:
    - "{{ forgejo_runner_home }}"
    - "{{ forgejo_runner_config | dirname }}"

- name: Install prerequisites for Docker repo
  become: true
  ansible.builtin.apt:
    name:
      - git
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true

- name: Ensure apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Add Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Check whether the python-debian library is available
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import debian
  register: forgejo_runner_python_debian
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add Docker repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    mode: '0644'
  when: not ansible_check_mode or forgejo_runner_python_debian.rc == 0

- name: Report deferred Docker repository check
  ansible.builtin.debug:
    msg: >-
      Skipping the Docker deb822 repository check because python3-debian is
      pending installation in check mode. A normal run installs the prerequisite
      before managing the repository.
  when:
    - ansible_check_mode
    - forgejo_runner_python_debian.rc != 0

- name: Install Docker CE
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true

- name: Configure Docker BuildKit garbage collection
  become: true
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ forgejo_runner_docker_daemon_config }}"
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/dockerd --validate --config-file=%s
  notify: Restart docker

- name: Add runner user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ forgejo_runner_user }}"
    groups: docker
    append: true

- name: Ensure docker is started and enabled
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Download forgejo-runner binary
  become: true
  ansible.builtin.get_url:
    url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-amd64"
    dest: "{{ forgejo_runner_binary }}"
    owner: root
    group: root
    mode: '0755'
  notify: Restart forgejo-runner

- name: Ensure homelab version marker directory exists
  become: true
  ansible.builtin.file:
    path: /usr/local/share/homelab-versions
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Record installed forgejo-runner version
  become: true
  ansible.builtin.copy:
    dest: /usr/local/share/homelab-versions/forgejo-runner.version
    content: "{{ forgejo_runner_version }}\n"
    owner: root
    group: root
    mode: '0644'

- name: Deploy forgejo-runner config
  become: true
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ forgejo_runner_config }}"
    owner: "{{ forgejo_runner_user }}"
    group: "{{ forgejo_runner_group }}"
    mode: '0640'
  notify: Restart forgejo-runner

- name: Get runner registration token from Forgejo API
  ansible.builtin.uri:
    url: "{{ forgejo_runner_url }}/api/v1/admin/runners/registration-token"
    method: GET
    headers:
      Authorization: "token {{ forgejo_admin_token }}"
    status_code: 200
  register: forgejo_runner_registration
  when: not (forgejo_runner_home + '/.runner') is file

- name: Register forgejo-runner
  become: true
  ansible.builtin.command:
    cmd: >
      runuser -u {{ forgejo_runner_user }} --
      {{ forgejo_runner_binary }} register
      --no-interactive
      --instance {{ forgejo_runner_url }}
      --token {{ forgejo_runner_registration.json.token }}
      --name {{ forgejo_runner_name }}
      --labels {{ forgejo_runner_labels | join(',') }}
      --config {{ forgejo_runner_config }}
    creates: "{{ forgejo_runner_home }}/.runner"
  when: not (forgejo_runner_home + '/.runner') is file

- name: Deploy forgejo-runner systemd unit
  become: true
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: /etc/systemd/system/forgejo-runner.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart forgejo-runner

- name: Ensure forgejo-runner is started and enabled
  become: true
  ansible.builtin.service:
    name: forgejo-runner
    state: started
    enabled: true
