---
# renovate: datasource=gitea-releases depName=forgejo/runner registryUrl=https://code.forgejo.org
forgejo_runner_version: "13.2.2"
forgejo_runner_sha256: "6b077ccadc22036ba049cea39b09cfbdc5e5ad6000a38f90c83a19e4fb815543"
forgejo_runner_user: runner
forgejo_runner_group: runner
forgejo_runner_home: /var/lib/forgejo-runner
forgejo_runner_binary: /usr/local/bin/forgejo-runner
forgejo_runner_config: /etc/forgejo-runner/config.yml
forgejo_runner_service_name: forgejo-runner
forgejo_runner_build_cache_keep_storage: 20GB
forgejo_runner_container_network: host
# Keep build jobs compatible until socket-free jobs use a separate runner.
forgejo_runner_mount_docker_socket: true

forgejo_runner_url: "https://forgejo.home.butaco.net"
forgejo_admin_token: "" # noqa var-naming[no-role-prefix]
forgejo_runner_name: "{{ inventory_hostname }}"
forgejo_runner_labels:
  - "self-hosted:docker://catthehacker/ubuntu:act-24.04"
  - "ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04"
