---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yaml"

- name: Ensure chrony is installed
  become: true
  ansible.builtin.package:
    name: chrony
    state: present
  when: chrony_install | default(true)

- name: Check whether chrony configuration is installed
  ansible.builtin.stat:
    path: "{{ chrony_conf_path }}"
  register: chrony_config_installed

- name: Configure installed chrony
  ansible.builtin.include_tasks: configure.yaml
  when: not ansible_check_mode or chrony_config_installed.stat.exists

- name: Report deferred chrony configuration check
  ansible.builtin.debug:
    msg: >-
      Chrony is pending installation. Configuration and service checks are
      deferred until the first normal run because check mode does not install
      its configuration file or service unit.
  when:
    - ansible_check_mode
    - not chrony_config_installed.stat.exists
