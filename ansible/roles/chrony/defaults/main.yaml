---
# Install chrony; disable for preinstalled hosts such as Proxmox. Config still applies.
chrony_install: true

# Disable timesyncd on Debian/Ubuntu; skip when chrony already owns time sync.
chrony_manage_timesyncd: true

# Internal router is the client authority; it owns upstream redundancy.
chrony_servers:
  - 192.168.10.1

# Optional client sources; normally empty because the router owns redundancy.
chrony_fallback_servers: []

# Exclude only untrusted/noisy dynamic source directories.
chrony_disabled_source_dirs: []
