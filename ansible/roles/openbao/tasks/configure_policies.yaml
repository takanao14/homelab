      path "secret/metadata/k8s/monitoring/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

- name: Write policy for headlamp namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-headlamp -"
    stdin: |
      path "secret/data/k8s/headlamp/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/headlamp/*" {
        capabilities = ["read"]
      }
      path "secret/data/kubeconfig/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/kubeconfig/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

- name: Write policy for gpu-switch namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-gpu-switch -"
    stdin: |
      path "secret/data/k8s/gpu-switch/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/gpu-switch/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

# Scoped per environment, unlike the per-app policies above. Each cluster has
# its own Argo CD admin password, so neither cluster's ESO should be able to
# read the other's hash. Looping over openbao_k8s_clusters covers any
# environment added there without a matching edit here.
- name: Write per-environment policies for the ArgoCD admin password
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-argocd-{{ item.name }} -"
    stdin: |
      path "secret/data/k8s/argocd/{{ item.name }}/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/argocd/{{ item.name }}/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  loop: "{{ openbao_k8s_clusters }}"
  loop_control:
    label: "k8s-argocd-{{ item.name }}"
  changed_when: true
