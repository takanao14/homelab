---
# KV v2 stores secrets at secret/data/<path>, so policies must use that prefix.

- name: Log in as the Ansible admin user
  ansible.builtin.include_tasks: login_admin.yaml

- name: Delete retired policies
  ansible.builtin.command:
    argv:
      - "{{ openbao_binary }}"
      - policy
      - delete
      - "{{ item }}"
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  loop: "{{ openbao_absent_policies }}"
  changed_when: true

- name: Write policy for cert-manager namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-cert-manager -"
    stdin: |
      path "secret/data/k8s/cert-manager/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/cert-manager/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

- name: Write policy for external-dns namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-external-dns -"
    stdin: |
      path "secret/data/k8s/external-dns/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/external-dns/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

- name: Write policy for homepage namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-homepage -"
    stdin: |
      path "secret/data/k8s/homepage/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/k8s/homepage/*" {
        capabilities = ["read"]
      }
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  changed_when: true

- name: Write policy for monitoring namespace
  ansible.builtin.command:
    cmd: "{{ openbao_binary }} policy write k8s-monitoring -"
    stdin: |
      path "secret/data/k8s/monitoring/*" {
        capabilities = ["read"]
