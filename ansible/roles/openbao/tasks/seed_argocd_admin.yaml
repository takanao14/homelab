---
# Write Argo CD hash/mtime only on rotation to preserve sessions and KV history.

- name: Log in as the Ansible admin user
  ansible.builtin.include_tasks: login_admin.yaml

- name: Read the ArgoCD admin password hash currently stored in OpenBao
  ansible.builtin.command:
    cmd: >
      {{ openbao_binary }} kv get
      -field=password secret/k8s/argocd/{{ item.env }}/admin
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  loop: "{{ openbao_argocd_admin }}"
  loop_control:
    label: "{{ item.env }}"
  register: openbao_argocd_admin_current
  # Missing path triggers first write; other failures surface during that write.
  failed_when: false
  changed_when: false
  no_log: true

- name: Write the ArgoCD admin password and stamp mtime when the hash changed
  ansible.builtin.command:
    cmd: >
      {{ openbao_binary }} kv put secret/k8s/argocd/{{ item.item.env }}/admin
      password={{ item.item.password }}
      mtime={{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}
  environment:
    BAO_ADDR: "{{ openbao_local_addr }}"
    BAO_TOKEN: "{{ openbao_admin_token }}"
  loop: "{{ openbao_argocd_admin_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.env }}"
  when: (item.stdout | default('')) != item.item.password
  changed_when: true
  no_log: true
  register: openbao_argocd_admin_results
  ignore_errors: true

# Re-report only non-secret environment and stderr after censored write failures.
- name: Report ArgoCD admin seed failures without exposing secret values
  ansible.builtin.fail:
    msg: |
      {% for r in openbao_argocd_admin_results.results | default([]) if r is failed %}
      {{ r.item.item.env }}: {{ r.stderr | default(r.msg) | default('unknown error') }}
      {% endfor %}
  when: openbao_argocd_admin_results is failed
