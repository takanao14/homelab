---
# renovate: datasource=github-releases depName=openbao/openbao
openbao_version: "2.6.2"
openbao_user: openbao
openbao_group: openbao
openbao_package_hold: true
openbao_backup_dir: /var/backups/openbao
openbao_config_dir: /etc/openbao
openbao_data_dir: /opt/openbao/data
openbao_binary: /usr/bin/bao
openbao_seal_key_path: "{{ openbao_config_dir }}/seal.key"

openbao_api_port: 8200
openbao_cluster_port: 8201
openbao_api_addr: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_api_port }}"
openbao_cluster_addr: "{{ 'http' if openbao_tls_disable else 'https' }}://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_cluster_port }}"

openbao_tls_disable: true
openbao_tls_cert_file: "{{ openbao_config_dir }}/tls/cert.pem"
openbao_tls_key_file: "{{ openbao_config_dir }}/tls/key.pem"

# Prometheus metric retention.
openbao_prometheus_retention_time: "60s"

# Peer API addresses for Raft auto-join.
# e.g. ["https://192.168.10.1:8200", "https://192.168.10.2:8200"]
openbao_raft_retry_join: []

# Permanent seal key ID; update on rotation.
openbao_seal_key_id: "key-1"

# Base64-encoded 32-byte seal key from SOPS group_vars.
# Generate with: openssl rand -base64 32
openbao_seal_key: ""

# Local CLI endpoint; Caddy terminates external TLS.
openbao_local_addr: "http://127.0.0.1:{{ openbao_api_port }}"

# SOPS root token for bootstrap/recovery only.
openbao_root_token: ""

# Ansible userpass credentials; password comes from SOPS.
openbao_ansible_user: ansible-admin
openbao_ansible_password: ""

# prd Kubernetes auth.
openbao_k8s_host: ""

# sandbox Kubernetes auth.
openbao_k8s_sandbox_host: ""

# Cluster CAs are harvested by ops-openbao_register_cluster.yaml.
openbao_k8s_clusters:
  - name: prd
    mount_path: kubernetes
    host: "{{ openbao_k8s_host }}"
    ca_cert_file: "{{ openbao_config_dir }}/k8s-prd-ca.pem"
    role: k8s-eso
    # Argo CD policy is restricted to the prd secret path.
    policies: "k8s-cert-manager,k8s-external-dns,k8s-homepage,k8s-monitoring,k8s-gpu-switch,k8s-argocd-prd"
  - name: sandbox
    mount_path: kubernetes-sandbox
    host: "{{ openbao_k8s_sandbox_host }}"
    ca_cert_file: "{{ openbao_config_dir }}/k8s-sandbox-ca.pem"
    role: k8s-eso
    # Argo CD policy is restricted to sandbox; monitoring includes Grafana.
    policies: "k8s-external-dns,k8s-homepage,k8s-monitoring,k8s-argocd-sandbox"

# Retired policies removed idempotently from the server.
openbao_absent_policies:
  - k8s-longhorn-ui
  - k8s-headlamp

# SOPS-backed KV entries: path and data.
# Example:
#   openbao_secrets:
#     - path: secret/k8s/cert-manager/cloudflare
#       data:
#         api-token: "xxxx"
openbao_secrets: []

# Per-environment Argo CD bcrypt hashes; write only on change to preserve mtime.
# env must match a configured cluster; stored under secret/k8s/argocd/<env>/admin.
# Example:
#   openbao_argocd_admin:
#     - env: prd
#       password: "$2a$10$..."
openbao_argocd_admin: []

# SOPS userpass entries: username, password, comma-separated policies.
# Example:
#   openbao_userpass_users:
#     - username: alice
#       password: "xxxx"
#       policies: "kv-admin"
openbao_userpass_users: []
