---
# renovate: datasource=github-releases depName=openbao/openbao
openbao_version: "2.6.1"
openbao_user: openbao
openbao_group: openbao
openbao_package_hold: true
openbao_backup_dir: /var/backups/openbao
openbao_config_dir: /etc/openbao
openbao_data_dir: /opt/openbao/data
openbao_binary: /usr/bin/bao
openbao_seal_key_path: "{{ openbao_config_dir }}/seal.key"

openbao_api_port: 8200
openbao_cluster_port: 8201
openbao_api_addr: "https://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_api_port }}"
openbao_cluster_addr: "{{ 'http' if openbao_tls_disable else 'https' }}://{{ ansible_facts['default_ipv4']['address'] }}:{{ openbao_cluster_port }}"

openbao_tls_disable: true
openbao_tls_cert_file: "{{ openbao_config_dir }}/tls/cert.pem"
openbao_tls_key_file: "{{ openbao_config_dir }}/tls/key.pem"

# How long Prometheus-format metrics stay in memory before eviction.
openbao_prometheus_retention_time: "60s"

# List of other cluster node API addresses for Raft auto-join
# e.g. ["https://192.168.10.1:8200", "https://192.168.10.2:8200"]
openbao_raft_retry_join: []

# Static seal key ID (permanent identifier, update when rotating key)
openbao_seal_key_id: "key-1"

# Static seal key: 32 raw bytes, base64-encoded (set via group_vars with SOPS encryption)
# Generate with: openssl rand -base64 32
openbao_seal_key: ""

# Local API address used by bao CLI tasks running on the openbao host itself.
# TLS is terminated by Caddy upstream, so the listener is plain HTTP.
openbao_local_addr: "http://127.0.0.1:{{ openbao_api_port }}"

# Root token (set via group_vars with SOPS encryption; bootstrap/recovery only)
openbao_root_token: ""

# Ansible userpass credentials. Override the password via SOPS-encrypted group_vars.
openbao_ansible_user: ansible-admin
openbao_ansible_password: ""

# Kubernetes auth configuration
# prd cluster (mount path: kubernetes)
openbao_k8s_host: ""

# sandbox cluster (mount path: kubernetes-sandbox)
openbao_k8s_sandbox_host: ""

# All clusters to configure. Cluster CA certificates are harvested at runtime by
# ops-openbao_register_cluster.yaml and injected into openbao_k8s_target_clusters.
openbao_k8s_clusters:
  - name: prd
    mount_path: kubernetes
    host: "{{ openbao_k8s_host }}"
    ca_cert_file: "{{ openbao_config_dir }}/k8s-prd-ca.pem"
    role: k8s-eso
    # k8s-argocd-prd is environment-scoped on purpose: it grants read on
    # secret/k8s/argocd/prd/* only, so this cluster cannot read the sandbox
    # ArgoCD admin password.
    policies: "k8s-cert-manager,k8s-external-dns,k8s-homepage,k8s-monitoring,k8s-headlamp,k8s-gpu-switch,k8s-argocd-prd"
  - name: sandbox
    mount_path: kubernetes-sandbox
    host: "{{ openbao_k8s_sandbox_host }}"
    ca_cert_file: "{{ openbao_config_dir }}/k8s-sandbox-ca.pem"
    role: k8s-eso
    # k8s-monitoring covers the Grafana admin secret read by the sandbox
    # monitoring subset (secret/k8s/monitoring/grafana). k8s-argocd-sandbox is
    # environment-scoped: read on secret/k8s/argocd/sandbox/* only.
    policies: "k8s-external-dns,k8s-homepage,k8s-longhorn-ui,k8s-monitoring,k8s-argocd-sandbox"

# Secrets to write into OpenBao KV (set via group_vars with SOPS encryption)
# Each entry requires: path (KV path) and data (key/value pairs)
# Example:
#   openbao_secrets:
#     - path: secret/k8s/cert-manager/cloudflare
#       data:
#         api-token: "xxxx"
openbao_secrets: []

# ArgoCD admin password, one entry per environment. Deliberately kept out of
# openbao_secrets: seed_argocd_admin.yaml writes an entry only when the hash
# changed and stamps mtime at that moment, whereas the generic loop above
# rewrites its whole list on every run. Each entry requires: env (must match an
# openbao_k8s_clusters[].name, so the generated k8s-argocd-<env> policy grants
# read on it) and password (bcrypt hash — never the plaintext).
# Written to secret/k8s/argocd/<env>/admin. Set via SOPS-encrypted group_vars.
# Example:
#   openbao_argocd_admin:
#     - env: prd
#       password: "$2a$10$..."
openbao_argocd_admin: []

# Userpass auth users (set via group_vars with SOPS encryption)
# Each entry requires: username, password, policies (comma-separated)
# Available policies: kv-admin (full CRUD on secret/), kv-read (read-only on secret/)
# Example:
#   openbao_userpass_users:
#     - username: alice
#       password: "xxxx"
#       policies: "kv-admin"
openbao_userpass_users: []
