---
- name: Ensure journald drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Remove legacy journald syslog forwarding drop-ins
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/journald.conf.d/{{ item }}"
    state: absent
  loop:
    - forward-to-syslog.conf
    - 99-forward-to-syslog.conf
  when: item != journald_forward_to_syslog_dropin
  notify: Restart systemd-journald

- name: Configure journald syslog forwarding
  become: true
  ansible.builtin.template:
    src: forward-to-syslog.conf.j2
    dest: "/etc/systemd/journald.conf.d/{{ journald_forward_to_syslog_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Configure journald storage
  become: true
  ansible.builtin.template:
    src: storage.conf.j2
    dest: "/etc/systemd/journald.conf.d/{{ journald_storage_dropin }}"
    owner: root
    group: root
    mode: "0644"
  when: journald_storage != "auto"
  notify:
    - Restart systemd-journald
    - Flush the journal to persistent storage

- name: Remove journald storage override
  become: true
  ansible.builtin.file:
    path: "/etc/systemd/journald.conf.d/{{ journald_storage_dropin }}"
    state: absent
  when: journald_storage == "auto"
  notify: Restart systemd-journald

- name: Apply journald configuration before managing rsyslog
  ansible.builtin.meta: flush_handlers

- name: Check syslog unit availability
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ item }}"
  loop:
    - rsyslog.service
    - syslog.socket
  register: journald_syslog_units
  check_mode: false
  changed_when: false
  when: journald_disable_rsyslog

- name: Disable installed syslog units
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: "{{ false if item.item == 'rsyslog.service' else omit }}"
    masked: "{{ true if item.item == 'syslog.socket' else omit }}"
  loop: "{{ journald_syslog_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - journald_disable_rsyslog
    - item.stdout | default('not-found') | trim != 'not-found'
