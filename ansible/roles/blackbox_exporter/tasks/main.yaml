---
- name: Install prometheus-blackbox-exporter
  become: true
  ansible.builtin.apt:
    name:
      - prometheus-blackbox-exporter
      - libcap2-bin  # required for setcap command
    state: present
    update_cache: true

- name: Deploy the LDAPS certificate for the ldaps module
  become: true
  ansible.builtin.copy:
    src: "{{ blackbox_exporter_ldaps_ca_src }}"
    dest: "{{ blackbox_exporter_ldaps_ca_path }}"
    owner: root
    group: root
    mode: '0644'
  when: blackbox_exporter_ldaps_enabled | bool
  notify: Restart blackbox_exporter

- name: Remove the LDAPS certificate where the ldaps module is disabled
  become: true
  ansible.builtin.file:
    path: "{{ blackbox_exporter_ldaps_ca_path }}"
    state: absent
  when: not blackbox_exporter_ldaps_enabled | bool

- name: Deploy blackbox_exporter config
  become: true
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart blackbox_exporter

- name: Configure blackbox_exporter listen address
  become: true
  ansible.builtin.template:
    src: prometheus-blackbox-exporter.default.j2
    dest: /etc/default/prometheus-blackbox-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart blackbox_exporter

- name: Configure Blackbox Exporter network startup ordering
  become: true
  when: blackbox_exporter_networkd_wait_interface | length > 0
  block:
    - name: Create the Blackbox Exporter systemd drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-blackbox-exporter.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      register: blackbox_exporter_drop_in_directory

    - name: Wait for routable IPv4 before starting Blackbox Exporter
      ansible.builtin.template:
        src: wait-for-ipv4.conf.j2
        dest: /etc/systemd/system/prometheus-blackbox-exporter.service.d/20-wait-for-ipv4.conf
        owner: root
        group: root
        mode: '0644'
      when: not ansible_check_mode or not blackbox_exporter_drop_in_directory.changed
      notify: Restart blackbox_exporter

- name: Remove the Blackbox Exporter network startup drop-in when disabled
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-blackbox-exporter.service.d/20-wait-for-ipv4.conf
    state: absent
  when: blackbox_exporter_networkd_wait_interface | length == 0
  notify: Restart blackbox_exporter

- name: Check for installed blackbox_exporter binary
  ansible.builtin.stat:
    path: /usr/bin/prometheus-blackbox-exporter
  register: blackbox_exporter_binary

# Grant CAP_NET_RAW directly for reliable ICMP probes.
- name: Grant CAP_NET_RAW to blackbox_exporter binary (for ICMP)
  become: true
  community.general.capabilities:
    path: /usr/bin/prometheus-blackbox-exporter
    capability: cap_net_raw=ep
    state: present
  when: blackbox_exporter_binary.stat.exists

- name: Ensure prometheus-blackbox-exporter is started and enabled
  become: true
  ansible.builtin.service:
    name: prometheus-blackbox-exporter
    state: started
    enabled: true
  when: blackbox_exporter_binary.stat.exists
