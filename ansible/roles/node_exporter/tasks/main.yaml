---
- name: Install prometheus-node-exporter
  become: true
  ansible.builtin.apt:
    name: "{{ node_exporter_package }}"
    state: present
    update_cache: true

- name: Check whether node_exporter is already installed
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -x
      - "{{ node_exporter_binary_path }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: node_exporter_installed

- name: Report deferred node_exporter service check
  ansible.builtin.debug:
    msg: >-
      node_exporter is not installed yet. Service lifecycle checks are deferred
      until the first normal playbook run because APT does not create the
      systemd unit in check mode.
  when:
    - ansible_check_mode
    - node_exporter_installed.rc != 0

# Masking rather than removing the package: prometheus-node-exporter-collectors
# produces the apt / nvme / smartmon textfile metrics that are actually scraped,
# and its Recommends would drag ipmitool and openipmi back in on the next
# dist-upgrade. A mask survives that, a removal does not.
# LoadState rather than list-unit-files: openipmi ships an LSB init script that
# systemd-sysv-generator turns into a unit, so there is no unit file to list,
# and list-unit-files exits 0 even when nothing matches. systemctl show always
# exits 0 and reports not-found / loaded / masked unambiguously.
- name: Check the state of openipmi.service
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - openipmi.service
  register: node_exporter_openipmi
  check_mode: false
  changed_when: false

- name: Mask openipmi.service
  become: true
  ansible.builtin.systemd_service:
    name: openipmi.service
    state: stopped
    masked: true
  when:
    - node_exporter_mask_openipmi
    - "'LoadState=not-found' not in node_exporter_openipmi.stdout_lines"

# Masking does not clear a failure that systemd has already recorded: the unit
# stays in ActiveState=failed and keeps showing up in `systemctl list-units
# --state=failed`, which is exactly the noise the mask is meant to remove.
- name: Clear the recorded openipmi.service failure
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - openipmi.service
  when:
    - node_exporter_mask_openipmi
    - "'ActiveState=failed' in node_exporter_openipmi.stdout_lines"
  changed_when: true

- name: Install lm-sensors for temperature monitoring on amd64
  become: true
  ansible.builtin.apt:
    name: lm-sensors
    state: present
  when:
    - ansible_facts['architecture'] == "x86_64"
    - node_exporter_install_lm_sensors | bool

# Removal has to be explicit so hosts that were provisioned before the flag
# existed converge too. The autoremove in playbooks/tasks/package_upgrade.yaml
# never reclaims lm-sensors: the task above installs it by name, which marks it
# manual, and autoremove only collects auto-marked packages.
- name: Remove lm-sensors where hardware sensors are unavailable
  become: true
  ansible.builtin.apt:
    name: lm-sensors
    state: absent
    autoremove: true
  when: not (node_exporter_install_lm_sensors | bool)

- name: Configure node_exporter args
  become: true
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart node_exporter

- name: Ensure textfile collector directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install Raspberry Pi monitoring script
  become: true
  ansible.builtin.template:
    src: rpi_throttled_metrics.sh.j2
    dest: /usr/local/bin/rpi_throttled_metrics.sh
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['architecture'] in ["aarch64", "armv7l"]

# Write to a temp file and rename so node_exporter never scrapes a
# partially written .prom file (rename is atomic on the same filesystem).
- name: Add cron job for Raspberry Pi monitoring script
  become: true
  ansible.builtin.cron:
    name: "Raspberry Pi Throttling Metrics"
    minute: "*"
    job: >-
      /usr/local/bin/rpi_throttled_metrics.sh
      > /var/lib/node_exporter/textfile_collector/rpi_throttled.prom.tmp
      && mv /var/lib/node_exporter/textfile_collector/rpi_throttled.prom.tmp
      /var/lib/node_exporter/textfile_collector/rpi_throttled.prom
  when: ansible_facts['architecture'] in ["aarch64", "armv7l"]

- name: Ensure prometheus-node-exporter is started and enabled
  become: true
  ansible.builtin.service:
    name: "{{ node_exporter_service }}"
    state: started
    enabled: true
  when: not ansible_check_mode or node_exporter_installed.rc == 0
