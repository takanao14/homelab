---
- name: Install prometheus-node-exporter
  become: true
  ansible.builtin.apt:
    name: "{{ node_exporter_package }}"
    state: present
    update_cache: true

- name: Check whether node_exporter is already installed
  ansible.builtin.command:
    argv:
      - /usr/bin/test
      - -x
      - "{{ node_exporter_binary_path }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: node_exporter_installed

- name: Report deferred node_exporter service check
  ansible.builtin.debug:
    msg: >-
      node_exporter is not installed yet. Service lifecycle checks are deferred
      until the first normal playbook run because APT does not create the
      systemd unit in check mode.
  when:
    - ansible_check_mode
    - node_exporter_installed.rc != 0

# Mask instead of remove: package recommendations would reinstall openipmi.
# Use LoadState because the generated LSB unit has no unit file to list.
- name: Check the state of openipmi.service
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - openipmi.service
  register: node_exporter_openipmi
  check_mode: false
  changed_when: false

- name: Mask openipmi.service
  become: true
  ansible.builtin.systemd_service:
    name: openipmi.service
    state: stopped
    masked: true
  when:
    - node_exporter_mask_openipmi
    - "'LoadState=not-found' not in node_exporter_openipmi.stdout_lines"

# Clear recorded failure after masking.
- name: Clear the recorded openipmi.service failure
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - openipmi.service
  when:
    - node_exporter_mask_openipmi
    - "'ActiveState=failed' in node_exporter_openipmi.stdout_lines"
  changed_when: true

- name: Install lm-sensors for temperature monitoring on amd64
  become: true
  ansible.builtin.apt:
    name: lm-sensors
    state: present
  when:
    - ansible_facts['architecture'] == "x86_64"
    - node_exporter_install_lm_sensors | bool

# Explicitly remove manually-marked lm-sensors when disabled.
- name: Remove lm-sensors where hardware sensors are unavailable
  become: true
  ansible.builtin.apt:
    name: lm-sensors
    state: absent
    autoremove: true
  when: not (node_exporter_install_lm_sensors | bool)

- name: Configure node_exporter args
  become: true
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart node_exporter

- name: Check whether textfile collector writer group exists
  ansible.builtin.command:
    argv:
      - /usr/bin/getent
      - group
      - "{{ node_exporter_textfile_group }}"
  register: node_exporter_textfile_group_status
  check_mode: false
  changed_when: false
  failed_when: false

- name: Create textfile collector writer group
  become: true
  ansible.builtin.group:
    name: "{{ node_exporter_textfile_group }}"
    system: true
    state: present

- name: Ensure textfile collector directory exists
  become: true
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: "{{ node_exporter_textfile_group }}"
    mode: "{{ node_exporter_textfile_dir_mode }}"
  when: not ansible_check_mode or node_exporter_textfile_group_status.rc == 0

- name: Report deferred textfile collector directory ownership
  ansible.builtin.debug:
    msg: >-
      The {{ node_exporter_textfile_group }} group is pending creation in check
      mode. Directory ownership validation is deferred until the first normal
      node_exporter run.
  when:
    - ansible_check_mode
    - node_exporter_textfile_group_status.rc != 0

# Remove obsolete unscripted textfile path from the previous role layout.
- name: Remove the superseded textfile collector directory
  become: true
  ansible.builtin.file:
    path: /var/lib/node_exporter
    state: absent

- name: Install Raspberry Pi monitoring script
  become: true
  ansible.builtin.template:
    src: rpi_throttled_metrics.sh.j2
    dest: /usr/local/bin/rpi_throttled_metrics.sh
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['architecture'] in ["aarch64", "armv7l"]

# Atomic rename prevents partial .prom scrapes.
- name: Add cron job for Raspberry Pi monitoring script
  become: true
  ansible.builtin.cron:
    name: "Raspberry Pi Throttling Metrics"
    minute: "*"
    job: >-
      /usr/local/bin/rpi_throttled_metrics.sh
      > {{ node_exporter_textfile_dir }}/rpi_throttled.prom.tmp
      && mv {{ node_exporter_textfile_dir }}/rpi_throttled.prom.tmp
      {{ node_exporter_textfile_dir }}/rpi_throttled.prom
  when: ansible_facts['architecture'] in ["aarch64", "armv7l"]

- name: Ensure prometheus-node-exporter is started and enabled
  become: true
  ansible.builtin.service:
    name: "{{ node_exporter_service }}"
    state: started
    enabled: true
  when: not ansible_check_mode or node_exporter_installed.rc == 0
