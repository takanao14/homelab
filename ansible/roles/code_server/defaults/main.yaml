---
# renovate: datasource=github-releases depName=coder/code-server
code_server_version: "4.135.0"

# Existing editor account; inherits agent config, keys, git, and SOPS state.
code_server_user: ""
code_server_group: "{{ code_server_user }}"
code_server_home: "/home/{{ code_server_user }}"

# Folder code-server opens on connect.
code_server_workspace: "{{ code_server_home }}/lab"

code_server_binary: /usr/bin/code-server
code_server_config_dir: "{{ code_server_home }}/.config/code-server"
code_server_config: "{{ code_server_config_dir }}/config.yaml"
code_server_settings_dir: "{{ code_server_home }}/.local/share/code-server/User"

# Bind for cross-subnet Caddy; exposure remains LAN/VPN only.
code_server_bind_addr: "0.0.0.0:8080"
code_server_hostname: vscode.home.butaco.net

# SOPS Argon2 password hash; avoid a trailing newline when generating it.
code_server_hashed_password: ""

code_server_deb_url: >-
  https://github.com/coder/code-server/releases/download/v{{ code_server_version }}/code-server_{{ code_server_version }}_amd64.deb
code_server_deb_path: "/tmp/code-server_{{ code_server_version }}_amd64.deb"
