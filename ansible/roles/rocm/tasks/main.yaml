---
- name: Require a supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in rocm_ubuntu_releases
      - ansible_facts['architecture'] == 'x86_64'
    fail_msg: "ROCm requires an explicitly supported Ubuntu amd64 release."

- name: Gather installed packages for exporter and kernel checks
  ansible.builtin.package_facts:
    manager: auto

- name: Require a clean container exporter installation
  ansible.builtin.assert:
    that:
      - "'amdgpu-exporter' not in ansible_facts.packages"
    fail_msg: "Rebuild the guest before using the container exporter; native package migration is not supported."
  when: rocm_ubuntu_release.exporter_mode == 'container'

# AMD's installer owns files this role also manages: /etc/apt/keyrings/rocm.gpg,
# a repo.radeon.com pin, and one-line .list conffiles that duplicate the amdgpu
# source and add unmanaged Radeon Software graphics repos which the pin then
# elevates to priority 600. Purge, not remove, or the conffiles survive.
# Must precede the keyring tasks below: they skip when the keyring already
# exists, so purging afterwards would delete the key they decided not to write.
- name: Purge amdgpu-install and the apt sources and key it ships
  become: true
  ansible.builtin.apt:
    name: amdgpu-install
    state: absent
    purge: true

- name: Ensure apt keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
    owner: root
    group: root
    recurse: true

- name: Download ROCm GPG key
  become: true
  ansible.builtin.get_url:
    url: https://repo.radeon.com/rocm/rocm.gpg.key
    dest: /tmp/rocm.gpg.key
    mode: '0644'
  register: rocm_gpg_key_download
  retries: 3
  delay: 5

- name: Check ROCm apt keyring
  ansible.builtin.stat:
    path: /etc/apt/keyrings/rocm.gpg
  register: rocm_gpg_keyring

- name: Add ROCm GPG key to keyring
  become: true
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /etc/apt/keyrings/rocm.gpg
      - /tmp/rocm.gpg.key
  changed_when: true
  when: rocm_gpg_key_download.changed or not rocm_gpg_keyring.stat.exists

- name: Install prerequisites
  # https://rocm.docs.amd.com/en/latest/install/rocm.html (Prerequisites, Install additional packages)
  become: true
  ansible.builtin.apt:
    name:
      - wget
      - python3-debian
      - libatomic1
      - libquadmath0
    state: present
    update_cache: true

- name: Check whether the python-debian library is available
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - import debian
  register: rocm_python_debian
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add user to render and video groups
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    groups:
      - render
      - video
    append: true

- name: Download amdgpu-insecure-instinct-udev-rules
  ansible.builtin.get_url:
    url: "https://repo.radeon.com/amdgpu/{{ rocm_amdgpu_version }}/ubuntu/pool/main/a/amdgpu-insecure-instinct-udev-rules/{{ rocm_udev_rules }}"
    dest: "/tmp/{{ rocm_udev_rules }}"
    mode: '0644'
    timeout: 60
  retries: 3
  delay: 5

- name: Grant GPU access to all users on the system
  become: true
  ansible.builtin.apt:
    deb: "/tmp/{{ rocm_udev_rules }}"
    state: present
    update_cache: true
  when: not ansible_check_mode

# ROCm 7.14+ repo uses a separate key from amdgpu/device-metrics.
- name: Download ROCm 7.14+ apt repository GPG key
  become: true
  ansible.builtin.get_url:
    url: https://stable.repo.amd.com/rocm/gpg/packages.gpg
    dest: /tmp/amdrocm.gpg.key
    mode: '0644'
  register: rocm_amd_gpg_key_download
  retries: 3
  delay: 5

- name: Check ROCm multi-arch apt keyring
  ansible.builtin.stat:
    path: /etc/apt/keyrings/amdrocm.gpg
  register: rocm_amd_gpg_keyring

- name: Add ROCm 7.14+ apt repository GPG key to keyring
  become: true
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /etc/apt/keyrings/amdrocm.gpg
      - /tmp/amdrocm.gpg.key
  changed_when: true
  when: rocm_amd_gpg_key_download.changed or not rocm_amd_gpg_keyring.stat.exists

- name: Add ROCm apt preferences pin
  become: true
  ansible.builtin.copy:
    src: rocm-pin-600
    dest: /etc/apt/preferences.d/rocm-pin-600
    mode: '0644'
    owner: root
    group: root

# Remove legacy ROCm metapackages before gfx-specific packages; never autoremove
# their shared build dependencies. Old flat /opt/rocm does not conflict.
- name: Purge legacy ROCm packages predating the repo.amd.com apt repo
  become: true
  ansible.builtin.apt:
    name:
      - rocm
      - rocm-core
    state: absent
    purge: true

- name: Configure ROCm apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: rocm
    types:
      - deb
    uris:
      - https://stable.repo.amd.com/rocm/core/packages/{{ rocm_ubuntu_release.repository }}
    suites:
      - stable
    components:
      - main
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/amdrocm.gpg
    state: present
    mode: '0644'
  register: rocm_apt_repository
  when: not ansible_check_mode or rocm_python_debian.rc == 0

- name: Configure AMD Deb822 repositories
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types:
      - deb
    uris:
      - "{{ item.uri }}"
    suites:
      - "{{ rocm_ubuntu_codename }}"
    components:
      - main
    architectures:
      - amd64
    signed_by: /etc/apt/keyrings/rocm.gpg
    state: present
    mode: '0644'
  loop:
    - name: amdgpu
      uri: "https://repo.radeon.com/amdgpu/{{ rocm_amdgpu_version }}/ubuntu"
    - name: device-metrics-exporter
      uri: "https://repo.radeon.com/device-metrics-exporter/apt/{{ rocm_device_metrics_exporter_version }}"
  register: rocm_deb822_repositories
  when:
    - not ansible_check_mode or rocm_python_debian.rc == 0
    - item.name != 'device-metrics-exporter' or rocm_ubuntu_release.exporter_mode == 'native'

- name: Report deferred ROCm repository check
  ansible.builtin.debug:
    msg: >-
      Skipping the ROCm deb822 repository check because python3-debian is
      pending installation in check mode. A normal run installs the prerequisite
      before managing the repositories.
  when:
    - ansible_check_mode
    - rocm_python_debian.rc != 0

- name: Update apt cache after repository changes
  become: true
  ansible.builtin.apt:
    update_cache: true
  when:
    - not ansible_check_mode
    - >-
      (rocm_apt_repository.changed | default(false))
      or (rocm_deb822_repositories.changed | default(false))

# Install only the pinned AMD-supported kernel/headers before DKMS builds.
- name: Install the ROCm-supported pinned kernel
  become: true
  ansible.builtin.apt:
    name:
      - "linux-image-{{ rocm_hwe_kernel }}"
      - "linux-headers-{{ rocm_hwe_kernel }}"
      - "{{ rocm_ubuntu_release.kernel_modules_package }}-{{ rocm_hwe_kernel }}"
    state: present
    update_cache: true

# Hold rolling metapackages; review a new ABI before changing the pinned kernel.
- name: Hold rolling kernel metapackages at their current version
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ rocm_ubuntu_release.kernel_metapackages }}"
  when: item in ansible_facts.packages

- name: Gather kernel facts
  ansible.builtin.setup:
    gather_subset:
      - kernel

- name: Assert the running kernel is the ROCm-supported pinned kernel
  ansible.builtin.assert:
    that:
      - ansible_facts['kernel'] == rocm_hwe_kernel
    fail_msg: >-
      Running kernel {{ ansible_facts['kernel'] }} is not the ROCm-supported
      pinned kernel {{ rocm_hwe_kernel }}. amdgpu-dkms only builds cleanly on
      AMD-supported kernels, so boot into {{ rocm_hwe_kernel }} (set it as the
      GRUB default and reboot) before
      running this role.
    success_msg: "Running the ROCm-supported kernel {{ rocm_hwe_kernel }}."
  when: not ansible_check_mode

- name: Read available boot partition space before AMD GPU driver upgrade
  ansible.builtin.command:
    argv:
      - df
      - --output=avail
      - --block-size=1M
      - /boot
  register: rocm_boot_available
  changed_when: false
  when: rocm_amdgpu_package_state == 'latest'

- name: Verify boot partition space before AMD GPU driver upgrade
  ansible.builtin.assert:
    that:
      - rocm_boot_available.stdout_lines[-1] | int >= rocm_amdgpu_minimum_boot_free_mb
    fail_msg: >-
      /boot requires at least {{ rocm_amdgpu_minimum_boot_free_mb }} MB free before upgrading amdgpu-dkms;
      only {{ rocm_boot_available.stdout_lines[-1] | int }} MB is available.
  when: rocm_amdgpu_package_state == 'latest'

- name: Gather services before a container-backed GPU driver upgrade
  ansible.builtin.service_facts:
  when:
    - rocm_ubuntu_release.exporter_mode == 'container'
    - rocm_amdgpu_package_state == 'latest'

# AMD requires the exporter to stop before unloading or replacing the driver.
- name: Stop the exporter container before upgrading the GPU driver
  become: true
  ansible.builtin.systemd_service:
    name: amd-metrics-exporter
    state: stopped
  when:
    - rocm_ubuntu_release.exporter_mode == 'container'
    - rocm_amdgpu_package_state == 'latest'
    - "'amd-metrics-exporter.service' in ansible_facts.services"

- name: Install AMD GPU kernel driver
  become: true
  ansible.builtin.apt:
    name: amdgpu-dkms
    state: "{{ rocm_amdgpu_package_state }}"
    update_cache: true
  register: rocm_amdgpu_install

- name: Install ROCm
  become: true
  ansible.builtin.apt:
    name:
      - "{{ rocm_package_name }}"
    state: "{{ rocm_package_state }}"
    update_cache: true
  async: 3600
  poll: 30

# Remove the old release only after installation succeeds to preserve it on failure.
# Coexisting library directories would mix releases in ld.so.conf.
# Use installed package names; unmatched APT wildcards fail.
- name: Gather package facts before removing the previous ROCm release
  ansible.builtin.package_facts:
    manager: auto
  when: rocm_previous_version | length > 0

- name: Remove the previous ROCm release
  become: true
  ansible.builtin.apt:
    name: "{{ rocm_previous_packages }}"
    state: absent
    purge: true
  vars:
    rocm_previous_packages: >-
      {{ ansible_facts.packages | default({}) | list
         | select('match', 'amdrocm[a-z-]*' ~ (rocm_previous_version | regex_escape) ~ '($|[^0-9.])')
         | list }}
  when:
    - rocm_previous_version | length > 0
    - rocm_previous_packages | length > 0

- name: Discover ROCm component library directories
  ansible.builtin.command:
    cmd: find /opt/rocm -mindepth 2 -maxdepth 2 -type d -name lib
  register: rocm_lib_dirs
  changed_when: false
  when: not ansible_check_mode

- name: Assert ROCm component library directories were found
  ansible.builtin.assert:
    that:
      - rocm_lib_dirs.stdout_lines | length > 0
    fail_msg: "No /opt/rocm/*/lib directories found after installing ROCm; check the amdrocm package layout."
  when: not ansible_check_mode

- name: Configure ROCm library path
  become: true
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/rocm.conf
    content: |
      {{ rocm_lib_dirs.stdout }}
    owner: root
    group: root
    mode: '0644'
  when: not ansible_check_mode

- name: Update ldconfig
  become: true
  ansible.builtin.command:
    cmd: ldconfig
  changed_when: false

- name: Reboot to apply AMD GPU driver
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 300
  when:
    - rocm_amdgpu_install.changed
    - not ansible_check_mode

- name: Configure the native AMD metrics exporter
  ansible.builtin.include_tasks: exporter-native.yaml
  when: rocm_ubuntu_release.exporter_mode == 'native'

- name: Configure the container AMD metrics exporter
  ansible.builtin.include_tasks: exporter-container.yaml
  when: rocm_ubuntu_release.exporter_mode == 'container'

- name: Read installed ROCm package version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - --showformat=${Version}
      - "{{ rocm_package_name }}"
  register: rocm_installed_version
  changed_when: false
  when: not ansible_check_mode

- name: Verify installed ROCm package version
  ansible.builtin.assert:
    that:
      # Match upstream prefix because Debian adds a revision suffix.
      - rocm_installed_version.stdout.startswith(rocm_version)
    fail_msg: "Installed ROCm {{ rocm_installed_version.stdout }} does not match requested {{ rocm_version }}."
    success_msg: "ROCm {{ rocm_installed_version.stdout }} is installed."
  when: not ansible_check_mode

- name: Discover ROCm component bin directories
  ansible.builtin.command:
    cmd: find /opt/rocm -mindepth 2 -maxdepth 2 -type d -name bin
  register: rocm_bin_dirs
  changed_when: false
  when: not ansible_check_mode

- name: Locate hipcc and rocminfo binaries
  ansible.builtin.find:
    paths: "{{ rocm_bin_dirs.stdout_lines }}"
    patterns:
      - hipcc
      - rocminfo
    file_type: file
  register: rocm_verify_bins
  when: not ansible_check_mode

- name: Assert hipcc and rocminfo were found
  ansible.builtin.assert:
    that:
      - rocm_verify_bins.files | selectattr('path', 'match', '.*/hipcc$') | list | length > 0
      - rocm_verify_bins.files | selectattr('path', 'match', '.*/rocminfo$') | list | length > 0
    fail_msg: >-
      Could not locate hipcc and/or rocminfo under any /opt/rocm/*/bin directory;
      found bin dirs: {{ rocm_bin_dirs.stdout_lines }}
  when: not ansible_check_mode

- name: Verify HIP compiler
  ansible.builtin.command:
    cmd: "{{ (rocm_verify_bins.files | selectattr('path', 'match', '.*/hipcc$') | first).path }} --version"
  changed_when: false
  when: not ansible_check_mode

- name: Verify ROCm detects a GPU
  ansible.builtin.command:
    cmd: "{{ (rocm_verify_bins.files | selectattr('path', 'match', '.*/rocminfo$') | first).path }}"
  register: rocm_info
  changed_when: false
  when: not ansible_check_mode

- name: Assert ROCm detected a GPU agent
  ansible.builtin.assert:
    that:
      - "'Device Type:             GPU' in rocm_info.stdout"
    fail_msg: ROCm did not detect a GPU agent.
    success_msg: ROCm detected a GPU agent.
  when: not ansible_check_mode
