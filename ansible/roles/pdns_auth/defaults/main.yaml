---
pdns_repo_base_url: "http://repo.powerdns.com/ubuntu" # noqa var-naming[no-role-prefix]
pdns_repo_release: "{{ ansible_facts['distribution_release'] | default('noble') }}" # noqa var-naming[no-role-prefix]
# Release train; advance deliberately with support status. 5.0 -> 5.1 needs no schema change.
pdns_repo_channel: "auth-51" # noqa var-naming[no-role-prefix]
pdns_repo_key_url: "https://repo.powerdns.com/FD380FBB-pub.asc" # noqa var-naming[no-role-prefix]
# Shared APT trust-anchor checksum; keep aligned with dnsdist (verified 2026-07-31).
pdns_repo_key_sha256: "efeb5b1451c76de1dac8eefaddba5af5549e8fd93484728744ea7b4923decae8" # noqa var-naming[no-role-prefix]
# Shared across release trains; the pin matches origin, not suite.
pdns_repo_key_path: "/etc/apt/keyrings/powerdns-pub.asc" # noqa var-naming[no-role-prefix]
pdns_repo_pin_path: "/etc/apt/preferences.d/powerdns" # noqa var-naming[no-role-prefix]

pdns_webserver_port: 8081 # noqa var-naming[no-role-prefix]

# Export zone serials for primary/secondary comparison; reuse node_exporter path.
pdns_zone_serial_metrics_path: >- # noqa var-naming[no-role-prefix]
  {{ node_exporter_textfile_dir | default('/var/lib/prometheus/node-exporter')
  }}/pdns_zone_serial.prom
pdns_zone_serial_script_path: "/usr/local/sbin/pdns-zone-serial" # noqa var-naming[no-role-prefix]
pdns_zone_serial_interval: "5min" # noqa var-naming[no-role-prefix]

# Secrets - loaded via community.sops.sops from group_vars/dns_{primary,secondary}.sops.yaml
pdns_primary_api_key: "{{ PDNS_PRIMARY_API_KEY }}" # noqa var-naming[no-role-prefix]
pdns_secondary_api_key: "{{ PDNS_SECONDARY_API_KEY }}" # noqa var-naming[no-role-prefix]
