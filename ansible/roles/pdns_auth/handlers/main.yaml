---
- name: Restart pdns
  ansible.builtin.systemd:
    name: pdns
    state: restarted
    daemon_reload: true

- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

# Restart only existing units; first-run enable handles startup.
- name: Restart pdns zone serial timer
  become: true
  ansible.builtin.systemd:
    name: pdns-zone-serial.timer
    state: restarted
  when: pdns_auth_zone_serial_unit.stdout | trim != "not-found"
