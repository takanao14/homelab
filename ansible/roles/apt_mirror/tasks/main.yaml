---
# Ubuntu only
- name: Skip non-Ubuntu systems
  ansible.builtin.meta: end_host
  when: ansible_facts["distribution"] != "Ubuntu"

- name: Write mirror list
  become: true
  ansible.builtin.copy:
    dest: "{{ apt_mirror_list_path }}"
    content: |
      {% for url in apt_mirror_urls %}
      {{ url }}	priority:{{ loop.index }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  notify: Update apt cache

- name: Check DEB822 sources file existence
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/ubuntu.sources
  register: apt_mirror_deb822_sources

- name: Check sources.list existence
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: apt_mirror_legacy_sources

# Any archive URI ending in /ubuntu, so hosts on a previous mirror also move.
# Security and ubuntu-ports sources do not match and stay unchanged.
- name: Point DEB822 sources at the mirror list
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/ubuntu.sources
    regexp: '^URIs:[ \t]+(?!\S*security)\S+/ubuntu/?[ \t]*$'
    replace: "URIs: mirror+file:{{ apt_mirror_list_path }}"
  when: apt_mirror_deb822_sources.stat.exists
  notify: Update apt cache

- name: Point sources.list at the mirror list
  become: true
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: '^(deb(?:-src)?[ \t]+(?:\[[^\]\n]*\][ \t]+)?)(?!\S*security)\S+/ubuntu/?(?=[ \t]+(?![\w.-]*security))'
    replace: '\g<1>mirror+file:{{ apt_mirror_list_path }}'
  when: apt_mirror_legacy_sources.stat.exists
  notify: Update apt cache
