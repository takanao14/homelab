---
- name: Install rsyslog
  become: true
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true

# Use input() on rsyslog >=8.2312; older versions fall back to legacy $RuleSet.
- name: Gather rsyslog package version
  become: true
  ansible.builtin.package_facts:
    manager: apt

- name: Determine imjournal input() support
  ansible.builtin.set_fact:
    rsyslog_imjournal_input_supported: >-
      {{
        (ansible_facts.packages['rsyslog'][0].version
          | regex_replace('-.*$', ''))
        is version('8.2312.0', '>=', version_type='loose')
      }}

- name: Configure rsyslog forwarding
  become: true
  ansible.builtin.template:
    src: 99-forward.conf.j2
    dest: /etc/rsyslog.d/99-forward.conf
    owner: root
    group: root
    mode: '0644'
    validate: rsyslogd -N1 -f %s
  notify: Restart rsyslog

- name: Ensure rsyslog is started and enabled
  become: true
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
