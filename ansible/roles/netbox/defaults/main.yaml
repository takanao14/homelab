---
# The image tag combines both versions as `v<netbox_version>-<netbox_docker_version>`.
# renovate: datasource=github-releases depName=netbox-community/netbox
netbox_version: "4.7.0"
# renovate: datasource=github-releases depName=netbox-community/netbox-docker
netbox_docker_version: "5.1.1"
netbox_pg_image: docker.io/postgres:18-alpine
netbox_redis_image: docker.io/valkey/valkey:9.1-alpine

netbox_network: netbox
netbox_container: netbox
netbox_worker_container: netbox-worker
netbox_pg_container: netbox-postgres
netbox_redis_container: netbox-redis
netbox_redis_cache_container: netbox-redis-cache

netbox_domain: "netbox.home.butaco.net"
# Caddy terminates TLS and reaches this published Granian port.
netbox_port: 8080

netbox_base_dir: /opt/netbox
netbox_media_dir: "{{ netbox_base_dir }}/media"
netbox_reports_dir: "{{ netbox_base_dir }}/reports"
netbox_scripts_dir: "{{ netbox_base_dir }}/scripts"
netbox_pg_data_dir: /var/lib/netbox-postgresql
netbox_redis_data_dir: /var/lib/netbox-redis
netbox_config_dir: /etc/netbox
netbox_env_file: "{{ netbox_config_dir }}/netbox.env"
netbox_pg_env_file: "{{ netbox_config_dir }}/netbox-postgres.env"

# The image's `netbox` account is uid 999, gid 0, and the image has no USER
# directive; bind mounts must carry that ownership or uploads and scripts fail.
netbox_container_uid: 999
netbox_container_gid: 0

netbox_db_name: netbox
netbox_db_user: netbox
netbox_db_password: ""

netbox_secret_key: ""
netbox_api_token_pepper: ""

netbox_superuser_name: admin
netbox_superuser_email: "admin@home.butaco.net"
netbox_superuser_password: ""

# Read-only identity consumed by the NetBox MCP server (scripts/netbox-mcp.sh).
netbox_mcp_enabled: true
netbox_mcp_username: mcp-netbox
netbox_mcp_group: mcp-readers
netbox_mcp_group_description: "Read-only API access for MCP service accounts"
netbox_mcp_permission_name: mcp-readers-view
netbox_mcp_permission_description: "View-only access to infrastructure objects"
# Grant model view by app; omit credential/account apps. Token write_enabled enforces read-only.
netbox_mcp_permission_app_labels:
  - circuits
  - dcim
  - ipam
  - tenancy
  - virtualization
  - vpn
  - wireless
# Additional individual object types as `app_label.model`, e.g. `extras.tag`.
netbox_mcp_permission_object_types: []
netbox_mcp_token_description: "NetBox MCP server (read-only)"
# Generated by scripts/netbox-mcp-token.sh and kept in .env/secrets.sops.env.
netbox_mcp_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
