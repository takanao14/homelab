---
# renovate: datasource=github-releases depName=netbox-community/netbox
netbox_version: "4.6.8"
netbox_user: netbox
netbox_group: netbox
netbox_home: /opt/netbox
netbox_venv: /opt/netbox/venv

netbox_domain: "netbox-ui.home.butaco.net"
netbox_port: 8080

netbox_db_name: netbox
netbox_db_user: netbox
netbox_db_password: ""

netbox_secret_key: ""
netbox_api_token_pepper: ""

netbox_superuser_name: admin
netbox_superuser_email: "admin@home.butaco.net"
netbox_superuser_password: ""

# Read-only identity consumed by the NetBox MCP server (scripts/netbox-mcp.sh).
netbox_mcp_enabled: true
netbox_mcp_username: mcp-netbox
netbox_mcp_group: mcp-readers
netbox_mcp_group_description: "Read-only API access for MCP service accounts"
netbox_mcp_permission_name: mcp-readers-view
netbox_mcp_permission_description: "View-only access to infrastructure objects"
# Every model in these apps is granted `view`. Apps holding credentials or
# accounts (users, core, extras) are deliberately left out. Note that NetBox's
# built-in DEFAULT_PERMISSIONS still lets any account see its own token row;
# `write_enabled = False` on the token is what keeps it read-only. See README.
netbox_mcp_permission_app_labels:
  - circuits
  - dcim
  - ipam
  - tenancy
  - virtualization
  - vpn
  - wireless
# Additional individual object types as `app_label.model`, e.g. `extras.tag`.
netbox_mcp_permission_object_types: []
netbox_mcp_token_description: "NetBox MCP server (read-only)"
# Generated by scripts/netbox-mcp-token.sh and kept in .env/secrets.sops.env.
netbox_mcp_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
