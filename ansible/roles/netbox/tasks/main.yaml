---
- name: Create the NetBox configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ netbox_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy NetBox environment files
  become: true
  no_log: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ netbox_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - netbox.env
    - netbox-postgres.env
  notify: Restart netbox containers

# Holds no secrets, and the container's netbox account must be able to read it.
- name: Deploy the NetBox Python configuration overrides
  become: true
  ansible.builtin.copy:
    src: extra.py
    dest: "{{ netbox_extra_config_file }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart netbox containers

# The image's netbox account owns these at build time; a bind mount replaces
# that ownership, and reports/scripts additionally need g+w.
- name: Create the NetBox application data directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ netbox_container_uid }}"
    group: "{{ netbox_container_gid }}"
    mode: '0775'
  loop:
    - "{{ netbox_base_dir }}"
    - "{{ netbox_media_dir }}"
    - "{{ netbox_reports_dir }}"
    - "{{ netbox_scripts_dir }}"

# PostgreSQL (uid 70, 0700) and Valkey own these; managing owner or mode here
# would break PostgreSQL on subsequent runs.
- name: Ensure the NetBox datastore directories exist  # noqa: risky-file-permissions
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ netbox_pg_data_dir }}"
    - "{{ netbox_redis_data_dir }}"

- name: Deploy NetBox Quadlet units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ podman_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - netbox.network
    - netbox-postgres.container
    - netbox-redis.container
    - netbox-redis-cache.container
    - netbox.container
    - netbox-worker.container
  notify:
    - Reload systemd
    - Restart netbox containers

- name: Ensure NetBox services are enabled and started
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - netbox-postgres.service
    - netbox-redis.service
    - netbox-redis-cache.service
    - netbox.service
    - netbox-worker.service

- name: Ensure NetBox is running the latest configuration before the MCP identity is provisioned
  ansible.builtin.meta: flush_handlers

# A first boot applies NetBox's whole migration history plus trace_paths and a
# reindex before Granian binds, which takes several minutes on this guest.
- name: Wait for NetBox to answer
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ netbox_port }}/login/"
    status_code: 200
  register: netbox_ready
  until: netbox_ready.status == 200
  retries: 90
  delay: 10
  when: not ansible_check_mode

# Last, so a problem with the MCP identity cannot leave NetBox itself undeployed.
- name: Provision the read-only MCP identity
  ansible.builtin.import_tasks: mcp.yaml
  when: netbox_mcp_enabled | bool
