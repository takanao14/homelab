---
- name: Reload systemd
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart netbox containers
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - netbox-postgres.service
    - netbox-redis.service
    - netbox-redis-cache.service
    - netbox.service
    - netbox-worker.service
