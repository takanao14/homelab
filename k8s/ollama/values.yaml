hostname: ollama.prd.butaco.net
gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  # Override Envoy's 15s default for long agent responses.
  timeouts:
    request: 10m
    backendRequest: 10m
# 32768 fits an 8–13 GB model with q8_0 cache; verify VRAM before increasing.
numCtx: 32768
flashAttention: true
kvCacheType: q8_0
