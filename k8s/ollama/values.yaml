hostname: ollama.prd.butaco.net
gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  # Override Envoy's 15s default for long agent responses.
  timeouts:
    request: 10m
    backendRequest: 10m
# Measured with gemma4:12b (~6.7 GB weights) + q8_0 cache: 8646/16304 MiB VRAM
# at 32768 (2026-08-23, amd_gpu_used_vram via Grafana). 65536 projects to
# ~10.5 GB (65%); re-verify amd_gpu_used_vram after the next model load.
numCtx: 65536
flashAttention: true
kvCacheType: q8_0
