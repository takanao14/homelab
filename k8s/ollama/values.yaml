hostname: ollama.prd.butaco.net
gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  # Override Envoy's 15s default for long agent responses.
  timeouts:
    request: 10m
    backendRequest: 10m
# Measured with gemma4:12b (~6.7 GB weights) + q8_0 cache: 8646/16304 MiB VRAM
# at 32768 (2026-08-23, amd_gpu_used_vram via Grafana). 100000 projects to
# ~12.5 GB (77%); no VRAM limit enforced at the k8s level, so a bad value
# OOMs the ollama process and CrashLoopBackOffs (see ADR-0035) — re-verify
# amd_gpu_used_vram after the next model load before pushing higher.
numCtx: 100000
flashAttention: true
kvCacheType: q8_0
