hostname: ollama.prd.butaco.net
gateway:
  # Override Envoy's 15s default for long agent responses.
  timeouts:
    request: 10m
    backendRequest: 10m
# Validated gemma4:12b long-context profile with q8_0 KV cache (ADR-0035).
# Context size can exhaust VRAM; recheck amd_gpu_used_vram after model changes.
numCtx: 131072
flashAttention: true
kvCacheType: q8_0
