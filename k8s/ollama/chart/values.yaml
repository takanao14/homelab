replicaCount: 0

hostname: ""

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeouts:
    request: ""
    backendRequest: ""

image:
  # Self-contained ROCm 7.2.1 userspace with gfx1200; see README before bumps.
  repository: ollama/ollama
  tag: 0.32.9-rocm

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  size: 100Gi
  storageClassName: openebs-hostpath

# Default OLLAMA_CONTEXT_LENGTH; environments raise it for agents.
numCtx: 4096

# KV quantization requires flash attention. Types: "" (f16), q8_0, q4_0.
flashAttention: false
kvCacheType: ""

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule
