apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        homelab/gpu-switchable: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: ollama
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 11434
          startupProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 30
            failureThreshold: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /
              port: 11434
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            periodSeconds: 10
          env:
            # OLLAMA_NUM_CTX is ignored; use OLLAMA_CONTEXT_LENGTH.
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.numCtx | quote }}
            {{- if .Values.flashAttention }}
            # Required for KV-cache quantization.
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            {{- end }}
            {{- if .Values.kvCacheType }}
            # Quantize the KV cache for large contexts; requires flash attention.
            - name: OLLAMA_KV_CACHE_TYPE
              value: {{ .Values.kvCacheType | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # The device plugin injects permitted nodes; do not shadow them with hostPath.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: Unconfined
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
