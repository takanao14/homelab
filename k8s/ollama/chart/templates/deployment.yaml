apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        homelab/gpu-switchable: "true"
    spec:
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: ollama
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 11434
          resources: {{ toYaml .Values.resources | nindent 12 }}
          env:
            # ollama reads OLLAMA_CONTEXT_LENGTH, NOT OLLAMA_NUM_CTX (the latter
            # is silently ignored, leaving the 4096 default that truncates
            # agent/tool-calling contexts).
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.numCtx | quote }}
            {{- if .Values.flashAttention }}
            # Required for KV-cache quantization to take effect, and generally
            # improves VRAM use / throughput.
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"
            {{- end }}
            {{- if .Values.kvCacheType }}
            # Quantize the KV cache (e.g. q8_0) so large contexts fit in 16 GB
            # VRAM. Needs OLLAMA_FLASH_ATTENTION=true.
            - name: OLLAMA_KV_CACHE_TYPE
              value: {{ .Values.kvCacheType | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
            - name: kfd
              mountPath: /dev/kfd
            - name: dri
              mountPath: /dev/dri
          securityContext:
            seccompProfile:
              type: Unconfined
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: kfd
          hostPath:
            path: /dev/kfd
        - name: dri
          hostPath:
            path: /dev/dri
