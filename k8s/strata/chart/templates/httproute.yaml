apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strata
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
{{- if or .Values.gateway.timeouts.request .Values.gateway.timeouts.backendRequest }}
      timeouts:
{{- with .Values.gateway.timeouts.request }}
        request: {{ . | quote }}
{{- end }}
{{- with .Values.gateway.timeouts.backendRequest }}
        backendRequest: {{ . | quote }}
{{- end }}
{{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: strata
          port: 8080
          weight: 1
