apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
  annotations:
    secret.reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: strata
  template:
    metadata:
      labels:
        app: strata
        homelab/gpu-switchable: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      # Upstream needs up to two minutes to drain and unload the model.
      terminationGracePeriodSeconds: 120
      containers:
        - name: strata
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          env:
            - name: FAMILY
              value: {{ .Values.model.family | quote }}
            - name: MODEL
              value: {{ .Values.model.size | quote }}
            - name: VISION
              value: {{ .Values.model.vision | quote }}
            # The upstream healthcheck reads the key from this variable.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: strata-api
                  key: api-key
          ports:
            - name: http
              containerPort: 8080
          # The first start downloads and packs the model before serving.
          # An interrupted download resumes after a restart.
          startupProbe:
            exec:
              command: ["/opt/strata/healthcheck.sh"]
            periodSeconds: 60
            timeoutSeconds: 8
            failureThreshold: 240
          readinessProbe:
            exec:
              command: ["/opt/strata/healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 8
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
          # Upstream images run as root for GPU device files and page-locked
          # memory (ADR-0080). The device plugin injects the GPU nodes.
          securityContext:
            seccompProfile:
              type: Unconfined
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: strata-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
