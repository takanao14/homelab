apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: strata-api
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: strata-api
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: {{ .Values.apiKeySecret.key }}
        property: {{ .Values.apiKeySecret.property }}
