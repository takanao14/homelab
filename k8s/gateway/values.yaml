# Required environment domain used for the wildcard TLS secret.
domain: ""

gatewayClass:
  name: envoy-gateway
  controllerName: gateway.envoyproxy.io/gatewayclass-controller

envoyProxy:
  name: shared-gateway-envoy
  namespace: gateway-system
  spec:
    provider:
      type: Kubernetes
      kubernetes:
        envoyService:
          # Cluster policy avoids blackholes when Cilium advertises from another node.
          externalTrafficPolicy: Cluster

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  gatewayClassName: envoy-gateway
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: shared-gateway-envoy
  listeners:
    http:
      enabled: true
    https:
      enabled: true
