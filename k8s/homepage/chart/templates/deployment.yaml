apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: {{ .Values.namespace }}
  labels:
    app: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: homepage-sa
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: homepage
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: {{ required "hostname is required" .Values.hostname | quote }}
        envFrom:
        - secretRef:
            name: homepage-secrets
        volumeMounts:
        - name: config
          mountPath: /app/config
      volumes:
      - name: config
        secret:
          secretName: homepage-config
