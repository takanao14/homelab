hostname: vllm.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  # Allow model loading and long generations past Envoy's default.
  timeouts:
    request: 10m
    backendRequest: 10m

toolCalling:
  enabled: true
  # Standard Qwen3 uses Hermes; revisit for other model families.
  parser: hermes
