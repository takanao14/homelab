hostname: vllm.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  # Model loading and long generations can exceed Envoy Gateway's default.
  timeouts:
    request: 10m
    backendRequest: 10m

toolCalling:
  enabled: true
  # Qwen's official vLLM deployment guide specifies the Hermes parser for
  # standard Qwen3 models. Qwen3-Coder uses a different parser.
  parser: hermes
