apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        homelab/gpu-switchable: "true"
    spec:
      # Kubernetes would otherwise inject VLLM_PORT=tcp://<service-ip>:8000
      # from the same-named Service. vLLM reserves VLLM_PORT for a numeric
      # internal communication port and refuses to start when it is a URI.
      enableServiceLinks: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: vllm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - vllm
          args:
            - serve
            - {{ .Values.model.id | quote }}
            - --host=0.0.0.0
            - --port=8000
            - --dtype=auto
            - {{ printf "--max-model-len=%v" .Values.model.maxModelLen | quote }}
            - {{ printf "--gpu-memory-utilization=%v" .Values.model.gpuMemoryUtilization | quote }}
            {{- range .Values.model.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.cache/huggingface
            - name: shared-memory
              mountPath: /dev/shm
          # /dev/kfd and the allocated /dev/dri/{card,renderD}* are injected by
          # the ROCm k8s-device-plugin in response to the amd.com/gpu request;
          # do NOT hostPath-mount them. A hostPath mount of the whole /dev/dri
          # shadows the plugin's device nodes with every card on the host while
          # the device cgroup still only permits the allocated one, so unowned
          # cards become visible-but-EPERM.
          securityContext:
            seccompProfile:
              type: Unconfined
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit }}
