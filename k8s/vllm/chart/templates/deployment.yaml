apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        homelab/gpu-switchable: "true"
    spec:
      # Prevent the Service from injecting a URI into vLLM's numeric VLLM_PORT.
      enableServiceLinks: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: vllm
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - vllm
          args:
            - serve
            - {{ .Values.model.id | quote }}
            - --host=0.0.0.0
            - --port=8000
            - --dtype=auto
            - {{ printf "--max-model-len=%v" .Values.model.maxModelLen | quote }}
            - {{ printf "--gpu-memory-utilization=%v" .Values.model.gpuMemoryUtilization | quote }}
            {{- if .Values.toolCalling.enabled }}
            - --enable-auto-tool-choice
            - {{ printf "--tool-call-parser=%s" (required "toolCalling.parser is required when tool calling is enabled" .Values.toolCalling.parser) | quote }}
            {{- end }}
            {{- range .Values.model.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /root/.cache/huggingface
            - name: shared-memory
              mountPath: /dev/shm
          # The device plugin injects permitted nodes; do not shadow them with hostPath.
          securityContext:
            seccompProfile:
              type: Unconfined
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.sizeLimit }}
