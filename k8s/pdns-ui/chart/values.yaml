hostname: pdns-ui.prd.butaco.net
namespace: pdns-ui

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.31.3-alpine

pdns:
  # The hidden primary holds the complete zone data.
  backend: 192.168.10.233:8081

secret:
  # Reuse the unscoped external-dns key to avoid duplicate rotation points.
  key: k8s/external-dns/pdns
  property: api-key
