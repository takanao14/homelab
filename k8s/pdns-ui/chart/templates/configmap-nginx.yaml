apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-ui-nginx
  namespace: {{ .Values.namespace }}
  labels:
    app: pdns-ui
data:
  # The entrypoint substitutes only PDNS_* into the rendered config.
  default.conf.template: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # The unscoped key stays in-pod; dnscontrol owns writes, so allow reads only.
        location /api/ {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://${PDNS_BACKEND}/api/;
            proxy_set_header X-API-Key "${PDNS_API_KEY}";
            proxy_set_header Host $host;
        }

        location / {
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/ =404;
        }
    }
