# Shared upstream chart values; environment files set hostnames.
ollama:
  enabled: false
ollamaUrls:
  - http://ollama.ollama.svc.cluster.local:11434

pipelines:
  enabled: false

enableOpenaiApi: true
openaiBaseApiUrls:
  - http://lemonade-server.lemonade-server.svc.cluster.local:13305/v1
  - http://vllm.vllm.svc.cluster.local:8000/v1
openaiApiKeys:
  - "dummy"
  - "dummy"

# Keep Git values authoritative and tolerate intentionally stopped GPU backends.
extraEnvVars:
  - name: ENABLE_PERSISTENT_CONFIG
    value: "false"
  - name: AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST
    value: "3"

persistence:
  enabled: true
  size: 2Gi

# Requests only (README): 7-day mean/peak 1644/1937 Mi, p95 CPU 1m.
resources:
  requests:
    cpu: 25m
    memory: 1792Mi

websocket:
  redis:
    # 28/31 Mi, p95 CPU 2.6m.
    resources:
      requests:
        cpu: 10m
        memory: 40Mi

ingress:
  enabled: false

route:
  enabled: true
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: shared-gateway-envoy
      namespace: gateway-system
      sectionName: https
