{{- $app := index .Values.apps "butaco-voice" }}
{{- if $app.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: butaco-voice
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $app.wave | quote }}
spec:
  project: default
  sources:
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.targetRevision }}
      path: k8s/butaco-voice/chart
      helm:
        releaseName: butaco-voice
        valueFiles:
          - $values/k8s/butaco-voice/values.yaml
          - $values/k8s/butaco-voice/{{ include "argocd-apps.env" . }}/values.yaml
    - repoURL: {{ .Values.repo.url }}
      targetRevision: {{ .Values.repo.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: butaco-voice
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
