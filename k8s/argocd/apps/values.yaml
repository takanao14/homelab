# Required environment selecting each app's values file.
env: ""

# Repository coordinates visible to in-cluster Argo CD.
repo:
  url: https://github.com/takanao14/homelab.git
  targetRevision: HEAD

# App enablement, sync waves, and Renovate-visible upstream chart coordinates.
apps:
  argocd:
    enabled: false
    wave: "1"
    upstream:
      repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.4.2
  cert-manager:
    enabled: false
    wave: "0"
    upstream:
      repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.1
  cert-manager-config:
    enabled: false
    wave: "1"
  comfyui:
    enabled: false
    wave: "1"
  envoy-gateway-crds:
    enabled: false
    wave: "-2"
  envoy-gateway:
    enabled: false
    wave: "-1"
  eso:
    enabled: false
    wave: "0"
  external-dns:
    enabled: false
    wave: "1"
  gateway:
    enabled: false
    wave: "0"
  gpu-switch:
    enabled: false
    wave: "1"
  headlamp:
    enabled: false
    wave: "1"
  homepage:
    enabled: false
    wave: "1"
  lemonade-server:
    enabled: false
    wave: "1"
  # Environment files define monitoring's structurally different sources.
  monitoring:
    enabled: false
    wave: "1"
    path: ""
    namespace: ""
    helm: {}
    syncOptions: []
  ollama:
    enabled: false
    wave: "1"
  open-webui:
    enabled: false
    wave: "1"
    upstream:
      repoURL: https://helm.openwebui.com/
      chart: open-webui
      targetRevision: 16.0.0
  pdns-ui:
    enabled: false
    wave: "1"
  reloader:
    enabled: false
    wave: "1"
  vllm:
    enabled: false
    wave: "1"
