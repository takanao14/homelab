env: sandbox

apps:
  argocd:
    enabled: true
  envoy-gateway-crds:
    enabled: true
  envoy-gateway:
    enabled: true
  eso:
    enabled: true
  external-dns:
    enabled: true
  gateway:
    enabled: true
  headlamp:
    enabled: true
  homepage:
    enabled: true
  monitoring:
    enabled: true
    # Shared monitoring subset without external alerts or scrapes.
    path: k8s/monitoring/apps
    namespace: argocd
    helm:
      releaseName: monitoring-apps
      valueFiles:
        - ../values/apps-sandbox.yaml
    syncOptions:
      - ServerSideApply=true
  pdns-ui:
    enabled: true
  reloader:
    enabled: true
