# Minimal defaults; Argo CD also passes shared and environment values.
openbao:
  secretStore:
    name: openbao
    kind: ClusterSecretStore
  adminPassword:
    enabled: false
    key: ""
    passwordProperty: password
    mtimeProperty: mtime

server:
  ingress:
    hostname: ""
  route:
    gatewayName: shared-gateway-envoy
    gatewayNamespace: gateway-system
    sectionName: https
