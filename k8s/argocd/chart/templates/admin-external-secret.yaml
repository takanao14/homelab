{{- if .Values.openbao.adminPassword.enabled }}
{{- $key := required "openbao.adminPassword.key must be set in k8s/argocd/<env>/values.yaml" .Values.openbao.adminPassword.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.openbao.secretStore.name }}
    kind: {{ .Values.openbao.secretStore.kind }}
  target:
    # Merge, not Owner. argocd-secret is created by the upstream argo-cd chart
    # and also carries server.secretkey, which argocd-server generates at
    # runtime and owns; Owner would make ESO the sole author of the Secret and
    # drop that key. Merge requires the Secret to exist already, which the
    # helmfile bootstrap guarantees before root-apps is ever applied.
    #
    # No conflict with Argo CD: the chart emits no `data` block unless
    # configs.secret.argocdServerAdminPassword is set, so under ServerSideApply
    # these keys belong to another field manager and are ignored by the diff.
    name: argocd-secret
    creationPolicy: Merge
  data:
    # Bcrypt hash, not the plaintext password:
    #   htpasswd -nbBC 10 "" 'PASSWORD' | tr -d ':\n' | sed 's/$2y/$2a/'
    - secretKey: admin.password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: {{ .Values.openbao.adminPassword.passwordProperty }}
    # RFC3339, e.g. "2026-07-26T00:00:00Z". Argo CD rejects every session token
    # issued before this timestamp, so bumping it logs out all admin sessions.
    - secretKey: admin.passwordMtime
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: {{ .Values.openbao.adminPassword.mtimeProperty }}
{{- end }}
