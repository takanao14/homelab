{{- if .Values.openbao.adminPassword.enabled }}
{{- $key := required "openbao.adminPassword.key must be set in k8s/argocd/<env>/values.yaml" .Values.openbao.adminPassword.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.openbao.secretStore.name }}
    kind: {{ .Values.openbao.secretStore.kind }}
  target:
    # Merge preserves Argo CD's runtime server.secretkey; bootstrap creates the Secret.
    name: argocd-secret
    creationPolicy: Merge
  data:
    # Bcrypt hash, not plaintext:
    #   htpasswd -nbBC 10 "" 'PASSWORD' | tr -d ':\n' | sed 's/$2y/$2a/'
    - secretKey: admin.password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: {{ .Values.openbao.adminPassword.passwordProperty }}
    # RFC3339 cutoff; advancing it invalidates earlier admin sessions.
    - secretKey: admin.passwordMtime
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: {{ .Values.openbao.adminPassword.mtimeProperty }}
{{- end }}
