external-secrets:
  installCRDs: true

  # Requests only (README), about 1.2x 7-day mean. Controller: 42/45 Mi, p95 1m.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

  webhook:
    # Webhook: 106/135 Mi, p95 0.4m; includes conversion/validation caches.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi

  certController:
    # Cert controller: 79/124 Mi, p95 0.9m.
    resources:
      requests:
        cpu: 10m
        memory: 96Mi

openbao:
  server: "https://openbao.home.butaco.net"
  path: "secret"
  role: "k8s-eso"
  mountPath: "kubernetes"
