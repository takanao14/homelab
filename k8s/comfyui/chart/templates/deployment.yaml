apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
        homelab/gpu-switchable: "true"
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: comfyui
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8188
          startupProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8188
            periodSeconds: 30
            failureThreshold: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/ComfyUI/models
            {{- range list "input" "output" "user" "custom_nodes" }}
            - name: state
              mountPath: /app/ComfyUI/{{ . }}
              subPath: {{ . }}
            {{- end }}
          # The device plugin injects permitted nodes; do not shadow them with hostPath.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: Unconfined
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: comfyui-data
        - name: state
          persistentVolumeClaim:
            claimName: comfyui-state
