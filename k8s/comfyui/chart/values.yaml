replicaCount: 0

image:
  repository: forgejo.home.butaco.net/takanao/comfyui-docker
  # Set by the pull request that comfyui-docker CI opens after each build.
  tag: v0.37.1-b04d982
  pullPolicy: IfNotPresent

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  size: 100Gi
  storageClassName: openebs-hostpath

stateStorage:
  size: 20Gi

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule

hostname: comfyui.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
