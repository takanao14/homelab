apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: butako-voice
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: {{ .Values.gateway.timeout | quote }}
        backendRequest: {{ .Values.gateway.timeout | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: butako-voice
          port: 8080
