apiVersion: v1
kind: Service
metadata:
  name: butako-voice
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: butako-voice
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: voicevox
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: voicevox
  ports:
    - port: 50021
      targetPort: 50021
