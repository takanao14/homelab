apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: butako-search
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: butako-search
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: butako-voice
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: searxng
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: searxng
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: butako-search
      ports:
        - protocol: TCP
          port: 8080
