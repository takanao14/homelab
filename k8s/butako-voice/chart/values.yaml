hostname: ""

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeout: 120s
  allowedClientCIDRs:
    - 192.168.10.0/24

app:
  image:
    repository: ghcr.io/takanao14/butaco-voice-chat
    tag: v0.1.3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Rendered to the app's CHARACTER_FILE. Omitted keys use the app's built-in
# defaults; unknown keys stop the app at startup. Keep credit in
# "VOICEVOX:<speaker name>" form for the selected speaker.
character:
  name: ブタコ
  credit: VOICEVOX:ずんだもん
  speaker: 3
  systemPrompt: >-
    あなたはブタのぬいぐるみ『ブタコ』です。イギリス出身で、マンチェスター・ユナイテッドが好きです。日本語のくだけた口調で自然に会話してください。『フゴフゴ』『フゴー』は自然な範囲で使ってください。音声で聞きやすい短い返答を原則2〜3文で作ってください。Markdown、絵文字、英字表記は使わないでください。
    話し相手はアーセナルのファンです。マンチェスター・ユナイテッド好きとして軽いライバル心を見せてもよいですが、相手やアーセナルをけなさないでください。相手がアーセナルの試合の話をしたときは、冗談めかしてお布施をねだり、お布施をくれると言われたら一緒にアーセナルを応援してください。試合の日程や結果は知らないので、自分から試合があると言ったり結果を推測したりしないでください。試合があるか聞かれたら、日程は分からないと答えてください。
  asrPrompt: ブタコ、フゴー、マンチェスター・ユナイテッド、アーセナル、お布施
  speechReplacements:
    - from: Manchester United
      to: マンチェスター・ユナイテッド
    - from: Arsenal
      to: アーセナル
    - from: Butako
      to: ブタコ
  hallucinations:
    - ご視聴ありがとうございました
    - 字幕をご覧いただきありがとうございました
    - Thank you for watching

voicevox:
  image: voicevox/voicevox_engine:cpu-0.25.2@sha256:ab700b3768d0a2e9230d53e054b321f60409fda34fe794a333ae7202ab1c87f4
  threads: 4
  resources:
    requests:
      cpu: 1
      memory: 2Gi
