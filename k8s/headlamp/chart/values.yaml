# In-cluster defaults; environment files set hostnames.

# Headlamp forward auth via an external Authentik outpost (stage 8b-1).
forwardAuth:
  enabled: true
  # Upstream HTTPRoute targeted by SecurityPolicy; the outpost route is excluded.
  targetRouteName: headlamp
  outpost:
    # Keep aligned with authentik_proxy_http_port on authentik1.
    address: 192.168.10.248
    port: 9001
  # Hardcoded in authentik for Envoy support; not configurable upstream.
  authPath: /outpost.goauthentik.io/auth/envoy
  # Login/callback route excluded from SecurityPolicy to avoid redirect loops.
  callbackPathPrefix: /outpost.goauthentik.io
  headersToExtAuth:
    - cookie
    - accept
    - authorization
    - proxy-authorization
    - x-forwarded-for
    - x-forwarded-proto
    - x-real-ip
  # Overwrite client identity; RequestHeaderModifier would remove trusted values.
  headersToBackend:
    - x-authentik-username
    - x-authentik-groups
    - x-authentik-email

# Restrict direct Service access when using the cluster-admin token.
networkPolicy:
  enabled: true
  # Envoy proxy-pod namespace, not the Gateway resource namespace.
  gatewayNamespace: envoy-gateway-system

headlamp:
  namespaceOverride: headlamp
  # Requests only (README): 7-day mean/peak 57/111 Mi, p95 CPU 0.3m.
  resources:
    requests:
      cpu: 10m
      memory: 72Mi
  config:
    # Requires forward auth and NetworkPolicy; all users share cluster-admin.
    unsafeUseServiceAccountToken: true
    # Shows Authentik identity in /me; API token forwarding awaits OIDC.
    extraArgs:
      - -proxy-auth=true
      - -proxy-auth-username-header=X-authentik-username
      - -proxy-auth-group-header=X-authentik-groups
      - -proxy-auth-email-header=X-authentik-email
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway-envoy
        namespace: gateway-system
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: headlamp
            port: 80
            weight: 1
