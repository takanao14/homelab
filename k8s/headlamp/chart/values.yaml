# In-cluster defaults; environment files set hostnames.

# Shared read-only permissions for users admitted by Authelia.
readOnly:
  # Wildcard reads per group; exclude groups that embed secret material
  # (core, helm.k0sproject.io values, vault.banzaicloud.com).
  extraApiGroups:
    - apiextensions.k8s.io
    - argoproj.io
    - cert-manager.io
    - cilium.io
    - gateway.envoyproxy.io
    - gateway.networking.k8s.io
    - monitoring.coreos.com
    - monitoring.grafana.com
    - networking.k8s.io
    - node.k8s.io
    - rbac.authorization.k8s.io
    - scheduling.k8s.io
    - snapshot.storage.k8s.io
    - storage.k8s.io

headlamp:
  namespaceOverride: headlamp
  # Requests only (README): 7-day mean/peak 57/111 Mi, p95 CPU 0.3m.
  resources:
    requests:
      cpu: 10m
      memory: 72Mi
  # Pinned so templates/read-only-rbac.yaml can bind it.
  serviceAccount:
    name: headlamp
  # Upstream binds cluster-admin; roleRef is immutable, so read-only uses new names.
  clusterRoleBinding:
    create: false
  config:
    # Authelia gates access; Kubernetes requests share this read-only identity.
    unsafeUseServiceAccountToken: true
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway-envoy
        namespace: gateway-system
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: headlamp
            port: 80
            weight: 1

# Authelia on idp1; keep the port aligned with authelia_http_port.
forwardAuth:
  address: 192.168.10.248
  port: 9091
  authPath: /api/authz/ext-authz/
  headersToExtAuth:
    - cookie
    - accept
    - authorization
    - proxy-authorization
    - x-forwarded-for
    - x-forwarded-proto
  headersToBackend:
    - remote-user
    - remote-groups
    - remote-email
    - remote-name

networkPolicy:
  enabled: true
  # Envoy proxy-pod namespace, not the Gateway resource namespace.
  gatewayNamespace: envoy-gateway-system
