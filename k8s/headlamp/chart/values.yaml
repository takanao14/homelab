# In-cluster defaults; environment files set hostnames.

# Headlamp forward auth (stage 8b-1); Envoy delegates authorization to the
# external Authentik outpost without proxying application traffic through it.
forwardAuth:
  enabled: true
  # Upstream HTTPRoute targeted by SecurityPolicy; the outpost route is excluded.
  targetRouteName: headlamp
  outpost:
    # External Backend on authentik1; keep the port aligned with
    # authentik_proxy_http_port. Port 9100 is reserved for node_exporter.
    address: 192.168.10.248
    port: 9001
  # Hardcoded in authentik for Envoy support; not configurable upstream.
  authPath: /outpost.goauthentik.io/auth/envoy
  # Login/callback route excluded from SecurityPolicy to avoid redirect loops.
  callbackPathPrefix: /outpost.goauthentik.io
  headersToExtAuth:
    - cookie
    - accept
    - authorization
    - proxy-authorization
    - x-forwarded-for
    - x-forwarded-proto
    - x-real-ip
  # Envoy overwrites client-supplied identity headers with trusted outpost values.
  # Do not remove them via RequestHeaderModifier; it runs after ext_authz.
  headersToBackend:
    - x-authentik-username
    - x-authentik-groups
    - x-authentik-email

# Closes the path around forward auth. Required rather than optional once
# unsafeUseServiceAccountToken is on: without it any pod that can reach the
# Headlamp Service gets a cluster-admin session with no authentication.
networkPolicy:
  enabled: true
  # Where Envoy Gateway runs its proxy pods, which is its own install namespace
  # rather than the Gateway's namespace.
  gatewayNamespace: envoy-gateway-system

headlamp:
  namespaceOverride: headlamp
  # Requests only (README): 7-day mean/peak 57/111 Mi, p95 CPU 0.3m.
  resources:
    requests:
      cpu: 10m
      memory: 72Mi
  config:
    # What actually removes the token prompt: Headlamp talks to the API server
    # with its own ServiceAccount for everyone. Upstream calls it unsafe because
    # on its own it hands cluster-admin to anyone who can reach the Service —
    # it is only acceptable behind the forward auth above, which is why the two
    # must be enabled and disabled together. Admission is therefore
    # all-or-nothing and the audit log sees one identity (decision 20).
    unsafeUseServiceAccountToken: true
    # -proxy-auth does NOT bypass the login screen; in v0.44.0 it only feeds
    # /clusters/{name}/me so the top bar shows who Authentik authenticated, and
    # gates -proxy-auth-token-header (unused here — forwarding a token to the
    # API server needs the OIDC work deferred by decision 19).
    extraArgs:
      - -proxy-auth=true
      - -proxy-auth-username-header=X-authentik-username
      - -proxy-auth-group-header=X-authentik-groups
      - -proxy-auth-email-header=X-authentik-email
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway-envoy
        namespace: gateway-system
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: headlamp
            port: 80
            weight: 1
