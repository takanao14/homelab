# In-cluster defaults; environment files set hostnames.
headlamp:
  namespaceOverride: headlamp
  # Requests only (README): 7-day mean/peak 57/111 Mi, p95 CPU 0.3m.
  resources:
    requests:
      cpu: 10m
      memory: 72Mi
  httpRoute:
    enabled: true
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: shared-gateway-envoy
        namespace: gateway-system
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - group: ""
            kind: Service
            name: headlamp
            port: 80
            weight: 1
