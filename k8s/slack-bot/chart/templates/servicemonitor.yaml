apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slack-bot
  namespace: {{ .Release.Namespace }}
  labels:
    # Prometheus only selects monitors carrying this label.
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: slack-bot
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
