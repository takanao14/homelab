{{- $domain := required "domain is required" .Values.domain -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-{{ $domain | replace "." "-" }}
  namespace: cert-manager
spec:
  secretName: wildcard-{{ $domain | replace "." "-" }}-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.{{ $domain }}"
