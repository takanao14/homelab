# Shared controller values; issuer and certificate config lives one level up.
crds:
  enabled: true

extraArgs:
  - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
  - --dns01-recursive-nameservers-only

# Requests are about 1.2x the 7-day mean. Controller: 70/96 Mi, p95 1.2m.
resources:
  requests:
    cpu: 25m
    memory: 96Mi

webhook:
  # Webhook: 62/65 Mi, p95 0.4m.
  resources:
    requests:
      cpu: 10m
      memory: 80Mi

cainjector:
  # CA injector: 77/138 Mi, p95 2.4m; memory tracks watched CRDs.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    # Must match the Prometheus serviceMonitorSelector (release: prometheus).
    labels:
      release: prometheus
