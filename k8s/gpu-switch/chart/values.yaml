image:
  repository: ghcr.io/takanao14/homelab/gpu-switch
  tag: 0.1.0
  pullPolicy: IfNotPresent

hostname: ""

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https

# RBAC cannot label-scope scale writes; keep this allowlist aligned (ADR-0027).
gpuWorkloads:
  - namespace: comfyui
    name: comfyui
  - namespace: lemonade-server
    name: lemonade-server
  - namespace: ollama
    name: ollama
  - namespace: vllm
    name: vllm

securityPolicy:
  # Legacy name kept deliberately: renaming would leave two policies targeting
  # one route during sync.
  name: gpu-switch-basic-auth

# Authelia forward auth on idp1 (ADR-0067); the only gate for this app.
forwardAuth:
  # Keep aligned with authelia_http_port on idp1.
  address: 192.168.10.248
  port: 9091
  # Envoy appends the original path, which Authelia reads after this prefix.
  authPath: /api/authz/ext-authz/
  headersToExtAuth:
    - cookie
    - accept
    - authorization
    - proxy-authorization
    - x-forwarded-for
    - x-forwarded-proto
  # The app ignores these; forwarded so a future access log can name the user.
  headersToBackend:
    - remote-user
    - remote-groups
    - remote-email
    - remote-name

# Prevent direct Service access from bypassing SecurityPolicy (ADR-0027).
networkPolicy:
  enabled: true
  # Envoy proxy-pod namespace, not the Gateway resource namespace.
  gatewayNamespace: envoy-gateway-system

resources: {}
