{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Prevent direct access from bypassing SecurityPolicy; allow only Gateway pods.
# Cilium exempts kubelet probes while host firewall is disabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-switch
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gpu-switch
      app.kubernetes.io/instance: {{ .Release.Name }}
  # Ingress only: the app still needs egress to the API server and DNS.
  policyTypes:
    - Ingress
  ingress:
    # Namespace and pod selectors are ANDed.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.gatewayNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              gateway.envoyproxy.io/owning-gateway-name: {{ .Values.gateway.name }}
              gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.gateway.namespace }}
      ports:
        # Named port follows upstream changes.
        - protocol: TCP
          port: http
{{- end }}
