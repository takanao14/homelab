apiVersion: v1
kind: Service
metadata:
  name: gpu-switch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: gpu-switch
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-switch
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
