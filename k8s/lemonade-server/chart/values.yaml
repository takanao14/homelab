replicaCount: 0

image:
  repository: ghcr.io/lemonade-sdk/lemonade-server
  tag: v11.9.0

config:
  rocm_channel: nightly
  llamacpp:
    # lemonade-sdk/llamacpp-rocm release tag; update deliberately after validation.
    rocm_bin: b1319

recipeOptions: {}

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  storageClassName: openebs-hostpath
  huggingface:
    size: 90Gi
  recipe:
    size: 5Gi

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule

hostname: lemonade.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeouts:
    request: null
    backendRequest: null
