replicaCount: 0

# Upstream image. lemonade's built-in "rocm" backend mis-detects gfx1200 (RX
# 9060 XT) as unsupported, but the "vulkan" backend has no such GPU-family
# gate and works out of the box on this GPU via the RADV Mesa driver already
# on the host — see README.md. Set by the set-llamacpp-backend initContainer.
image:
  repository: ghcr.io/lemonade-sdk/lemonade-server
  tag: v10.8.0

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  storageClassName: openebs-hostpath
  huggingface:
    size: 90Gi
  llama:
    size: 5Gi
  recipe:
    size: 5Gi

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule

hostname: lemonade.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeouts:
    request: null
    backendRequest: null

# Second, ROCm-backend Deployment used for MXFP4 serving and benchmarking
# against the vulkan backend above. Scaled to 0 by default; gpu-switch.sh
# discovers it via homelab/gpu-switchable like any other GPU workload. Shares
# the huggingface/llama/recipe PVCs with the vulkan Deployment — safe because
# gpu-switch guarantees only one of the two ever runs at a time.
rocm:
  replicaCount: 0
  hostname: lemonade-rocm.prd.butaco.net
  image:
    repository: forgejo.home.butaco.net/takanao/lemonade-docker
    tag: b1302
