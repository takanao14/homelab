replicaCount: 0

# Vulkan bypasses lemonade's gfx1200 ROCm detection bug (README).
image:
  repository: ghcr.io/lemonade-sdk/lemonade-server
  tag: v10.8.0

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  storageClassName: openebs-hostpath
  huggingface:
    size: 90Gi
  llama:
    size: 5Gi
  recipe:
    size: 5Gi

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule

hostname: lemonade.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeouts:
    request: null
    backendRequest: null

# ROCm serving/benchmark variant; safe shared PVCs rely on GPU-switch exclusion.
rocm:
  replicaCount: 0
  hostname: lemonade-rocm.prd.butaco.net
  image:
    repository: forgejo.home.butaco.net/takanao/lemonade-docker
    # llamacpp-rocm build number; b1319 bundles ROCm 10.1.0a20260822 (b1302 was
    # 7.15). Bump only after the lemonade-docker CI has pushed the tag.
    tag: b1319
