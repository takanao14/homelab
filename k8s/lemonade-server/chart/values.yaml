replicaCount: 0

# Custom image (base lemonade-server:v10.8.0 + ROCm-enabled llama.cpp) so the
# gfx1200 (RX 9060 XT) GPU works via the "system" llamacpp backend. lemonade's
# built-in "rocm" backend mis-detects gfx1200 as unsupported; see README.md and
# forgejo.home.butaco.net/takanao/lemonade-docker. The tag tracks the bundled
# llamacpp-rocm build number.
image:
  repository: forgejo.home.butaco.net/takanao/lemonade-docker
  tag: b1302

resources:
  limits:
    amd.com/gpu: "1"
  requests:
    amd.com/gpu: "1"

storage:
  storageClassName: openebs-hostpath
  huggingface:
    size: 90Gi
  llama:
    size: 5Gi
  recipe:
    size: 5Gi

nodeSelector:
  gpu: amd

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule

hostname: lemonade.prd.butaco.net

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
  timeouts:
    request: null
    backendRequest: null
