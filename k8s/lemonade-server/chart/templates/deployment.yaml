apiVersion: apps/v1
kind: Deployment
metadata:
  name: lemonade-server
  namespace: {{ .Release.Namespace }}
  labels:
    homelab/gpu-switchable: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lemonade-server
  template:
    metadata:
      labels:
        app: lemonade-server
        homelab/gpu-switchable: "true"
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      initContainers:
        # Seed writable sparse overrides; the chart remains the source of truth.
        - name: initialize-config
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /defaults/config.json /config/config.json
              cp /defaults/recipe_options.json /config/recipe_options.json
          volumeMounts:
            - name: config-defaults
              mountPath: /defaults
              readOnly: true
            - name: config
              mountPath: /config
      containers:
        - name: lemonade-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          command:
            - /opt/lemonade/lemond
          args:
            - --host
            - 0.0.0.0
          env:
            # Lemonade allows only loopback browser origins by default, so the
            # built-in web UI served over the Gateway hostname gets 403 on
            # mutating endpoints such as /api/v1/pull.
            - name: LEMONADE_ALLOWED_ORIGINS
              value: {{ printf "https://%s" .Values.hostname | quote }}
          ports:
            - containerPort: 13305
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: huggingface
              mountPath: /opt/lemonade/.cache/huggingface
            - name: recipe
              mountPath: /opt/lemonade/.cache/lemonade
            - name: config
              mountPath: /opt/lemonade/.config/lemonade
          # The device plugin injects permitted nodes; do not shadow them with hostPath.
          securityContext:
            seccompProfile:
              type: Unconfined
      volumes:
        - name: config-defaults
          configMap:
            name: lemonade-server-config
        - name: config
          emptyDir: {}
        - name: huggingface
          persistentVolumeClaim:
            claimName: lemonade-huggingface
        - name: recipe
          persistentVolumeClaim:
            claimName: lemonade-recipe
