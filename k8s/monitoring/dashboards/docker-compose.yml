services:
  grafana:
    image: grafana/grafana:13.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - LOKI_URL=${LOKI_URL}
    volumes:
      # :z relabels the mount for SELinux (enforcing by default on Rocky).
      # Docker and non-SELinux hosts parse and ignore it.
      - ./provisioning:/etc/grafana/provisioning:z
      - ../charts/dashboards/dashboards:/var/lib/grafana/dashboards:z
