services:
  grafana:
    image: mirror.gcr.io/grafana/grafana:13.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - LOKI_URL=${LOKI_URL}
    volumes:
      # :z relabels Rocky SELinux mounts and is harmless elsewhere.
      - ./provisioning:/etc/grafana/provisioning:z
      - ../charts/dashboards/dashboards:/var/lib/grafana/dashboards:z
