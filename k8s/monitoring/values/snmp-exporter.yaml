interfaceAlerts:
  enabled: true

prometheus-snmp-exporter:
  podAnnotations:
    reloader.stakater.com/auto: "true"

  # Requests only (README): 35/50 Mi, p95 CPU 0.6m.
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
  extraArgs:
    - --config.file=/etc/snmp_exporter/snmp.yml
    - --config.file=/etc/snmp-exporter-auth/snmp-auth.yaml

  extraSecretMounts:
    - name: snmp-exporter-auth
      mountPath: /etc/snmp-exporter-auth
      secretName: snmp-exporter-auth
      readOnly: true

  extraManifests:
    - |
      apiVersion: monitoring.coreos.com/v1
      kind: Probe
      metadata:
        name: snmp-network-devices
        namespace: monitoring
        labels:
          release: prometheus
      spec:
        # Keep external LAN devices outside the prd cluster label.
        scrapeClass: external
        interval: 60s
        module: if_mib
        prober:
          url: snmp-exporter-prometheus-snmp-exporter:9116
          path: /snmp
        targets:
          staticConfig:
            relabelingConfigs:
              - action: replace
                targetLabel: __param_auth
                replacement: homelab_v2
              # Map IPs to names; explicit action prevents SSA default drift.
              - action: replace
                sourceLabels: [__param_target]
                regex: "192.168.10.1"
                targetLabel: instance
                replacement: bgw1
              - action: replace
                sourceLabels: [__param_target]
                regex: "192.168.10.2"
                targetLabel: instance
                replacement: c1200
            static:
              - "192.168.10.1"
              - "192.168.10.2"
