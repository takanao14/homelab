victoria-metrics-single:
  server:
    fullnameOverride: victoria-metrics
    # A bare number means months; keep the unit.
    retentionPeriod: 180d
    # Prometheus forwards repeated samples for exporters with explicit
    # timestamps (cAdvisor) that its own TSDB drops. 1ms removes only
    # same-timestamp duplicates and keeps every distinct sample.
    extraArgs:
      dedup.minScrapeInterval: 1ms
    persistentVolume:
      enabled: true
      storageClassName: openebs-hostpath
      # Not enforced by hostpath; sized for retention plus one monthly partition.
      size: 100Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    # Keep the long-term copy off the Prometheus node so recent data survives
    # the loss of either worker.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  operator.prometheus.io/name: prometheus-kube-prometheus-prometheus
    serviceMonitor:
      enabled: true
      extraLabels:
        release: prometheus
