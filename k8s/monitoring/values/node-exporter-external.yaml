port: 9100
metricsPath: /metrics

# Proxmox hypervisors are injected from the shared inventory
# (values/proxmox-nodes.yaml via apps/values.yaml valueFiles); list only
# non-hypervisor hosts here.
# name becomes the instance label (relabeled from __tmp_name); scraping still
# connects by IP so monitoring does not depend on DNS resolution.
# service has two jobs, so give every target one:
#   1. the PrometheusRules use it to assert that a host must be producing a
#      particular textfile metric (see charts/*/templates/*-rules.yaml);
#   2. kube-prometheus-stack's TargetDown aggregates by it —
#      count by (cluster, job, namespace, service) (up == 0) / count(...) > 10.
#      Every unlabelled target lands in one bucket, and a single host failing
#      out of ten is exactly 10%, which does not clear the threshold. One
#      service per host keeps that ratio at 100%.
targets:
  - ip: "192.168.10.240"
    name: "rpi3"
    service: "rpi"
  - ip: "192.168.10.241"
    name: "rpi4"
    service: "rpi"
  # Stateful service guests (in-guest filesystem usage is not exposed by Proxmox OTLP).
  - ip: "192.168.10.245"
    name: "forgejo1"
    service: "forgejo"
  - ip: "192.168.10.247"
    name: "netbox1"
    service: "netbox"
  - ip: "192.168.40.30"
    name: "openbao1"
    service: "openbao"
  - ip: "192.168.50.31"
    name: "seaweedfs1"
    service: "seaweedfs"
  - ip: "192.168.10.248"
    name: "authentik1"
    service: "authentik"
  # Scraped to check the 16 GiB sizing against measurements (ADR-0031).
  - ip: "192.168.20.21"
    name: "toolbox1"
    service: "toolbox"
  # Authoritative DNS. Scraped for the same reason as the guests above — the
  # zone database is a SQLite file on disk — and for the zone serials the
  # pdns_auth role exports through the textfile collector.
  - ip: "192.168.10.233"
    name: "ns1"
    service: "pdns-auth"
  - ip: "192.168.10.234"
    name: "ns2"
    service: "pdns-auth"
  - ip: "192.168.10.235"
    name: "ns3"
    service: "pdns-auth"
  # Dedicated recursive DNS backends (ADR-0030).
  - ip: "192.168.10.236"
    name: "resolver1"
    service: "knot-resolver"
  - ip: "192.168.10.237"
    name: "resolver2"
    service: "knot-resolver"

resolverAlerts:
  enabled: true
  targetDownFor: 5m
  metricsStaleFor: 5m
  metricsMaxAgeSeconds: 180
  # Was 15m (chart default). Measured 2026-08-11: the cache hit rate dipped in
  # and out of the 60% line, repeatedly resetting the 15m "for" timer, so
  # KnotResolverServfailHigh (5m for) fired ~13 minutes before this leading
  # indicator did — the opposite of its intent. Match it to the outcome
  # alert's window so it fires at least as fast.
  cacheHitRateFor: 5m

filesystemAlerts:
  enabled: true

textfileAlerts:
  enabled: true

zoneSerialAlerts:
  enabled: true
