port: 9100
metricsPath: /metrics

# Shared inventory injects Proxmox nodes; list other IP-based targets here.
# `service` isolates TargetDown aggregation and textfile expectations per host.
# Required `kind` lets dashboards exclude LXC guests from host-kernel panels.
targets:
  - ip: "192.168.10.240"
    name: "rpi3"
    service: "rpi"
    kind: "metal"
  - ip: "192.168.10.241"
    name: "rpi4"
    service: "rpi"
    kind: "metal"
  # Stateful guests expose filesystems unavailable through Proxmox OTLP.
  - ip: "192.168.10.245"
    name: "forgejo1"
    service: "forgejo"
    kind: "lxc"
  - ip: "192.168.10.247"
    name: "netbox1"
    service: "netbox"
    kind: "lxc"
  - ip: "192.168.40.30"
    name: "openbao1"
    service: "openbao"
    kind: "vm"
  - ip: "192.168.50.31"
    name: "seaweedfs1"
    service: "seaweedfs"
    kind: "lxc"
  - ip: "192.168.10.248"
    name: "authentik1"
    service: "authentik"
    kind: "vm"
  # Validate 16 GiB sizing (ADR-0031).
  - ip: "192.168.20.21"
    name: "toolbox1"
    service: "toolbox"
    kind: "vm"
  # Authoritative DNS filesystems and textfile-exported zone serials.
  - ip: "192.168.10.233"
    name: "ns1"
    service: "pdns-auth"
    kind: "lxc"
  - ip: "192.168.10.234"
    name: "ns2"
    service: "pdns-auth"
    kind: "lxc"
  - ip: "192.168.10.235"
    name: "ns3"
    service: "pdns-auth"
    kind: "lxc"
  # Recursive DNS backends.
  - ip: "192.168.10.236"
    name: "resolver1"
    service: "knot-resolver"
    kind: "lxc"
  - ip: "192.168.10.237"
    name: "resolver2"
    service: "knot-resolver"
    kind: "lxc"
  # Forgejo CI runner, include container images.
  - ip: "192.168.10.246"
    name: "runner1"
    service: "forgejo-runner"
    kind: "vm"
  # Vector log colletor.
  - ip: "192.168.10.243"
    name: "log1"
    service: "log-collector"
    kind: "lxc"
  # Reverse Proxy.
  - ip: "192.168.10.244"
    name: "caddy1"
    service: "caddy"
    kind: "lxc"
  # DNS routers.
  - ip: "192.168.10.231"
    name: "dist1"
    service: "dnsdist"
    kind: "lxc"
  - ip: "192.168.10.232"
    name: "dist2"
    service: "dnsdist"
    kind: "lxc"

resolverAlerts:
  enabled: true
  targetDownFor: 5m
  metricsStaleFor: 5m
  metricsMaxAgeSeconds: 180
  # Match the 5m SERVFAIL alert; a measured 15m window lagged it by ~13m.
  cacheHitRateFor: 5m
  # At this resolver's baseline of ~2-3 qps, a routine ~2min burst of
  # uncached queries pins the 10m-windowed hit rate near 0.52-0.55 for
  # ~9min (the burst outlives the 10m rate window), tripping the 0.6
  # default several times a week with no actual resolver degradation.
  # 0.45 stays below that observed noise floor while still catching the
  # documented real-incident range (fault measured 36-43%, see the rule's
  # top-of-file comment) with margin.
  cacheHitRateMin: 0.45

filesystemAlerts:
  enabled: true

textfileAlerts:
  enabled: true

zoneSerialAlerts:
  enabled: true
