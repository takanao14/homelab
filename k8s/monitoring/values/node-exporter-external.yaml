port: 9100
metricsPath: /metrics

# Shared inventory injects Proxmox nodes; list other IP-based targets here.
# `service` isolates TargetDown aggregation and textfile expectations per host.
# Required `kind` lets dashboards exclude LXC guests from host-kernel panels.
targets:
  - ip: "192.168.10.240"
    name: "rpi3"
    service: "rpi"
    kind: "metal"
  - ip: "192.168.10.241"
    name: "rpi4"
    service: "rpi"
    kind: "metal"
  # Stateful guests expose filesystems unavailable through Proxmox OTLP.
  - ip: "192.168.10.245"
    name: "forgejo1"
    service: "forgejo"
    kind: "lxc"
  - ip: "192.168.10.247"
    name: "netbox1"
    service: "netbox"
    kind: "lxc"
  - ip: "192.168.40.30"
    name: "openbao1"
    service: "openbao"
    kind: "vm"
  - ip: "192.168.50.31"
    name: "seaweedfs1"
    service: "seaweedfs"
    kind: "lxc"
  - ip: "192.168.10.248"
    name: "authentik1"
    service: "authentik"
    kind: "vm"
  # Validate 16 GiB sizing (ADR-0031).
  - ip: "192.168.20.21"
    name: "toolbox1"
    service: "toolbox"
    kind: "vm"
  # Authoritative DNS filesystems and textfile-exported zone serials.
  - ip: "192.168.10.233"
    name: "ns1"
    service: "pdns-auth"
    kind: "lxc"
  - ip: "192.168.10.234"
    name: "ns2"
    service: "pdns-auth"
    kind: "lxc"
  - ip: "192.168.10.235"
    name: "ns3"
    service: "pdns-auth"
    kind: "lxc"
  # Dedicated recursive DNS backends (ADR-0030).
  - ip: "192.168.10.236"
    name: "resolver1"
    service: "knot-resolver"
    kind: "lxc"
  - ip: "192.168.10.237"
    name: "resolver2"
    service: "knot-resolver"
    kind: "lxc"

resolverAlerts:
  enabled: true
  targetDownFor: 5m
  metricsStaleFor: 5m
  metricsMaxAgeSeconds: 180
  # Match the 5m SERVFAIL alert; a measured 15m window lagged it by ~13m.
  cacheHitRateFor: 5m

filesystemAlerts:
  enabled: true

textfileAlerts:
  enabled: true

zoneSerialAlerts:
  enabled: true
