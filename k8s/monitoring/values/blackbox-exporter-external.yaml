# External blackbox_exporter on rpi4.
blackboxExporterURL: "192.168.10.241:9115"
scrapeInterval: 60s

# Non-hypervisor ICMP targets; shared inventory injects Proxmox/AMT targets.
icmp:
  targets:
    - ip: "192.168.10.1"
      name: "bgw1"
    - ip: "192.168.10.2"
      name: "c1200"
    - ip: "192.168.10.240"
      name: "rpi3"
    - ip: "192.168.10.241"
      name: "rpi4"
    - ip: "192.168.10.254"
      name: "wifi-ap1"

# DNS modules probe the shared frontend inventory.

dnsProbeAlerts:
  enabled: true

icmpProbeAlerts:
  enabled: true
