# External blackbox_exporter on rpi4.
blackboxExporterURL: "192.168.10.241:9115"
scrapeInterval: 60s

# Non-hypervisor ICMP targets; shared inventory injects Proxmox/AMT targets.
icmp:
  targets:
    - ip: "192.168.10.1"
      name: "bgw1"
    - ip: "192.168.10.2"
      name: "c1200"
    - ip: "192.168.10.240"
      name: "rpi3"
    - ip: "192.168.10.241"
      name: "rpi4"
    - ip: "192.168.10.254"
      name: "wifi-ap1"

# Service ports whose failure is invisible to ICMP.
tcp:
  targets:
    - address: "192.168.10.240:50051"
      name: "led-rpi3"

# DNS modules probe the shared frontend inventory.

authoritativeDns:
  exporters:
    - name: resolver1
      address: "192.168.10.236:9115"
    - name: resolver2
      address: "192.168.10.237:9115"
  targets:
    - name: a-root
      address: "198.41.0.4:53"
    - name: i-root
      address: "192.36.148.17:53"
    - name: m-root
      address: "202.12.27.33:53"

dnsProbeAlerts:
  enabled: true

authoritativeDnsProbeAlerts:
  enabled: true

tcpProbeAlerts:
  enabled: true

icmpProbeAlerts:
  enabled: true
