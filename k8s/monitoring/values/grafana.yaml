grafana:
  podAnnotations:
    reloader.stakater.com/auto: "true"
  grafana.ini:
    server:
      root_url: https://grafana.prd.butaco.net/
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Requests only (README): 7-day mean/peak 385/774 Mi, p95 CPU 8.3m.
  resources:
    requests:
      cpu: 50m
      memory: 448Mi
  sidecar:
    # Dashboard sidecar: 103/104 Mi, p95 CPU 1.3m.
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-kube-prometheus-prometheus:9090
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki:3100
          access: proxy
  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  initChownData:
    enabled: false
  service:
    type: ClusterIP
  defaultDashboardsEnabled: false

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
