kube-prometheus-stack:
  alertmanager:
    alertmanagerSpec:
      alertmanagerConfigSelector:
        matchLabels:
          release: prometheus
      alertmanagerConfigMatcherStrategy:
        type: None
      # Requests only: 30-day p95/max 49/88 Mi; CPU p95/max 0.4/0.6m (2026-09-06).
      resources:
        requests:
          cpu: 5m
          memory: 200Mi
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers:
            - severity = critical
          target_matchers:
            - severity =~ warning|info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - severity = warning
          target_matchers:
            - severity = info
          equal:
            - namespace
            - alertname
        - source_matchers:
            - alertname = InfoInhibitor
          target_matchers:
            - severity = info
          equal:
            - namespace
        - target_matchers:
            - alertname = InfoInhibitor
      route:
        receiver: "null"
        group_by:
          - alertname
          - cluster
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          - receiver: "null"
            matchers:
              - alertname = "InfoInhibitor"
      receivers:
        - name: "null"
      templates:
        - /etc/alertmanager/config/*.tmpl

  prometheus:
    prometheusSpec:
      externalUrl: https://prometheus.prd.butaco.net/
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelector:
        matchLabels:
          release: prometheus
      serviceMonitorNamespaceSelector: {}
      ruleSelectorNilUsesHelmValues: false
      ruleSelector:
        matchLabels:
          release: prometheus
      ruleSelectorNamespaceSelector: {}
      scrapeConfigSelectorNilUsesHelmValues: false
      scrapeConfigSelector:
        matchLabels:
          release: prometheus
      scrapeConfigNamespaceSelector: {}
      enableRemoteWriteReceiver: true
      externalLabels:
        cluster: prd
      # Target relabeling stamps synthetic series too; external/per-cluster
      # targets opt out to avoid incorrect dashboard and alert joins.
      scrapeClasses:
        - name: cluster-prd
          default: true
          relabelings:
            - action: replace
              targetLabel: cluster
              replacement: prd
        - name: external
      remoteWrite:
        - url: http://victoria-metrics.monitoring.svc:8428/api/v1/write
          # remote_write applies externalLabels to every series. Strip cluster
          # again from the targets ADR-0016 keeps cluster-less (external
          # ScrapeConfigs/Probes and Alloy's proxmox-ve), except
          # control-plane-node-exporter, which sets its own.
          writeRelabelConfigs:
            - action: replace
              sourceLabels: [job]
              regex: (scrapeConfig|probe)/.+|proxmox-ve
              targetLabel: __tmp_external
              replacement: "true"
            - action: replace
              sourceLabels: [job]
              regex: scrapeConfig/monitoring/control-plane-node-exporter
              targetLabel: __tmp_external
              replacement: ""
            - action: replace
              sourceLabels: [__tmp_external]
              regex: "true"
              targetLabel: cluster
              replacement: ""
            - action: labeldrop
              regex: __tmp_external
      retention: 30d
      retentionSize: 40GB
      # Requests only: 30-day mean/p95/max 994/1108/1143 Mi;
      # CPU mean/p95/max 75/79/107m (2026-08-15).
      resources:
        requests:
          cpu: 100m
          memory: 1536Mi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
    service:
      type: ClusterIP

  grafana:
    enabled: false

  kubelet:
    serviceMonitor:
      # Overrides must repeat metrics_path relabeling for all kubelet endpoints.
      relabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      cAdvisorRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
      probesRelabelings:
        - action: replace
          sourceLabels: [__metrics_path__]
          targetLabel: metrics_path

  # Requests only (README). Operator: 48/85 Mi, p95 CPU 2.6m.
  prometheusOperator:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi

  # kube-state-metrics: 55/77 Mi, p95 CPU 1.8m.
  kube-state-metrics:
    resources:
      requests:
        cpu: 25m
        memory: 80Mi

  nodeExporter:
    enabled: true

  # v84+ configures the ServiceMonitor through the node-exporter subchart.
  prometheus-node-exporter:
    # Per-node DaemonSet: 19/32 Mi, p95 CPU 1.5m.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
    prometheus:
      monitor:
        relabelings:
          - action: replace
            sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node

  # The kubelet-less k0s controller needs direct secure endpoint scraping.
  kubeControllerManager:
    enabled: true
    endpoints:
      - 192.168.60.11
    service:
      enabled: true
      port: 10257
      targetPort: 10257
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  kubeScheduler:
    enabled: true
    endpoints:
      - 192.168.60.11
    service:
      enabled: true
      port: 10259
      targetPort: 10259
    serviceMonitor:
      https: true
      insecureSkipVerify: true
  # Cilium replaces kube-proxy cluster-wide.
  kubeProxy:
    enabled: false

gateway:
  name: shared-gateway-envoy
  namespace: gateway-system
  sectionName: https
