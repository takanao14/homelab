{{- $hostname := .Values.hostname -}}
{{- $grafanaIni := index .Values.grafana "grafana.ini" | default dict -}}
{{- $server := index $grafanaIni "server" | default dict -}}
{{- $rootURL := index $server "root_url" | default "" -}}
{{- if $rootURL -}}
{{- $hostname = (urlParse $rootURL).host -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 80
          weight: 1
