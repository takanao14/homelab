apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v0/web/graph
{{- if or .Values.gateway.graphTimeouts.request .Values.gateway.graphTimeouts.backendRequest }}
      timeouts:
{{- with .Values.gateway.graphTimeouts.request }}
        request: {{ . | quote }}
{{- end }}
{{- with .Values.gateway.graphTimeouts.backendRequest }}
        backendRequest: {{ . | quote }}
{{- end }}
{{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: alloy
          port: 12345
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: alloy
          port: 12345
          weight: 1
