port: 9100
metricsPath: /metrics

proxmoxNodes: []
targets: []

resolverAlerts:
  enabled: false
  targetDownFor: 5m
  metricsStaleFor: 5m
  # 4x the 15s collector interval (knot_resolver_metrics_interval). A healthy
  # file is never older than one interval plus the timer's 1s jitter, so this
  # clears normal variation while still catching a dead collector inside a
  # minute. It was 180 against the former 1min interval; leaving it there would
  # have made it 12x and correspondingly slow to notice.
  metricsMaxAgeSeconds: 60
  # Healthy is 90-99%. 60% is comfortably below normal variation and well above
  # the 36-43% seen while the cache was being dropped and refilled.
  cacheHitRateMin: 0.6
  cacheHitRateFor: 15m
  servfailRatioMax: 0.3
  servfailRatioFor: 5m

zoneSerialAlerts:
  enabled: false
  # Long enough that a transfer in flight is not mistaken for a stuck one.
  divergedFor: 30m
  missingFor: 30m
  # A NOTIFY goes out within seconds of a change, so anything still behind
  # after this is not in flight.
  notifyBehindFor: 15m

textfileAlerts:
  enabled: false
  # apt / nvme / smartmon are written by systemd timers every 15 minutes, so an
  # hour is four missed runs and leaves room for a reboot.
  staleFor: 15m
  maxAgeSeconds: 3600
  # rpi_throttled is written by a cron job every minute.
  rpi:
    staleFor: 5m
    maxAgeSeconds: 180
  scrapeErrorFor: 10m
