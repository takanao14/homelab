port: 9100
metricsPath: /metrics

proxmoxNodes: []
targets: []

resolverAlerts:
  enabled: false
  targetDownFor: 5m
  metricsStaleFor: 5m
  # Four 15s collector intervals, allowing jitter while detecting failure quickly.
  metricsMaxAgeSeconds: 60
  # Healthy 90–99%; fault measured 36–43%.
  cacheHitRateMin: 0.6
  cacheHitRateFor: 15m
  servfailRatioMax: 0.3
  servfailRatioFor: 5m

zoneSerialAlerts:
  enabled: false
  # Allow in-flight transfers.
  divergedFor: 30m
  missingFor: 30m
  # NOTIFY should propagate well within this window.
  notifyBehindFor: 15m

filesystemAlerts:
  enabled: false
  job: scrapeConfig/monitoring/node-exporter-external
  # Match the dashboard filter; exclude fixed-size EFI/firmware mounts.
  fstypes: ext[234]|xfs|btrfs|zfs|vfat
  excludeMountpoints: /var/lib/docker/.*|/boot/efi|/boot/firmware
  # Match upstream rules: sustained trend first, low-space level as backstop.
  fillingUpFreePercent: 15
  fillingUpHorizonHours: 24
  fillingUpFor: 1h
  almostOutFreePercent: 5
  almostOutFor: 30m
  # Fleet worst is 26% inode use.
  inodesFreePercent: 20
  inodesFor: 1h

textfileAlerts:
  enabled: false
  # One hour permits four missed 15m timer runs and a reboot.
  staleFor: 15m
  maxAgeSeconds: 3600
  # rpi_throttled updates every minute.
  rpi:
    staleFor: 5m
    maxAgeSeconds: 180
  scrapeErrorFor: 10m
