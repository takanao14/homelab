port: 9100
metricsPath: /metrics

proxmoxNodes: []
targets: []

resolverAlerts:
  enabled: false
  targetDownFor: 5m
  metricsStaleFor: 5m
  metricsMaxAgeSeconds: 180
  # Healthy is 90-99%. 60% is comfortably below normal variation and well above
  # the 36-43% seen while the cache was being dropped and refilled.
  cacheHitRateMin: 0.6
  cacheHitRateFor: 15m
  servfailRatioMax: 0.3
  servfailRatioFor: 5m

textfileAlerts:
  enabled: false
  # apt / nvme / smartmon are written by systemd timers every 15 minutes, so an
  # hour is four missed runs and leaves room for a reboot.
  staleFor: 15m
  maxAgeSeconds: 3600
  # rpi_throttled is written by a cron job every minute.
  rpi:
    staleFor: 5m
    maxAgeSeconds: 180
  scrapeErrorFor: 10m
