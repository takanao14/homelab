{{- if .Values.textfileAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-textfile-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: node-textfile-external
      rules:
        # A .prom file whose writer has stopped keeps being served with its last
        # contents, so a dead collector looks like live data. node1 served a
        # 131-day-old smartmon.prom this way, and NodeDiskTempHigh was reading
        # it as a current temperature.
        #
        # Staleness only: a missing file produces no series at all, which is the
        # correct state on hosts that legitimately have nothing to report —
        # smartmon.prom never appears on an NVMe-only host, because the timer
        # that writes it is conditioned on /dev/sd* existing. The files that
        # must always be present carry their own rules below and in
        # resolver-rules.yaml, and are excluded here to avoid double alerting.
        - alert: NodeTextfileMetricsStale
          expr: >-
            time() - node_textfile_mtime_seconds{
              file!~".*/(knot_resolver|rpi_throttled)\\.prom"
            } > {{ .Values.textfileAlerts.maxAgeSeconds }}
          for: {{ .Values.textfileAlerts.staleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Textfile metrics are stale on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.file }}" }} has not been rewritten for
              {{ "{{ $value | humanizeDuration }}" }}. Its collector has
              stopped, but node_exporter keeps exporting the last values it
              wrote.

        # rpi_throttled.prom feeds RPiUnderVoltage, which is a critical alert.
        # Its cron runs every minute and the file must exist on every Raspberry
        # Pi, so both halves are checked: too old, or gone while the host is
        # still being scraped.
        - alert: RPiThrottledMetricsStale
          expr: >-
            (
              time() -
              node_textfile_mtime_seconds{
                service="rpi",
                file=~".*rpi_throttled\\.prom"
              } > {{ .Values.textfileAlerts.rpi.maxAgeSeconds }}
            )
            or on(instance)
            (
              up{service="rpi"} == 1
              unless on(instance)
              node_textfile_mtime_seconds{
                service="rpi",
                file=~".*rpi_throttled\\.prom"
              }
            )
          for: {{ .Values.textfileAlerts.rpi.staleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Raspberry Pi throttling metrics are stale on {{ "{{ $labels.instance }}" }}"
            description: >-
              rpi_throttled.prom is missing or no longer being rewritten, so
              RPiUnderVoltage and RPiThermalThrottling have nothing to evaluate.

        # Set when node_exporter cannot parse a .prom file. The writers rename
        # into place so a half-written file is never read, but a malformed line
        # from a collector script would surface here.
        - alert: NodeTextfileScrapeError
          expr: node_textfile_scrape_error != 0
          for: {{ .Values.textfileAlerts.scrapeErrorFor }}
          labels:
            severity: warning
          annotations:
            summary: "Textfile collector cannot parse a .prom file on {{ "{{ $labels.instance }}" }}"
            description: >-
              node_exporter reported a textfile collector error. Every metric
              from that file is missing until it is fixed.
{{- end }}
