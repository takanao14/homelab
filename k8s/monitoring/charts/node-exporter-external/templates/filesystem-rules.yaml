{{- if .Values.filesystemAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-filesystem-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: node-filesystem-external
      rules:
        # kube-prometheus-stack already ships NodeFilesystemSpaceFillingUp and
        # NodeFilesystemAlmostOutOfSpace, and they are running — but every one of
        # them is pinned to job="node-exporter", the in-cluster DaemonSet. The
        # nineteen hosts scraped through job="scrapeConfig/monitoring/
        # node-exporter-external" match none of them, which left the Proxmox
        # hypervisors, the Raspberry Pis, the LXC guests and the standalone VMs
        # with no disk-fill alerting at all. These rules are the upstream ones
        # re-scoped; the thresholds are deliberately unchanged, because there is
        # no measurement here that would justify a different number and inventing
        # one would only make the two sets disagree.
        #
        # The selector matches the fsFilter in dashboards/cmd/generate/node.go so
        # that what alerts and what the dashboard draws are the same set. /boot is
        # included on purpose: it is small and a failed kernel upgrade fills it.
        #
        # On pve several ZFS datasets share one pool, so a full rpool fires this
        # once per dataset rather than once. That is noisy but not wrong, and
        # suppressing it would mean guessing which dataset is the interesting one.
        - alert: NodeFilesystemSpaceFillingUp
          expr: >-
            (
              node_filesystem_avail_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              /
              node_filesystem_size_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              * 100 < {{ .Values.filesystemAlerts.fillingUpFreePercent }}
            )
            and
            predict_linear(
              node_filesystem_avail_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }[6h], {{ .Values.filesystemAlerts.fillingUpHorizonHours }} * 60 * 60
            ) < 0
            and
            node_filesystem_readonly{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            } == 0
          for: {{ .Values.filesystemAlerts.fillingUpFor }}
          labels:
            severity: warning
          annotations:
            summary: "Filesystem is filling up on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has
              {{ "{{ printf \"%.1f\" $value }}" }}% free and, at the rate of the
              last 6 hours, runs out within
              {{ .Values.filesystemAlerts.fillingUpHorizonHours }} hours. This is
              the leading indicator; act on it rather than waiting for
              NodeFilesystemAlmostOutOfSpace.

        # The backstop, on level alone. Reached only if the trend alert above was
        # missed or the fill was too abrupt to predict.
        - alert: NodeFilesystemAlmostOutOfSpace
          expr: >-
            node_filesystem_avail_bytes{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            }
            /
            node_filesystem_size_bytes{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            }
            * 100 < {{ .Values.filesystemAlerts.almostOutFreePercent }}
          for: {{ .Values.filesystemAlerts.almostOutFor }}
          labels:
            severity: critical
          annotations:
            summary: "Filesystem almost out of space on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has only
              {{ "{{ printf \"%.1f\" $value }}" }}% free.

        # Inodes run out independently of bytes: many small files fill the table
        # while df still reports space. Measured on this fleet the worst is
        # netbox1 at 26% of its inodes used, so this has room, but it is the
        # failure mode that looks like a full disk while the disk is half empty.
        - alert: NodeFilesystemFilesFillingUp
          expr: >-
            (
              node_filesystem_files_free{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              /
              node_filesystem_files{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              * 100 < {{ .Values.filesystemAlerts.inodesFreePercent }}
            )
            and
            node_filesystem_readonly{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            } == 0
          for: {{ .Values.filesystemAlerts.inodesFor }}
          labels:
            severity: warning
          annotations:
            summary: "Filesystem is running out of inodes on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has
              {{ "{{ printf \"%.1f\" $value }}" }}% of its inodes free. Writes
              will fail with ENOSPC while df still shows free space.
{{- end }}
