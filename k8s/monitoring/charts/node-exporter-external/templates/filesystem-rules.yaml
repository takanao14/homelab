{{- if .Values.filesystemAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-filesystem-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: node-filesystem-external
      rules:
        # Upstream-equivalent rules re-scoped to external hosts and dashboard filters.
        - alert: NodeFilesystemSpaceFillingUp
          expr: >-
            (
              node_filesystem_avail_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              /
              node_filesystem_size_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              * 100 < {{ .Values.filesystemAlerts.fillingUpFreePercent }}
            )
            and
            predict_linear(
              node_filesystem_avail_bytes{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }[6h], {{ .Values.filesystemAlerts.fillingUpHorizonHours }} * 60 * 60
            ) < 0
            and
            node_filesystem_readonly{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            } == 0
          for: {{ .Values.filesystemAlerts.fillingUpFor }}
          labels:
            severity: warning
          annotations:
            summary: "Filesystem is filling up on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has
              {{ "{{ printf \"%.1f\" $value }}" }}% free and, at the rate of the
              last 6 hours, runs out within
              {{ .Values.filesystemAlerts.fillingUpHorizonHours }} hours. This is
              the leading indicator; act on it rather than waiting for
              NodeFilesystemAlmostOutOfSpace.

        # Level backstop for abrupt or missed fill trends.
        - alert: NodeFilesystemAlmostOutOfSpace
          expr: >-
            node_filesystem_avail_bytes{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            }
            /
            node_filesystem_size_bytes{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            }
            * 100 < {{ .Values.filesystemAlerts.almostOutFreePercent }}
          for: {{ .Values.filesystemAlerts.almostOutFor }}
          labels:
            severity: critical
          annotations:
            summary: "Filesystem almost out of space on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has only
              {{ "{{ printf \"%.1f\" $value }}" }}% free.

        # Inodes can exhaust independently of free bytes; fleet worst is 26% used.
        - alert: NodeFilesystemFilesFillingUp
          expr: >-
            (
              node_filesystem_files_free{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              /
              node_filesystem_files{
                job="{{ .Values.filesystemAlerts.job }}",
                fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
                mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
              }
              * 100 < {{ .Values.filesystemAlerts.inodesFreePercent }}
            )
            and
            node_filesystem_readonly{
              job="{{ .Values.filesystemAlerts.job }}",
              fstype=~"{{ .Values.filesystemAlerts.fstypes }}",
              mountpoint!~"{{ .Values.filesystemAlerts.excludeMountpoints }}"
            } == 0
          for: {{ .Values.filesystemAlerts.inodesFor }}
          labels:
            severity: warning
          annotations:
            summary: "Filesystem is running out of inodes on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.mountpoint }}" }} on
              {{ "{{ $labels.instance }}" }} has
              {{ "{{ printf \"%.1f\" $value }}" }}% of its inodes free. Writes
              will fail with ENOSPC while df still shows free space.
{{- end }}
