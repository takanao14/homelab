{{- if .Values.ledServiceMonitor.enabled }}
{{- $instances := join "|" .Values.ledServiceMonitor.instances }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: led-service-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: led-service-external
      rules:
        - record: led_service:check_fresh
          expr: >-
            (
              (
                (time() - led_service_check_timestamp_seconds{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"}
                  <= bool {{ .Values.ledServiceMonitor.maxAgeSeconds }})
                *
                (time() - led_service_check_timestamp_seconds{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"} >= bool 0)
              )
              and on(instance)
              (up{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"} == 1)
            )
            or on(instance)
            (0 * up{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"})
        - record: led_service:available
          expr: >-
            (
              led_service:check_fresh{instance=~"{{ $instances }}"}
              * on(instance) group_left led_service_active{job="scrapeConfig/monitoring/node-exporter-external"}
              * on(instance) group_left led_service_grpc_success{job="scrapeConfig/monitoring/node-exporter-external"}
            )
            or on(instance)
            (0 * up{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"})
        - alert: LedServiceUnavailable
          expr: led_service:available{instance=~"{{ $instances }}"} == 0
          for: {{ .Values.ledServiceMonitor.unavailableFor }}
          labels:
            severity: warning
          annotations:
            summary: >-
              LED service is unavailable on {{ "{{" }} $labels.instance {{ "}}" }}
            description: >-
              The recording rule is 0 when the unit is inactive, the gRPC probe
              fails, or the snapshot is stale, so check all three. Messages sent
              meanwhile are lost; Slack does not redeliver them. A host outage
              also lands here, behind the more specific ICMP and scrape alerts.

        - alert: LedServiceRestarting
          # A crash loop keeps the unit active between restarts, so the
          # availability probe above sees a healthy service throughout.
          expr: >-
            increase(led_service_restarts_total{job="scrapeConfig/monitoring/node-exporter-external",instance=~"{{ $instances }}"}[15m])
            >= {{ .Values.ledServiceMonitor.restartsThreshold }}
          labels:
            severity: warning
          annotations:
            summary: >-
              LED service is restarting repeatedly on {{ "{{" }} $labels.instance {{ "}}" }}
            description: >-
              systemd restarted the unit {{ "{{" }} $value {{ "}}" }} times in
              fifteen minutes. A single restart after a deployment is expected;
              a sustained count means the process exits on startup.
{{- end }}
