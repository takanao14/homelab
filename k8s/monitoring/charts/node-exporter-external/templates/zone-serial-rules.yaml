{{- if .Values.zoneSerialAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pdns-zone-serial-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: pdns-zone-serial-external
      rules:
        # Serial divergence catches stale-but-responsive secondaries after propagation delay.
        - alert: PdnsZoneSerialDiverged
          expr: >-
            max by (zone) (pdns_zone_serial)
            - min by (zone) (pdns_zone_serial) > 0
          for: {{ .Values.zoneSerialAlerts.divergedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Zone {{ "{{ $labels.zone }}" }} is out of sync between the nameservers"
            description: >-
              The newest and oldest serial held for
              {{ "{{ $labels.zone }}" }} differ by {{ "{{ $value }}" }}. At
              least one secondary is serving stale zone data.

        # Only primaries report notified_serial, avoiding a hard-coded primary name.
        - alert: PdnsZoneNotifyBehind
          expr: pdns_zone_serial - pdns_zone_notified_serial > 0
          for: {{ .Values.zoneSerialAlerts.notifyBehindFor }}
          labels:
            severity: warning
          annotations:
            summary: "NOTIFY is behind for {{ "{{ $labels.zone }}" }} on {{ "{{ $labels.instance }}" }}"
            description: >-
              The primary holds a newer serial than the one it last notified
              the secondaries of, so propagation has fallen back to the refresh
              interval. Check the zone kind first — `pdnsutil show-zone
              {{ "{{ $labels.zone }}" }}`. PowerDNS never notifies for a Native
              zone, and this fleet synchronises over AXFR, so Native is a
              misconfiguration to correct rather than a reason to silence this.
              Fix with `pdnsutil set-kind <zone> MASTER`, and make sure
              whatever creates zones sets the kind too: dnscontrol's
              `zone_kind` only applies at creation.

        # Derive expected replicas from reporting servers; target-down handles missing hosts.
        - alert: PdnsZoneMissing
          expr: >-
            count by (zone) (pdns_zone_serial)
            < scalar(count(count by (instance) (pdns_zone_serial)))
          for: {{ .Values.zoneSerialAlerts.missingFor }}
          labels:
            severity: warning
          annotations:
            summary: "Zone {{ "{{ $labels.zone }}" }} is absent from a nameserver"
            description: >-
              Only {{ "{{ $value }}" }} of the authoritative servers hold
              {{ "{{ $labels.zone }}" }}. A transfer has never completed there,
              or the zone was removed.
{{- end }}
