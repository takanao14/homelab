{{- if .Values.resolverAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resolver-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: resolver-external
      rules:
        - alert: ResolverNodeExporterDown
          expr: up{service="knot-resolver"} == 0
          for: {{ .Values.resolverAlerts.targetDownFor }}
          labels:
            severity: critical
          annotations:
            summary: "Resolver host {{ "{{ $labels.instance }}" }} is unreachable"
            description: >-
              Prometheus cannot scrape node_exporter on
              {{ "{{ $labels.instance }}" }}.
        - alert: KnotResolverMetricsStale
          expr: >-
            (
              time() -
              node_textfile_mtime_seconds{
                service="knot-resolver",
                file=~".*knot_resolver\\.prom"
              } > {{ .Values.resolverAlerts.metricsMaxAgeSeconds }}
            )
            or on(instance)
            (
              up{service="knot-resolver"} == 1
              unless on(instance)
              node_textfile_mtime_seconds{
                service="knot-resolver",
                file=~".*knot_resolver\\.prom"
              }
            )
          for: {{ .Values.resolverAlerts.metricsStaleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Knot Resolver metrics are stale on {{ "{{ $labels.instance }}" }}"
            description: >-
              The Knot Resolver textfile collector has not produced fresh
              metrics within the configured age threshold.

        # Cache-drop leading indicator: healthy 90–99%, fault 36–43%. Aggregate
        # workers per host and keep the rate window above the 15s write interval.
        - alert: KnotResolverCacheHitRateLow
          expr: >-
            sum by (instance) (rate(resolver_answer_cached_total[10m]))
            / clamp_min(sum by (instance) (rate(resolver_answer_total[10m])), 0.001)
            < {{ .Values.resolverAlerts.cacheHitRateMin }}
          for: {{ .Values.resolverAlerts.cacheHitRateFor }}
          labels:
            severity: warning
          annotations:
            summary: "Knot Resolver cache hit rate is low on {{ "{{ $labels.instance }}" }}"
            description: >-
              Hit rate is {{ "{{ $value | humanizePercentage }}" }}. Queries
              that would have been served from cache are being resolved
              recursively instead, which overloads upstream and ends in
              SERVFAIL. Check for "stash failed" in the knot-resolver journal:
              a full cache is the known cause.

        # Client-visible outcome, aggregated across workers per host.
        - alert: KnotResolverServfailHigh
          expr: >-
            sum by (instance) (rate(resolver_answer_rcode_servfail_total[10m]))
            / clamp_min(sum by (instance) (rate(resolver_request_total[10m])), 0.001)
            > {{ .Values.resolverAlerts.servfailRatioMax }}
          for: {{ .Values.resolverAlerts.servfailRatioFor }}
          labels:
            severity: critical
          annotations:
            summary: "Knot Resolver is answering SERVFAIL on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are
              answered SERVFAIL. Resolution is failing for clients, not just
              degraded.
{{- end }}
