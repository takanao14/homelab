{{- if .Values.resolverAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resolver-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: resolver-external
      rules:
        - alert: ResolverNodeExporterDown
          expr: up{service="knot-resolver"} == 0
          for: {{ .Values.resolverAlerts.targetDownFor }}
          labels:
            severity: critical
          annotations:
            summary: "Resolver host {{ "{{ $labels.instance }}" }} is unreachable"
            description: >-
              Prometheus cannot scrape node_exporter on
              {{ "{{ $labels.instance }}" }}.
        - alert: KnotResolverMetricsStale
          expr: >-
            (
              time() -
              node_textfile_mtime_seconds{
                service="knot-resolver",
                file=~".*knot_resolver\\.prom"
              } > {{ .Values.resolverAlerts.metricsMaxAgeSeconds }}
            )
            or on(instance)
            (
              up{service="knot-resolver"} == 1
              unless on(instance)
              node_textfile_mtime_seconds{
                service="knot-resolver",
                file=~".*knot_resolver\\.prom"
              }
            )
          for: {{ .Values.resolverAlerts.metricsStaleFor }}
          labels:
            severity: warning
          annotations:
            summary: "Knot Resolver metrics are stale on {{ "{{ $labels.instance }}" }}"
            description: >-
              The Knot Resolver textfile collector has not produced fresh
              metrics within the configured age threshold.

        # Alert on the failure precursor directly. Cache hit rate is workload
        # dependent and becomes noisy at the resolvers' low baseline QPS.
        - alert: KnotResolverCacheNearlyFull
          expr: >-
            100 * knot_resolver_cache_used_bytes
            / knot_resolver_cache_size_bytes
            > {{ .Values.resolverAlerts.cacheUsagePercentMax }}
          for: {{ .Values.resolverAlerts.cacheUsageFor }}
          labels:
            severity: warning
          annotations:
            summary: "Knot Resolver cache is nearly full on {{ "{{ $labels.instance }}" }}"
            description: >-
              The LMDB cache on {{ "{{ $labels.instance }}" }} is
              {{ "{{ $value | printf \"%.1f\" }}" }}% full. Increase the map
              size or investigate cache growth before stash failures force
              cold recursion and increase upstream load.

        # Backend-local outcome, aggregated across workers per host. dnsdist
        # may retry another resolver before a client sees the failure.
        - alert: KnotResolverServfailHigh
          expr: >-
            sum by (instance) (rate(resolver_answer_rcode_servfail_total[10m]))
            / clamp_min(sum by (instance) (rate(resolver_request_total[10m])), 0.001)
            > {{ .Values.resolverAlerts.servfailRatioMax }}
          for: {{ .Values.resolverAlerts.servfailRatioFor }}
          labels:
            severity: warning
          annotations:
            summary: "Knot Resolver backend is answering SERVFAIL on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of requests are
              answered SERVFAIL by this resolver. dnsdist may still absorb the
              failure by retrying another backend; check the client-impact
              alert before treating this as an outage.
{{- end }}
