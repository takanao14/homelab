blackboxExporterURL: ""
scrapeInterval: 30s

# Proxmox hypervisor inventory; populated by the shared
# values/proxmox-nodes.yaml through apps/values.yaml valueFiles.
proxmoxNodes: []

# DNS frontend inventory; populated by the shared
# values/dns-frontends.yaml through apps/values.yaml valueFiles.
# Both DNS resolution probes (dns_external / dns_internal) derive from it.
dnsFrontends: []

icmp:
  targets: []

dnsProbeAlerts:
  enabled: false
  # Short: this is the client-visible symptom, and the probe runs every
  # scrapeInterval against two independent frontends.
  failedFor: 2m

icmpProbeAlerts:
  enabled: false
  # Ignore minute-scale blips; sustained outages exceeded this threshold.
  downFor: 10m
  # AMT is a recovery path; tolerate routine brief drops.
  amtDownFor: 1h
