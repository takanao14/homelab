blackboxExporterURL: ""
scrapeInterval: 30s

# Shared Proxmox inventory.
proxmoxNodes: []

# Shared frontend inventory for both DNS probe modules.
dnsFrontends: []

icmp:
  targets: []

dnsProbeAlerts:
  enabled: false
  # Client-visible failure across two independently probed frontends.
  failedFor: 2m

icmpProbeAlerts:
  enabled: false
  # Ignore minute-scale blips; sustained outages exceeded this threshold.
  downFor: 10m
  # AMT is a recovery path; tolerate routine brief drops.
  amtDownFor: 1h
