{{- if .Values.authoritativeDnsProbeAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dns-authoritative-probe
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: dns-authoritative-probe
      rules:
        # Path losses alternate between success and failure, so per-scrape
        # "all targets failed" checks never hold for the full duration.
        - alert: AuthoritativeDnsUdpPathDegraded
          expr: >-
            avg by (probe_source) (
              avg_over_time(probe_success{job="scrapeConfig/monitoring/dns-authoritative-udp"}[{{ .Values.authoritativeDnsProbeAlerts.successWindow }}])
            ) < {{ .Values.authoritativeDnsProbeAlerts.successRatioMin }}
          for: {{ .Values.authoritativeDnsProbeAlerts.failedFor }}
          labels:
            severity: warning
          annotations:
            summary: "Authoritative DNS over UDP is degraded from {{ "{{ $labels.probe_source }}" }}"
            description: >-
              Only {{ "{{ $value | humanizePercentage }}" }} of direct UDP queries
              to root servers succeeded from {{ "{{ $labels.probe_source }}" }} over
              the last {{ .Values.authoritativeDnsProbeAlerts.successWindow }}.

        - alert: AuthoritativeDnsPathUnavailable
          expr: >-
            avg by (probe_source) (
              avg_over_time(probe_success{job="scrapeConfig/monitoring/dns-authoritative-udp"}[{{ .Values.authoritativeDnsProbeAlerts.successWindow }}])
            ) < {{ .Values.authoritativeDnsProbeAlerts.successRatioMin }}
            and on (probe_source)
            avg by (probe_source) (
              avg_over_time(probe_success{job="scrapeConfig/monitoring/dns-authoritative-tcp"}[{{ .Values.authoritativeDnsProbeAlerts.successWindow }}])
            ) < {{ .Values.authoritativeDnsProbeAlerts.successRatioMin }}
          for: {{ .Values.authoritativeDnsProbeAlerts.failedFor }}
          labels:
            severity: critical
          annotations:
            summary: "Authoritative DNS is unreachable from {{ "{{ $labels.probe_source }}" }}"
            description: >-
              Both UDP and TCP queries to root servers are failing from
              {{ "{{ $labels.probe_source }}" }} over the last
              {{ .Values.authoritativeDnsProbeAlerts.successWindow }}.
{{- end }}
