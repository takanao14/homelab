apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: icmp-network-devices
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # Keep external probes outside the prd cluster label.
  scrapeClass: external
  metricsPath: /probe
  params:
    module: [icmp]
  staticConfigs:
    # Probe shared node and optional AMT addresses.
    {{- range .Values.proxmoxNodes }}
    - targets: [{{ .ip | quote }}]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
    {{- range .Values.proxmoxNodes }}
    {{- if .amtIp }}
    - targets: [{{ .amtIp | quote }}]
      labels:
        __tmp_name: {{ printf "%s-amt" .name | quote }}
    {{- end }}
    {{- end }}
    {{- range .Values.icmp.targets }}
    - targets: [{{ .ip | quote }}]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
  relabelings:
    # Forward the target IP to blackbox_exporter.
    - action: replace
      sourceLabels: [__address__]
      targetLabel: __param_target
    # Use inventory names as instances.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
    # Scrape the external blackbox_exporter.
    - action: replace
      targetLabel: __address__
      replacement: {{ .Values.blackboxExporterURL | quote }}
  scrapeInterval: {{ .Values.scrapeInterval }}
