{{- if .Values.tcpProbeAlerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tcp-probe-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: tcp-probe-external
      rules:
        # Distinct from IcmpProbeFailed on the same host: the machine answers
        # ping while the service behind the port is gone.
        - alert: TcpServiceUnreachable
          expr: probe_success{job="scrapeConfig/monitoring/tcp-services"} == 0
          for: {{ .Values.tcpProbeAlerts.downFor }}
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $labels.instance }}" }} is not accepting connections"
            description: >-
              The service port for {{ "{{ $labels.instance }}" }} refuses TCP
              connections. Check the host's ICMP alert first: if it is silent,
              the host is up and only the service is down.
        # Self-signed certificates (LDAPS) have no renewal automation.
        - alert: TlsCertificateExpiringSoon
          expr: >-
            probe_ssl_earliest_cert_expiry{job="scrapeConfig/monitoring/tcp-services"}
            - time() < {{ .Values.tcpProbeAlerts.certExpiryDays }} * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ "{{ $labels.instance }}" }} certificate expires within {{ .Values.tcpProbeAlerts.certExpiryDays }} days"
            description: >-
              Rotate the certificate before it expires; clients that verify it
              stop connecting at expiry.
{{- end }}
