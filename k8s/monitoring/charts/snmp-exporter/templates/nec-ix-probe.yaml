{{- if .Values.necIx.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: snmp-ix2106
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  scrapeClass: external
  interval: 60s
  module: nec_ix
  prober:
    url: snmp-exporter-prometheus-snmp-exporter:9116
    path: /snmp
  targets:
    staticConfig:
      relabelingConfigs:
        - action: replace
          targetLabel: __param_auth
          replacement: homelab_v2
        - action: replace
          targetLabel: instance
          replacement: {{ .Values.necIx.instance | quote }}
      static:
        - {{ .Values.necIx.target | quote }}
  metricRelabelings:
    - action: keep
      sourceLabels: [__name__]
      regex: 'naptCache.*|picoIPv4(Cache|UFSCache).*|picoHeap(Size|Util)|picoSchedRtUtl.*|picoCelsius|picoVoltage|snmp_.*'
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: snmp-ix2106-ip-diagnostics
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  scrapeClass: external
  interval: 60s
  module: ix2106_ip_diagnostics
  prober:
    url: snmp-exporter-prometheus-snmp-exporter:9116
    path: /snmp
  targets:
    staticConfig:
      relabelingConfigs:
        - action: replace
          targetLabel: __param_auth
          replacement: homelab_v2
        - action: replace
          targetLabel: instance
          replacement: {{ .Values.necIx.instance | quote }}
      static:
        - {{ .Values.necIx.target | quote }}
{{- end }}
