interfaceAlerts:
  enabled: false
  # Match dashboard physical ports; excluded subinterfaces have noisy counters.
  ifDescr: GigaEthernet[0-9]+|GigabitEthernet[0-9]+
  # Ten 1m misses tolerate renegotiation/reboot while catching real link loss.
  downFor: 10m
  # Seven-day physical-port baseline is zero; tolerate fewer than 10 stray frames/hour.
  errorsPerHour: 10
  errorsFor: 15m
