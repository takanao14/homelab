apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: control-plane-node-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # Preserve per-target cluster labels.
  scrapeClass: {{ .Values.nodeExporter.scrapeClass }}
  metricsPath: {{ .Values.nodeExporter.metricsPath }}
  scrapeInterval: {{ .Values.nodeExporter.scrapeInterval }}
  # Kubelet-less k0s controllers require host-level node-exporter scrapes.
  staticConfigs:
    {{- range .Values.controllers }}
    - targets: ["{{ .ip }}:{{ $.Values.nodeExporter.port }}"]
      labels:
        cluster: {{ .cluster }}
        __tmp_name: {{ .name }}
    {{- end }}
  relabelings:
    # Name IP-based scrapes; explicit action avoids SSA default drift.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
