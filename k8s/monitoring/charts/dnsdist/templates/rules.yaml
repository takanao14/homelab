{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dnsdist-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: dnsdist-external
      rules:
        # dnsdist detects backend failure before host/textfile monitoring does.
        - alert: DnsdistBackendDown
          expr: dnsdist_server_status == 0
          for: {{ .Values.alerts.backendDownFor }}
          labels:
            severity: warning
          annotations:
            summary: "dnsdist backend {{ "{{ $labels.server }}" }} is down on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $labels.instance }}" }} has taken
              {{ "{{ $labels.server }}" }} ({{ "{{ $labels.address }}" }}) out
              of its pool. The remaining backend is carrying the traffic.

        # Sum preserves a zero series when every backend is down; count would vanish.
        - alert: DnsdistNoResolverAvailable
          expr: sum by (instance) (dnsdist_server_status{server=~"resolver.*"}) == 0
          for: {{ .Values.alerts.noResolverFor }}
          labels:
            severity: critical
          annotations:
            summary: "No recursive resolver left for {{ "{{ $labels.instance }}" }}"
            description: >-
              Every Knot Resolver backend is down for
              {{ "{{ $labels.instance }}" }}. Recursive resolution through this
              frontend has stopped; internal zones still resolve through the
              pdns secondaries.

        # Backend alerts can be absorbed by retrying another resolver. Escalate
        # only when clients receive a sustained, material SERVFAIL response rate.
        - alert: DnsdistClientServfailHigh
          expr: >-
            (
              sum(rate(dnsdist_frontend_servfail{job={{ .Values.alerts.job | quote }}}[5m]))
              /
              clamp_min(sum(rate(dnsdist_responses{job={{ .Values.alerts.job | quote }}}[5m])), 0.001)
              > {{ .Values.alerts.clientServfailRatioMax }}
            )
            and
            sum(rate(dnsdist_frontend_servfail{job={{ .Values.alerts.job | quote }}}[5m]))
            > {{ .Values.alerts.clientServfailRateMin }}
          for: {{ .Values.alerts.clientServfailFor }}
          labels:
            severity: critical
          annotations:
            summary: "dnsdist is returning SERVFAIL to clients"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of client responses are
              SERVFAIL across the DNS frontends, with more than
              {{ .Values.alerts.clientServfailRateMin }} failures per second.
              Client resolution is materially degraded; inspect both resolver
              backends and the DNS query logs.
{{- end }}
