apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: dnsdist-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # Keep external hosts outside the prd cluster label.
  scrapeClass: external
  staticConfigs:
    # Shared frontend inventory.
    {{- range .Values.dnsFrontends }}
    - targets: ["{{ .ip }}:{{ $.Values.port }}"]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
  relabelings:
    # Name IP-based scrapes.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
  metricsPath: {{ .Values.metricsPath }}
  scrapeInterval: 30s
