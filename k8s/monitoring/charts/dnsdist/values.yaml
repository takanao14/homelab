port: 8083
metricsPath: /metrics

# DNS frontend inventory; populated by the shared values/dns-frontends.yaml
# through apps/values.yaml valueFiles.
dnsFrontends: []

alerts:
  enabled: false
  # One backend of a redundant pair: the other absorbs it, so this is a warning
  # and can wait for a couple of health-check rounds.
  backendDownFor: 2m
  # No recursive backend left at all. Nothing absorbs this.
  noResolverFor: 1m
