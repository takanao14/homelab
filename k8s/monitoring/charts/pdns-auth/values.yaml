port: 8081
metricsPath: /metrics

targets: []

# The authoritative servers answered zero SERVFAIL and zero corrupt packets
# across seven days, so anything sustained is worth waking up for. The rate
# threshold sits just above a single stray packet decaying out of the window,
# which keeps a one-off from holding the alert for its full duration.
alerts:
  enabled: false
  servfailRate: 0.05
  servfailFor: 10m
  corruptRate: 0.05
  corruptFor: 10m
