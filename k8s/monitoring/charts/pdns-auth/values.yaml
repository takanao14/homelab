port: 8081
metricsPath: /metrics

targets: []

# Seven-day baseline is zero; thresholds ignore one decaying stray packet.
alerts:
  enabled: false
  servfailRate: 0.05
  servfailFor: 10m
  corruptRate: 0.05
  corruptFor: 10m
  # A queue persisting 15m is stuck, not busy.
  xfrQueueFor: 15m
  # Security status is actionable but not urgent.
  securityStatusFor: 1h
