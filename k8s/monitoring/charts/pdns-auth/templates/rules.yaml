{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pdns-auth-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    - name: pdns-auth-external
      rules:
        # Authoritative SERVFAIL indicates backend/signing failure; baseline is zero.
        - alert: PdnsAuthServfail
          expr: rate(pdns_auth_servfail_packets[10m]) > {{ .Values.alerts.servfailRate }}
          for: {{ .Values.alerts.servfailFor }}
          labels:
            severity: warning
          annotations:
            summary: "Authoritative DNS is answering SERVFAIL on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $value | humanize }}" }} SERVFAIL/s. The baseline is zero,
              so the backend or DNSSEC signing is failing for at least one
              zone.

        - alert: PdnsAuthCorruptPackets
          expr: rate(pdns_auth_corrupt_packets[10m]) > {{ .Values.alerts.corruptRate }}
          for: {{ .Values.alerts.corruptFor }}
          labels:
            severity: warning
          annotations:
            summary: "Authoritative DNS is receiving corrupt packets on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $value | humanize }}" }} malformed packets/s against a
              baseline of zero. Expect a broken client or something mangling
              DNS on the path.

        # Persistent queue means transfers are stuck; serial rules cover missing starts.
        - alert: PdnsAuthXfrQueueStuck
          expr: pdns_auth_xfr_queue > 0
          for: {{ .Values.alerts.xfrQueueFor }}
          labels:
            severity: warning
          annotations:
            summary: "Zone transfers are not draining on {{ "{{ $labels.instance }}" }}"
            description: >-
              {{ "{{ $value }}" }} zone(s) have been queued for transfer for
              longer than expected. The secondaries may be serving stale zone
              data.

        # Vendor status: 1 OK, 2 upgrade recommended, 3 vulnerable.
        - alert: PdnsAuthSecurityStatusBad
          expr: pdns_auth_security_status > 1
          for: {{ .Values.alerts.securityStatusFor }}
          labels:
            severity: warning
          annotations:
            summary: "PowerDNS reports a security problem on {{ "{{ $labels.instance }}" }}"
            description: >-
              security_status is {{ "{{ $value }}" }} (2 = upgrade recommended,
              3 = known vulnerability in the running version).
{{- end }}
