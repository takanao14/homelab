apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: amd-gpu-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # Keep the external host outside the prd cluster label.
  scrapeClass: external
  staticConfigs:
    {{- range .Values.targets }}
    - targets: ["{{ .ip }}:{{ $.Values.port }}"]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
  relabelings:
    # Name IP-based scrapes.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
  metricRelabelings:
    # Drop restart-sensitive process IDs from hardware series.
    - action: labeldrop
      regex: kfd_process_id
  metricsPath: {{ .Values.metricsPath }}
  scrapeInterval: 30s
