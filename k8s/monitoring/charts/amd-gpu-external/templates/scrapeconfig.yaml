apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: amd-gpu-external
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # External LAN host: opt out of the default cluster-prd scrape class.
  scrapeClass: external
  staticConfigs:
    {{- range .Values.targets }}
    - targets: ["{{ .ip }}:{{ $.Values.port }}"]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
  relabelings:
    # Scrape by IP (no DNS dependency) but expose the hostname as instance.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
  metricRelabelings:
    # Drop the GPU process id. The exporter stamps it on every metric, so it
    # changes on every GPU workload (llama-server) restart and breaks each
    # series into a new one -- graphs then look like the series keeps
    # switching. GPU hardware metrics do not need per-process identity.
    - action: labeldrop
      regex: kfd_process_id
  metricsPath: {{ .Values.metricsPath }}
  scrapeInterval: 30s
