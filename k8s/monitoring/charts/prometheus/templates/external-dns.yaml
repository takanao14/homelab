{{- /*
This monitor lives here with the other cross-cutting monitors for consistency;
external-dns itself has no CRD ordering constraint. The default scrape class
adds the cluster label. Sandbox has no external-dns (ADR-0070).
*/ -}}
{{- if .Values.externalDnsMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-dns
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: ["external-dns"]
  selector:
    matchLabels:
      app: external-dns
  endpoints:
    - port: http-metrics
      interval: 30s
{{- end }}
