{{- if .Values.prometheusRules.argocd.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    # Metrics come from the four per-component ServiceMonitors defined in
    # argocd.yaml; the cluster label is injected by the scrape class. Thresholds
    # below were calibrated against 7 days of prd history so that routine GitOps
    # churn (rollouts, transient GitHub blips) stays silent.
    - name: argocd.rules
      rules:
        # ls-remote runs every ~3 minutes per repo, so isolated failures are
        # common: prd saw ~26 non-zero 30m windows in 7 days, almost all of them
        # one or two failures. A raw count therefore alerts several times a day
        # for nothing. The failure *ratio* separates a blip from an outage --
        # over the same 7 days it stayed under 0.2 except for three short
        # episodes, peaking at 0.9. Above half the attempts failing for a full
        # 15 minutes, ArgoCD has effectively stopped seeing new commits.
        - alert: ArgoCDGitLsRemoteFailing
          expr: |
            sum by (cluster) (rate(argocd_git_lsremote_fail_total[15m]))
              /
            sum by (cluster) (rate(argocd_git_request_total{request_type="ls-remote"}[15m]))
              > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD cannot reach the Git remote ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $value | humanizePercentage {{ "}}" }} of git ls-remote calls are failing; applications will stop picking up new commits until this recovers.'

        # Apps dip into Degraded or Progressing during ordinary rollouts, so this
        # needs a long hold to be actionable. Over 7 days of prd history no app
        # was Degraded at two consecutive hourly samples.
        - alert: ArgoCDAppNotHealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Application {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.health_status {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'Application {{ "{{" }} $labels.name {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}, namespace {{ "{{" }} $labels.dest_namespace {{ "}}" }}) has been {{ "{{" }} $labels.health_status {{ "}}" }} for over 30 minutes.'

        # Restricted to autosync apps on purpose: an app synced manually is
        # expected to sit OutOfSync until someone acts on it, so alerting on it
        # would be noise. With autosync on, a prolonged OutOfSync means the sync
        # itself is failing or is blocked by a sync window or hook.
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status="OutOfSync",autosync_enabled="true"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Application {{ "{{" }} $labels.name {{ "}}" }} stuck OutOfSync ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'Application {{ "{{" }} $labels.name {{ "}}" }} has autosync enabled but has been OutOfSync for over an hour; the sync is failing or blocked.'

        # dry_run syncs are diff previews and never indicate a real failure.
        - alert: ArgoCDSyncFailing
          expr: |
            sum by (cluster, name, project) (
              increase(argocd_app_sync_total{phase=~"Error|Failed",dry_run="false"}[15m])
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Sync failing for application {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $value | printf "%.0f" {{ "}}" }} sync operations for {{ "{{" }} $labels.name {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}) ended in Error or Failed in the last 15 minutes.'

        # A destination cluster the application-controller cannot reach means
        # every application targeting it is frozen, hence critical.
        - alert: ArgoCDClusterConnectionDown
          expr: |
            argocd_cluster_connection_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'ArgoCD cannot reach destination cluster {{ "{{" }} $labels.server {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'The application-controller has been unable to connect to {{ "{{" }} $labels.server {{ "}}" }} for over 10 minutes; applications targeting it cannot sync.'

        # Mirrors CertManagerDown: without scraping, none of the rules above can
        # fire, so the blind spot itself has to be alertable.
        - alert: ArgoCDComponentDown
          expr: |
            up{job=~"argocd-.*-metrics"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD metrics target {{ "{{" }} $labels.job {{ "}}" }} down ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $labels.job {{ "}}" }} is not being scraped; ArgoCD health and sync alerts are blind while this persists.'
{{- end }}
