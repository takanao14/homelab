{{- if .Values.prometheusRules.argocd.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    # Seven-day thresholds exclude routine rollout and Git transient noise.
    - name: argocd.rules
      rules:
        # Ratio filters common isolated ls-remote failures; >50% means Git is unusable.
        - alert: ArgoCDGitLsRemoteFailing
          expr: |
            sum by (cluster) (rate(argocd_git_lsremote_fail_total[15m]))
              /
            sum by (cluster) (rate(argocd_git_request_total{request_type="ls-remote"}[15m]))
              > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD cannot reach the Git remote ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $value | humanizePercentage {{ "}}" }} of git ls-remote calls are failing; applications will stop picking up new commits until this recovers.'

        # Hold past transient rollout degradation.
        - alert: ArgoCDAppNotHealthy
          expr: |
            argocd_app_info{health_status=~"Degraded|Missing|Unknown"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: 'Application {{ "{{" }} $labels.name {{ "}}" }} is {{ "{{" }} $labels.health_status {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'Application {{ "{{" }} $labels.name {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}, namespace {{ "{{" }} $labels.dest_namespace {{ "}}" }}) has been {{ "{{" }} $labels.health_status {{ "}}" }} for over 30 minutes.'

        # Manual apps may remain OutOfSync; only autosync indicates a fault.
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status="OutOfSync",autosync_enabled="true"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Application {{ "{{" }} $labels.name {{ "}}" }} stuck OutOfSync ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'Application {{ "{{" }} $labels.name {{ "}}" }} has autosync enabled but has been OutOfSync for over an hour; the sync is failing or blocked.'

        # dry_run syncs are diff previews and never indicate a real failure.
        - alert: ArgoCDSyncFailing
          expr: |
            sum by (cluster, name, project) (
              increase(argocd_app_sync_total{phase=~"Error|Failed",dry_run="false"}[15m])
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Sync failing for application {{ "{{" }} $labels.name {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $value | printf "%.0f" {{ "}}" }} sync operations for {{ "{{" }} $labels.name {{ "}}" }} (project {{ "{{" }} $labels.project {{ "}}" }}) ended in Error or Failed in the last 15 minutes.'

        # An unreachable destination freezes all of its applications.
        - alert: ArgoCDClusterConnectionDown
          expr: |
            argocd_cluster_connection_status == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'ArgoCD cannot reach destination cluster {{ "{{" }} $labels.server {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'The application-controller has been unable to connect to {{ "{{" }} $labels.server {{ "}}" }} for over 10 minutes; applications targeting it cannot sync.'

        # Alert on the monitoring blind spot itself.
        - alert: ArgoCDComponentDown
          expr: |
            up{job=~"argocd-.*-metrics"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ArgoCD metrics target {{ "{{" }} $labels.job {{ "}}" }} down ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $labels.job {{ "}}" }} is not being scraped; ArgoCD health and sync alerts are blind while this persists.'
{{- end }}
