{{- if .Values.prometheusRules.cilium.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    # ServiceMonitors supply metrics; scrapeClass supplies the cluster label.
    - name: cilium.rules
      rules:
        # Use total loss ratio, not noisy raw counts; 1% is >20x the observed peak.
        - alert: HubbleLosingEvents
          expr: |
            sum by (cluster) (rate(hubble_lost_events_total[15m]))
              /
            (
              sum by (cluster) (rate(hubble_flows_processed_total[15m]))
                +
              sum by (cluster) (rate(hubble_lost_events_total[15m]))
            ) > 0.01
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Hubble is losing observed flows ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $value | humanizePercentage {{ "}}" }} of Hubble events are being dropped before they reach a consumer, so flow data is incomplete. Check the Hubble Lost Events by Node / Source panel for the stage responsible: hubble_ring_buffer points at a slow reader, observer_events_queue at a processing backlog, perf_event_ring_buffer at datapath-to-userspace loss.'
{{- end }}
