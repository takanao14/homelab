{{- $stack := index .Values "kube-prometheus-stack" -}}
{{- $externalURL := dig "prometheus" "prometheusSpec" "externalUrl" "" $stack -}}
{{- $hostname := .Values.prometheus.hostname -}}
{{- if $externalURL -}}
{{- $hostname = (urlParse $externalURL).host -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - {{ $hostname }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: prometheus-kube-prometheus-prometheus
          port: 9090
          weight: 1
