{{- if .Values.prometheusRules.certManager.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  groups:
    # cert-manager metrics from prd land here; rules keep the cluster label in
    # annotations so dashboards and alerts remain consistent with sandbox views.
    - name: cert-manager.rules
      rules:
        # ACME certs are 90-day and renew at 30 days remaining; under 21 days left
        # means renewal has been failing for ~9+ days and needs attention.
        - alert: CertManagerCertExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 21
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Certificate {{ "{{" }} $labels.name {{ "}}" }} expiring soon ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} expires in {{ "{{" }} $value | humanizeDuration {{ "}}" }}'

        - alert: CertManagerCertExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 86400 * 7
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: 'Certificate {{ "{{" }} $labels.name {{ "}}" }} expires in <7d ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} expires in {{ "{{" }} $value | humanizeDuration {{ "}}" }}'

        - alert: CertManagerCertNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} != 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: 'Certificate {{ "{{" }} $labels.name {{ "}}" }} not Ready ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: '{{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} is not in the Ready state.'

        # The expiry alerts above only speak up once renewal has already been
        # failing for more than a week: a 90-day ACME cert starts renewing at 30
        # days left, and CertManagerCertExpiringSoon waits until 21. A non-2xx
        # from the ACME endpoint marks the first failed attempt instead, which
        # includes the 429 rate limits Let's Encrypt applies per account and per
        # domain. prd has returned nothing but 200 in 30 days, so there is no
        # noise floor to tune around and any failure is worth reporting; the 1h
        # window is wide enough to still catch retries that cert-manager has
        # backed off.
        - alert: CertManagerACMERequestFailing
          expr: |
            sum by (cluster, host, status) (
              increase(certmanager_http_acme_client_request_count{status=~"4..|5.."}[1h])
            ) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'ACME requests to {{ "{{" }} $labels.host {{ "}}" }} failing with HTTP {{ "{{" }} $labels.status {{ "}}" }} ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'cert-manager is being rejected by the ACME endpoint, so certificate issuance and renewal cannot complete. Check for a Let''s Encrypt rate limit or an account problem before the expiry alerts start firing.'

        # kube-prometheus-stack's TargetDown already covers a discovered target
        # that returns up=0. This rule covers the complementary failure mode: the
        # cert-manager Application exists, but its target has disappeared from
        # service discovery entirely, so no up series remains for TargetDown to
        # evaluate. Sandbox omits the Application and therefore stays silent.
        - alert: CertManagerMetricsTargetMissing
          expr: |
            group by (cluster) (
              argocd_app_info{name="cert-manager"}
            )
            unless on (cluster)
            group by (cluster) (
              up{job="cert-manager"}
            )
          for: 15m
          labels:
            severity: warning
            namespace: cert-manager
          annotations:
            summary: 'cert-manager metrics target missing ({{ "{{" }} $labels.cluster {{ "}}" }})'
            description: 'ArgoCD expects cert-manager to be deployed, but Prometheus has no matching scrape target; certificate health and expiry alerts are blind.'
{{- end }}
