{{- /*
Argo CD is bootstrapped before the ServiceMonitor CRD, so its monitors live in
this wrapper. Metrics Services are enabled in k8s/argocd/values-common.yaml.

Both controller Services use the argocd-metrics name and differ by component;
repo-server and server have distinct names.

This template is shared by prd and sandbox. Each environment's scrape class
injects its cluster label.
*/ -}}
{{- $components := dict
  "application-controller" "argocd-metrics"
  "applicationset-controller" "argocd-metrics"
  "repo-server" "argocd-repo-server-metrics"
  "server" "argocd-server-metrics"
}}
{{- $i := 0 }}
{{- range $component, $serviceName := $components }}
{{- if $i }}
---
{{- end }}
{{- $i = add $i 1 }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: ["argocd"]
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $serviceName }}
      app.kubernetes.io/component: {{ $component }}
  endpoints:
    - port: http-metrics
      interval: 30s
{{- end }}
