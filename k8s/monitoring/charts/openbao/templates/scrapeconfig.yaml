apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    release: prometheus
spec:
  # Keep LAN infrastructure outside the prd cluster label.
  scrapeClass: external
  staticConfigs:
    {{- range .Values.targets }}
    - targets: ["{{ .ip }}:{{ $.Values.port }}"]
      labels:
        __tmp_name: {{ .name | quote }}
    {{- end }}
  relabelings:
    # Name IP-based scrapes.
    - action: replace
      sourceLabels: [__tmp_name]
      targetLabel: instance
  metricsPath: {{ .Values.metricsPath }}
  scheme: {{ .Values.scheme }}
  params:
    format: ["prometheus"]
  scrapeInterval: 30s
