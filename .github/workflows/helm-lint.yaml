name: Helm Lint

on:
  pull_request:
    paths:
      - ".github/workflows/helm-lint.yaml"
      - "k8s/**/*.yaml"
      - "k0s/helmfile.yaml.gotmpl"
      - "k0s/env/*.sh"
      - "k0s/values/**"
      - "k0s/charts/**"

permissions:
  contents: read

jobs:
  lint:
    name: helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Helm dependency update & lint
        run: |
          find k8s -name "Chart.yaml" | while IFS= read -r chart; do
            dir=$(dirname "$chart")
            if grep -q "dependencies:" "$chart"; then
              helm dependency update "$dir"
            fi
            helm lint "$dir"
          done

      - name: Install Helmfile
        env:
          # renovate: datasource=github-releases depName=helmfile/helmfile
          HELMFILE_VERSION: "1.7.4"
        run: |
          set -euo pipefail
          archive="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/${archive}" "${base_url}/${archive}"
          curl -fsSL -o "${RUNNER_TEMP}/helmfile_checksums.txt" \
            "${base_url}/helmfile_${HELMFILE_VERSION}_checksums.txt"
          expected=$(awk -v archive="$archive" '$2 == archive { print $1 }' \
            "${RUNNER_TEMP}/helmfile_checksums.txt")
          [ -n "$expected" ]
          echo "${expected}  ${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" helmfile
          chmod +x "${RUNNER_TEMP}/helmfile"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Render k0s Helmfile environments
        working-directory: k0s
        run: |
          set -euo pipefail
          for env_name in prd sandbox; do
            echo "::group::render k0s ${env_name}"
            (
              set -a
              # shellcheck source=/dev/null
              source "env/${env_name}.sh"
              set +a
              helmfile --file helmfile.yaml.gotmpl template > /dev/null
            )
            echo "::endgroup::"
          done

      - name: Install yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: "v4.53.6"
        run: |
          set -euo pipefail
          curl -fsSL -o "${RUNNER_TEMP}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "${RUNNER_TEMP}/yq"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      # Render each app-of-apps environment and validate enabled remote charts at
      # their pinned versions; local Chart.yaml charts are covered above.
      - name: Validate ArgoCD remote Helm sources
        run: |
          set -euo pipefail
          for env in prd sandbox; do
            rendered="${RUNNER_TEMP}/argocd-apps-${env}.yaml"
            helm template root-apps k8s/argocd/apps \
              -f "k8s/argocd/${env}/apps-values.yaml" > "$rendered"
            yq -o=json -I=0 \
              'select(.kind == "Application") | .spec.sources[] | select(has("chart"))' \
              "$rendered" |
            while IFS= read -r src; do
              repo=$(jq -r '.repoURL' <<<"$src")
              chart=$(jq -r '.chart' <<<"$src")
              version=$(jq -r '.targetRevision' <<<"$src")
              ignore_missing=$(jq -r '.helm.ignoreMissingValueFiles // false' <<<"$src")
              args=()
              while IFS= read -r vf; do
                [ -z "$vf" ] && continue
                # "$values" points to this repository's root.
                path="${vf#\$values/}"
                if [ -f "$path" ]; then
                  args+=(-f "$path")
                elif [ "$ignore_missing" != "true" ]; then
                  echo "::error::${env}/${chart}: value file ${path} not found"
                  exit 1
                fi
              done < <(jq -r '.helm.valueFiles // [] | .[]' <<<"$src")
              echo "::group::validate ${env} ${chart} ${version}"
              helm template "$chart" --repo "$repo" --version "$version" \
                ${args[@]+"${args[@]}"} > /dev/null
              echo "::endgroup::"
            done
          done
