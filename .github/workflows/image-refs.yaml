name: Image Reference Check

# Keep image filename mappings aligned with tf/customimage/images.hcl, their
# source of truth.
on:
  pull_request:
    paths:
      - "tf/customimage/images.hcl"
      - "tf/cloudimage/images.hcl"
      - "packer/build.sh"
      - "packer/push.sh"
      - "scripts/create-vm.sh"
      - "scripts/check-image-refs.sh"

permissions:
  contents: read

jobs:
  check:
    name: image-refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cross-check image filename maps
        run: ./scripts/check-image-refs.sh
