name: Vendor Sync Check

# Check vendored dotfiles (main) and powerdns-webui (tag) against upstream.
# The weekly run detects upstream drift; PR filters cover local edits and
# Renovate tag bumps.
on:
  pull_request:
    paths:
      - "scripts/install/vendor/**"
      - "k8s/pdns-ui/chart/web/**"
  schedule:
    - cron: "0 21 * * 0" # Monday 06:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: vendor-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check vendored installers against dotfiles
        run: ./scripts/install/vendor/sync.sh --check

      - name: Check vendored powerdns-webui against upstream
        if: always()
        run: ./k8s/pdns-ui/chart/web/sync.sh --check
