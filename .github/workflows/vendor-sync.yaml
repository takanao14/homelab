name: Vendor Sync Check

# Check vendored dotfiles and powerdns-webui against upstream.
# Pull requests validate the vendored copies against their recorded pin, so a
# deliberate pin does not fail review. The weekly run compares dotfiles against
# main instead, because nothing else advances that pin; Renovate bumps the
# powerdns-webui tag.
on:
  pull_request:
    paths:
      - "scripts/install/vendor/**"
      - "k8s/pdns-ui/chart/web/**"
  schedule:
    - cron: "0 21 * * 0" # Monday 06:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: vendor-sync-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check vendored installers against their recorded revision
        if: github.event_name == 'pull_request'
        run: ./scripts/install/vendor/sync.sh --check

      - name: Check vendored installers against the latest dotfiles main
        if: github.event_name != 'pull_request'
        run: ./scripts/install/vendor/sync.sh --check --upstream

      - name: Check vendored powerdns-webui against upstream
        if: always()
        run: ./k8s/pdns-ui/chart/web/sync.sh --check
