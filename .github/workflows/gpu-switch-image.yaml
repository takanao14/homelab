name: GPU Switch Image

on:
  pull_request:
    paths:
      - "k8s/gpu-switch/app/**"
      - ".github/workflows/gpu-switch-image.yaml"
  push:
    tags:
      - "gpu-switch/v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/takanao14/homelab/gpu-switch

jobs:
  build:
    name: gpu-switch-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s/gpu-switch/app/go.mod
          cache: false

      - name: Test
        working-directory: k8s/gpu-switch/app
        run: go test -race ./...

      - name: Vet
        working-directory: k8s/gpu-switch/app
        run: go vet ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=match,pattern=^gpu-switch/v(\d+\.\d+\.\d+)$,group=1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: k8s/gpu-switch/app
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
