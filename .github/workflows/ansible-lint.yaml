name: Ansible Lint

on:
  pull_request:
    paths:
      - ".github/workflows/ansible-lint.yaml"
      - "ansible/**"
      - "scripts/release-checksums.py"
  # PRs can only restore caches saved on the base branch, so refresh the
  # collections cache on main whenever its key changes.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ansible-lint.yaml"
      - "ansible/requirements.yaml"
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to validate (defaults to the event revision)
        type: string
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.10"

      - name: Install ansible-lint
        env:
          # renovate: datasource=pypi depName=ansible-lint
          ANSIBLE_LINT_VERSION: "26.11.0"
        run: uv pip install --system "ansible-lint==${ANSIBLE_LINT_VERSION}"

      # requirements.yaml pins exact versions, so its hash fully identifies the
      # installed set.
      - uses: actions/cache@v6
        with:
          path: ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yaml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml -p ansible/collections

      - name: Run ansible-lint
        run: ansible-lint ansible/playbooks/
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ansible/collections

  checksums:
    name: release-checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0

      - name: Detect pending automatic checksum refresh
        id: refresh
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'renovate[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_paths=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if ! grep -vxE 'ansible/roles/(forgejo|forgejo_runner)/defaults/main\.yaml' <<<"$changed_paths" >/dev/null; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo 'Checksum validation is delegated to Refresh release checksums.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.10"

      - name: Install PyYAML
        env:
          # renovate: datasource=pypi depName=PyYAML
          PYYAML_VERSION: "6.0.4"
        run: uv pip install --system "PyYAML==${PYYAML_VERSION}"

      - name: Verify pinned release checksums
        if: steps.refresh.outputs.pending != 'true'
        run: python scripts/release-checksums.py
