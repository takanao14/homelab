name: Ansible Lint

on:
  pull_request:
    paths:
      - ".github/workflows/ansible-lint.yaml"
      - "ansible/**"
  # PRs can only restore caches saved on the base branch, so refresh the
  # collections cache on main whenever its key changes.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ansible-lint.yaml"
      - "ansible/requirements.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ansible-lint
        env:
          # renovate: datasource=pypi depName=ansible-lint
          ANSIBLE_LINT_VERSION: "26.11.0"
        run: pip install "ansible-lint==${ANSIBLE_LINT_VERSION}"

      # requirements.yaml pins exact versions, so its hash fully identifies the
      # installed set.
      - uses: actions/cache@v6
        with:
          path: ansible/collections
          key: ansible-collections-${{ hashFiles('ansible/requirements.yaml') }}

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml -p ansible/collections

      - name: Run ansible-lint
        run: ansible-lint ansible/playbooks/
        env:
          ANSIBLE_ROLES_PATH: ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ansible/collections

  checksums:
    name: release-checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PyYAML
        env:
          # renovate: datasource=pypi depName=PyYAML
          PYYAML_VERSION: "6.0.3"
        run: pip install "PyYAML==${PYYAML_VERSION}"

      - name: Verify pinned release checksums
        run: |
          python - <<'PY'
          import hashlib
          import re
          import urllib.request
          from pathlib import Path

          import yaml

          targets = [
              (
                  'dnscollector',
                  'ansible/roles/dnscollector/defaults/main.yaml',
                  'dnscollector_version',
                  'dnscollector_sha256',
                  r'v\d+\.\d+\.\d+',
                  lambda v: f'https://github.com/dmachard/DNS-collector/releases/download/{v}/DNS-collector_{v[1:]}_linux_amd64.tar.gz',
              ),
              (
                  'seaweedfs',
                  'ansible/roles/seaweedfs/defaults/main.yaml',
                  'seaweedfs_version',
                  'seaweedfs_sha256',
                  r'\d+\.\d+(?:\.\d+)?',
                  lambda v: f'https://github.com/seaweedfs/seaweedfs/releases/download/{v}/linux_amd64.tar.gz',
              ),
              (
                  'forgejo',
                  'ansible/roles/forgejo/defaults/main.yaml',
                  'forgejo_version',
                  'forgejo_sha256',
                  r'\d+\.\d+\.\d+(?:-\d+)?',
                  lambda v: f'https://codeberg.org/forgejo/forgejo/releases/download/v{v}/forgejo-{v}-linux-amd64',
              ),
              (
                  'forgejo_runner',
                  'ansible/roles/forgejo_runner/defaults/main.yaml',
                  'forgejo_runner_version',
                  'forgejo_runner_sha256',
                  r'\d+\.\d+\.\d+',
                  lambda v: f'https://code.forgejo.org/forgejo/runner/releases/download/v{v}/forgejo-runner-{v}-linux-amd64',
              ),
          ]

          for name, path, version_key, sha_key, version_re, build_url in targets:
              pins = yaml.safe_load(Path(path).read_text())
              version = str(pins[version_key])
              expected = str(pins[sha_key])
              if not re.fullmatch(version_re, version) or not re.fullmatch(r'[a-f0-9]{64}', expected):
                  raise SystemExit(f'Invalid {name} release pins')
              try:
                  with urllib.request.urlopen(build_url(version), timeout=60) as archive:
                      actual = hashlib.file_digest(archive, 'sha256').hexdigest()
              except Exception:
                  raise SystemExit(f'Could not fetch {name} release archive') from None
              if actual != expected:
                  raise SystemExit(f'{name} release checksum mismatch')
              print(f'{name} release checksum verified')
          PY
