name: Packer Lint

on:
  pull_request:
    paths:
      - "packer/**"

permissions:
  contents: read

jobs:
  lint:
    name: packer-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-packer@v3
        with:
          # renovate: datasource=github-releases depName=hashicorp/packer
          version: "1.16.0"

      - name: Check formatting
        run: packer fmt -check -recursive packer/

      # Validate all vars against build.sh's shared template and the QEMU schema.
      # Retry once because checksum URL lookups can fail transiently; stub the SSH
      # key to avoid reading the runner's default key file.
      - name: Validate templates
        working-directory: packer
        run: |
          set -euo pipefail
          validate() {
            packer validate \
              -var-file "$1" \
              -var output_directory=output-ci \
              -var vm_name=ci.qcow2 \
              -var image_name=images/ci.img \
              -var user_password=ci-stub \
              -var ssh_pubkey="ssh-ed25519 AAAA ci-stub" \
              image.pkr.hcl
          }
          packer init image.pkr.hcl
          for var_file in vars/*.pkrvars.hcl; do
            echo "::group::validate ${var_file}"
            if ! validate "$var_file"; then
              echo "Transient failure validating ${var_file}; retrying in 15s..."
              sleep 15
              validate "$var_file"
            fi
            echo "::endgroup::"
          done
