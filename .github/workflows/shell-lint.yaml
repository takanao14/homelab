name: Shell Lint

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to validate (defaults to the event revision)
        type: string
        required: false
  pull_request:
    paths:
      - "**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}

      # Fail on warnings or worse; keep style and info findings local.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          find . -name '*.sh' -not -path './ansible/collections/*' -print0 \
            | xargs -0 shellcheck -S warning
