name: Shell Lint

on:
  pull_request:
    paths:
      - "**.sh"

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail on warnings or worse; keep style and info findings local.
      - name: Run shellcheck
        run: |
          set -euo pipefail
          find . -name '*.sh' -not -path './ansible/collections/*' -print0 \
            | xargs -0 shellcheck -S warning
