name: Proxy Route Check

# Keep manually maintained Caddy sites and Homepage links in sync.
on:
  pull_request:
    paths:
      - "ansible/inventories/homelab/group_vars/caddy.yaml"
      - "k8s/homepage/chart/config/services.yaml"
      - "scripts/check-proxy-routes.sh"
      - ".github/workflows/proxy-routes.yaml"

permissions:
  contents: read

jobs:
  check:
    name: proxy-routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cross-check Caddy sites against the Homepage dashboard
        run: ./scripts/check-proxy-routes.sh
