apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smoke-nfs-pvc
  namespace: smoke-test
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 100Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-nfs-write
  namespace: smoke-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: write
          image: busybox:stable
          command: ["sh", "-c", "echo 'nfs-smoke-test-ok' > /data/test.txt && sync"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: smoke-nfs-pvc
