# Schedule only on k0s-labelled GPU workers; NFD is disabled.
# Helm merges node_selector, so null the chart's NFD default explicitly.
# Recheck rendered selectors after chart bumps to avoid silently losing amd.com/gpu.
node_selector_enabled: true
node_selector:
  feature.node.kubernetes.io/pci-0300_1002.present: null
  gpu: amd
  kubernetes.io/arch: amd64

tolerations:
  - key: gpu
    operator: Equal
    value: amd
    effect: NoSchedule
